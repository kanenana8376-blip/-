    for (let d = 1; d <= n; d++) {
      const p = mdGet(md, 'pto', s.id, d);
      const c = p || mdGet(md, 'cells', s.id, d);
      const auto = !p && mdGet(md, 'auto', s.id, d);
      const cls = ['cell', dayCls(d)];
      if (p) cls.push('pto');
      if (auto) cls.push('auto');
      if (badCells.has(`${s.id}-${d}`)) cls.push('bad');
      if (view.highlight === `${s.id}-${d}`) cls.push('flash');
      if (view.swapSel && view.swapSel.id === s.id && view.swapSel.d === d) cls.push('swap-sel');
      const bg = c && CODES[c] ? ` style="background:${CODES[c].color}"` : '';
      row += `<td class="${cls.join(' ')}" data-id="${s.id}" data-day="${d}"${bg}${p ? ' title="休み希望"' : ''}>${c}</td>`;
    }
    const offBad = stt.empty === 0 ? stt.off !== stt.target : stt.off > stt.target;
    const nightBad = stt.nightUnits > s.nightMax;
    row += `<td class="stat${offBad ? ' bad' : ''}">${stt.off}/${stt.target}</td>`;
    row += `<td class="stat">${stt.paid || ''}</td>`;
    row += `<td class="stat${nightBad ? ' bad' : ''}" title="上限${s.nightMax}回">${stt.nightUnits || ''}${canNightType(s) ? `<span class="note">/${s.nightMax}</span>` : ''}</td>`;
    row += `<td class="stat">${stt.nightHours ? stt.nightHours + 'h' : ''}</td>`;
    row += `<td class="stat">${stt.weekendOff}</td>`;
    row += `<td class="stat${stt.paidLeft < 0 ? ' bad' : ''}">${stt.paidLeft}</td>`;
    body += `<tr>${row}</tr>`;
  });

  const sumRow = (label, fn, first) => {
    let r = `<tr class="sum${first ? ' sum-first' : ''}"><td class="name-col">${label}</td>`;
    for (let d = 1; d <= n; d++) {
      const [txt, state, title] = fn(a.days[d - 1], d);
      r += `<td class="${state || ''}" data-day="${d}" title="${esc(title || '')}" style="cursor:pointer">${txt}</td>`;
    }
    return r + '<td colspan="6"></td></tr>';
  };
  const names = ids => ids.map(id => staffById(id).name).join('、');
  const countState = (have, need) => (have < need ? 'short' : have > need ? 'over' : 'ok');
  // 日勤の必要人数を日ごとに入れる行（土日祝は4〜6人など日によって違うため）
  let reqRow = '<tr class="sum sum-first"><td class="name-col">日勤 必要人数<div class="note" style="font-weight:400">土日祝は日ごとに入力</div></td>';
  for (let d = 1; d <= n; d++) {
    const v = reqDay(y, m, d);
    const custom = md.reqDay && typeof md.reqDay[d] === 'number';
    const off = isOffDay(y, m, d);
    reqRow += `<td class="${dayCls(d)}" style="padding:1px"><input class="req-input${off ? ' off' : ''}${custom ? ' custom' : ''}" type="number" min="0" max="60" data-reqday="${d}" value="${v}" title="${m}/${d}の日勤の必要人数${custom ? '（この日だけ変更）' : '（基本の人数）'}"></td>`;
  }
  body += reqRow + '<td colspan="6"></td></tr>';
  body += sumRow('日勤（人数／必要）', day => [`${day.dayCount}`, countState(day.dayCount, day.req), `必要${day.req}人`]);
  [['準夜帯', 'eve', 'eveCheck', S.reqEve], ['深夜帯', 'late', 'lateCheck', S.reqLate]].forEach(([nm, key, ck, req]) => {
    body += sumRow(`${nm} 人数（必要${req}）`, day => [`${day[key].length}`, countState(day[key].length, req), names(day[key])]);
    body += sumRow(`${nm} うち中堅以上`, day => [`${day[ck].vet}`, day[ck].vet < S.minVet ? 'short' : 'ok', `中堅以上 ${day[ck].vet}人`]);
    body += sumRow(`${nm} 経験バランス`, day => {
      const probs = day[ck].problems;
      return [probs.length ? '✕' : (day[key].length ? '✓' : ''), probs.length ? 'short' : 'ok', probs.join(' ／ ') || 'OK'];
    });
  });

  const pens = [['', '選ぶ'], ...CODE_ORDER.map(c => [c, c]), ['PTO公', '★公'], ['PTO有', '★有'], ['ERASE', '✕消す'], ['SWAP', '⇄入れ替え']];
  const errors = a.issues.filter(i => i.sev === 'error').length;
  const warns = a.issues.length - errors;
  document.getElementById('main').innerHTML = `
    <div class="toolbar">
      <button class="btn primary" id="autoBtn">▶ 自動作成（空欄を埋める）</button>
      <button class="btn" id="clearAutoBtn">自動作成分を消す</button>
      <button class="btn" id="confirmAutoBtn" title="自動作成で入った勤務を手入力扱いにし、次の自動作成でも動かさない">自動作成分を確定</button>
      <button class="btn danger" id="clearMonthBtn">この月をすべて消す</button>
      <button class="btn" id="undoBtn" title="Ctrl+Z でも戻せます"${HISTORY.length ? '' : ' disabled'}>↶ 元に戻す</button>
      <span class="spacer"></span>
      <button class="btn" id="importBtn">Excelを読み込む</button>
      <button class="btn" id="excelBtn">Excelで保存</button>
      <button class="btn" id="printBtn">印刷</button>
    </div>
    <div class="palette">
      <span class="label">${view.pen === 'SWAP' ? (view.swapSel ? '入れ替える相手のマスをクリック' : '入れ替えたい1つ目のマスをクリック') : '続けて入力：記号を選んでからマスをクリック'}</span>
      ${pens.map(([v, t]) => `<button class="pen${(view.pen || '') === v ? ' active' : ''}" data-pen="${v}" style="background:${v && CODES[v] ? CODES[v].color : v.startsWith('PTO') ? '#f3ecd0' : '#fff'}" title="${v && CODES[v] ? CODES[v].name : ''}">${t}</button>`).join('')}
    </div>
    ${DB.staff.length ? '' : `<div class="panel" style="margin:0 0 10px;border-color:#e0a36b;background:#fff7ef">「${esc(DB.name)}」にはまだスタッフがいません。<b>スタッフ</b>タブで看護師を登録してください。</div>`}
    <div class="grid-wrap">
      <table class="grid">
        <thead><tr>${head1}</tr><tr>${head2}</tr></thead>
        <tbody>${body}</tbody>
      </table>
    </div>
    <div class="panel legend">
      ${CODE_ORDER.map(c => `<span><b style="background:${CODES[c].color}">${c}</b>${CODES[c].name}${CODES[c].time ? ' ' + CODES[c].time : ''}</span>`).join('')}
      <span>★＝休み希望　太字＝手入力　細字＝自動作成</span>
      <span>夜勤ありの人の平均夜勤時間：<b style="background:${a.avgNightHours > 72 ? 'var(--red-bg)' : 'var(--green-bg)'};padding:0 6px;">${a.avgNightHours.toFixed(1)}h</b>（目安72時間以内）</span>
    </div>
    <div class="panel">
      <h3>チェック結果　${a.issues.length ? `<span class="issues"><span class="sev error">要修正 ${errors}</span> <span class="sev warn">注意 ${warns}</span></span>` : ''}</h3>
      ${a.issues.length
        ? `<ul class="issues">${a.issues.map((i, k) => `<li data-k="${k}"><span class="sev ${i.sev}">${i.sev === 'error' ? '要修正' : '注意'}</span><span>${esc(i.msg)}</span></li>`).join('')}</ul>`
        : '<div class="ok-msg">✓ 問題は見つかりませんでした</div>'}
    </div>
  `;

  document.getElementById('autoBtn').onclick = runAutoGenerate;
  document.getElementById('clearAutoBtn').onclick = clearAuto;
  document.getElementById('clearMonthBtn').onclick = clearMonth;
  document.getElementById('confirmAutoBtn').onclick = confirmAuto;
  document.getElementById('undoBtn').onclick = undo;
  document.getElementById('importBtn').onclick = () => document.getElementById('xlsxInput').click();
  document.getElementById('excelBtn').onclick = exportToExcel;
  document.getElementById('printBtn').onclick = () => window.print();
  document.querySelectorAll('.pen').forEach(b => {
    b.onclick = () => { view.pen = b.dataset.pen || null; view.swapSel = null; renderGrid(); };
  });
  document.querySelectorAll('td.cell').forEach(td => {
    td.onclick = () => {
      const id = Number(td.dataset.id), d = Number(td.dataset.day);
      view.highlight = null;
      if (view.pen === 'SWAP') handleSwap(id, d);
      else if (view.pen) { pushHistory(); if (!applyCode(id, d, view.pen)) HISTORY.pop(); renderGrid(); }
      else openPicker(id, d);
    };
  });
  document.querySelectorAll('input[data-reqday]').forEach(inp => {
    inp.onclick = e => e.stopPropagation();
    inp.onchange = () => {
      const d = Number(inp.dataset.reqday);
      const v = inp.value === '' ? null : Math.max(0, Math.min(60, Math.round(Number(inp.value) || 0)));
      pushHistory();
      setReqDay(y, m, d, v);
      scheduleSave();
      renderGrid();
    };
  });
  document.querySelectorAll('thead th[data-day], tr.sum td[data-day]').forEach(th => {
    th.onclick = () => openDayDetail(Number(th.dataset.day));
  });
  document.querySelectorAll('.issues li[data-k]').forEach(li => {
    li.onclick = () => {
      const i = a.issues[Number(li.dataset.k)];
      if (i.id && i.d) {
        view.highlight = `${i.id}-${i.d}`;
        renderGrid();
        const td = document.querySelector(`td.cell[data-id="${i.id}"][data-day="${i.d}"]`);
        if (td) td.scrollIntoView({ block: 'center', inline: 'center', behavior: 'smooth' });
      } else if (i.d) {
        openDayDetail(i.d);
      }
    };
  });
}

// ============================================================
// 画面：スタッフ
// ============================================================
function renderStaff() {
  const rows = DB.staff.map((s, idx) => `
    <tr data-id="${s.id}">
      <td>${idx + 1}</td>
      <td><input type="text" data-f="name" value="${esc(s.name)}"></td>
      <td><select data-f="role">${ROLES.map(r => `<option${r === s.role ? ' selected' : ''}>${r}</option>`).join('')}</select></td>
      <td><select data-f="workType">${Object.keys(WORK_TYPES).map(k => `<option value="${k}"${k === s.workType ? ' selected' : ''}>${WORK_TYPES[k].label}</option>`).join('')}</select></td>
      <td><input type="number" min="1" max="50" data-f="nurseYear" value="${s.nurseYear}"> 年目</td>
      <td><input type="number" min="1" max="50" data-f="wardYear" value="${s.wardYear}"> 年目</td>
      <td><div class="chips">${expChips(s)}</div></td>
      <td style="text-align:center"><input type="checkbox" data-f="nightOK"${s.nightOK ? ' checked' : ''}${WORK_TYPES[s.workType].codes.some(isNight) ? '' : ' disabled'}></td>
      <td><input type="number" min="0" max="20" data-f="nightMax" value="${s.nightMax}"></td>
      <td><input type="number" min="-10" max="10" data-f="offAdjust" value="${s.offAdjust}"></td>
      <td style="text-align:center"><input type="checkbox" data-f="weekendOff"${s.weekendOff ? ' checked' : ''}></td>
      <td style="white-space:nowrap">
        <button class="btn small" data-act="up" title="上へ">↑</button>
        <button class="btn small" data-act="down" title="下へ">↓</button>
        <button class="btn small" data-act="detail">詳細</button>
        <button class="btn small danger" data-act="del">削除</button>
      </td>
    </tr>`).join('');
  const cnt = k => DB.staff.filter(s => s.workType === k).length;
  document.getElementById('main').innerHTML = `
    <div class="toolbar">
      <button class="btn primary" id="addStaffBtn">＋ スタッフを追加</button>
      <button class="btn" id="yearUpBtn">年度更新（全員の経験年数を+1）</button>
      <span class="spacer"></span>
      <button class="btn" id="backupBtn">バックアップを保存</button>
      <button class="btn" id="restoreBtn">バックアップを読み込む</button>
    </div>
    <div class="note" style="margin-bottom:8px;">
      <b>${esc(DB.name)}</b>　${DB.staff.length}名（${Object.keys(WORK_TYPES).map(k => `${WORK_TYPES[k].label} ${cnt(k)}名`).join('・')}）。
      経験年数は「今年度で何年目か」を入れてください（新卒1年目＝1）。異動・中途で来た人は、看護師経験は通算、病棟経験はこの病棟での年数です。
    </div>
    <div class="scroll-x">
      <table class="form">
        <thead><tr>
          <th>No</th><th>氏名</th><th>役職</th><th>勤務形態</th><th>看護師経験</th><th>病棟経験</th><th>区分</th>
          <th title="夜勤に入れるか（夜勤デビュー前の新人はオフ）">夜勤<br>可</th>
          <th title="月の夜勤回数の上限。2交代の夜勤は2回と数えます">夜勤<br>上限</th>
          <th title="公休の目標日数を人ごとに増減（週4勤務の人は+4など）">公休<br>調整</th>
          <th title="土日祝は休みにする（時短・日勤のみの人向け）">土日祝<br>休み</th>
          <th></th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <div class="panel">
      <h3>名前をまとめて追加</h3>
      <div class="note" style="margin-bottom:6px">新しい病棟を作ったときなどに。1行に1人ずつ名前を入れてください（あとで勤務形態・経験年数を入れます）。</div>
      <textarea id="bulkNames" rows="4" style="width:100%;max-width:420px;font-family:inherit;font-size:13px;padding:6px;border:1px solid var(--line);border-radius:5px" placeholder="山田 花子&#10;佐藤 美咲"></textarea>
      <div><button class="btn" id="bulkAddBtn" style="margin-top:6px">まとめて追加</button></div>
    </div>
  `;
  document.querySelectorAll('table.form tbody tr').forEach(tr => {
    const s = staffById(Number(tr.dataset.id));
    tr.querySelectorAll('[data-f]').forEach(inp => {
      inp.onchange = () => {
        const f = inp.dataset.f;
        if (inp.type === 'checkbox') s[f] = inp.checked;
        else if (inp.type === 'number') s[f] = Math.max(Number(inp.min), Math.min(Number(inp.max), Number(inp.value) || 0));
        else s[f] = inp.value.trim() || s[f];
        if (f === 'workType') {
          const nightType = WORK_TYPES[s.workType].codes.some(isNight);
          s.nightOK = nightType;
        }
        scheduleSave();
        renderStaff();
      };
    });
    tr.querySelectorAll('[data-act]').forEach(b => {
      b.onclick = () => {
        const i = DB.staff.indexOf(s);
        if (b.dataset.act === 'up' && i > 0) [DB.staff[i - 1], DB.staff[i]] = [DB.staff[i], DB.staff[i - 1]];
        if (b.dataset.act === 'down' && i < DB.staff.length - 1) [DB.staff[i + 1], DB.staff[i]] = [DB.staff[i], DB.staff[i + 1]];
        if (b.dataset.act === 'detail') { openStaffDetail(s.id); return; }
        if (b.dataset.act === 'del') {
          if (!confirm(`${s.name} を削除します。入力済みの勤務も表示されなくなります。よろしいですか？`)) return;
          DB.staff.splice(i, 1);
          DB.staff.forEach(o => {
            o.ngPartners = (o.ngPartners || []).filter(x => x !== s.id);
            if (o.mentorId === s.id) { o.mentorId = null; o.needMentor = false; }
          });
        }
        scheduleSave();
        renderStaff();
      };
    });
  });
  document.getElementById('bulkAddBtn').onclick = () => {
    const names = document.getElementById('bulkNames').value.split(/\r?\n/).map(x => x.trim()).filter(Boolean);
    if (!names.length) { showToast('名前を1行に1人ずつ入れてください', 'error'); return; }
    names.forEach(nm => DB.staff.push(normalizeStaff(st(DB.nextId++, nm, 'スタッフ', '3交代', 1, 1))));
    scheduleSave();
    renderStaff();
    showToast(`${names.length}人を追加しました。勤務形態と経験年数を入れてください`);
  };
  document.getElementById('addStaffBtn').onclick = () => {
    const id = DB.nextId++;
    DB.staff.push(normalizeStaff(st(id, `看護師${String(id).padStart(2, '0')}`, 'スタッフ', '3交代', 1, 1)));
    scheduleSave();
    renderStaff();
  };
  document.getElementById('yearUpBtn').onclick = () => {
    if (!confirm('全員の看護師経験・病棟経験を1年ずつ増やします（4月の年度替わりに1回だけ押してください）。よろしいですか？')) return;
    DB.staff.forEach(s => { s.nurseYear++; s.wardYear++; });
    scheduleSave();
    renderStaff();
    showToast('経験年数を更新しました');
  };
  document.getElementById('backupBtn').onclick = saveBackup;
  document.getElementById('restoreBtn').onclick = () => document.getElementById('backupInput').click();
}

// ============================================================
// スタッフの詳細（夜勤の約束ごと・指導者・有給）
// ============================================================
function openStaffDetail(id) {
  const s = staffById(id);
  const nightCodes = WORK_TYPES[s.workType].codes.filter(isNight);
  const others = DB.staff.filter(o => o.id !== s.id && canNightType(o));
  const ngGrid = nightCodes.length ? `
    <table class="form" style="margin-top:4px">
      <tr><th></th>${WEEKDAYS_JP.map((w, i) => `<th style="text-align:center;${i === 0 ? 'color:#c62828' : i === 6 ? 'color:#1565c0' : ''}">${w}</th>`).join('')}</tr>
      ${nightCodes.map(c => `<tr><th>${CODES[c].name}</th>${WEEKDAYS_JP.map((_, w) => `<td style="text-align:center"><input type="checkbox" data-ng="${w}" data-code="${c}"${((s.nightNg || {})[w] || []).includes(c) ? ' checked' : ''}></td>`).join('')}</tr>`).join('')}
    </table>` : '<div class="note">この勤務形態には夜勤がありません。</div>';
  document.getElementById('staffDetailTitle').textContent = `${s.name} の詳細`;
  document.getElementById('staffDetailBody').innerHTML = `
    <div class="chips" style="margin-bottom:10px">${expChips(s)}</div>
    <h4 style="margin:10px 0 4px">夜勤に入れない曜日（チェックした曜日・種類には入れません）</h4>
    <div class="note">例：保育園の送迎で水曜は夜勤不可、土曜の準夜だけ不可 など</div>
    ${ngGrid}
    <div class="field" style="margin-top:10px"><div>夜勤回数の下限<div class="hint">これより少ないと知らせます。上限は${s.nightMax}回（スタッフ一覧で変更）</div></div>
      <div><input type="number" id="sdNightMin" min="0" max="20" value="${s.nightMin || 0}"> 回</div></div>
    <h4 style="margin:14px 0 4px">指導者（プリセプター）</h4>
    <div class="field"><div>指導者</div>
      <div><select id="sdMentor"><option value="">なし</option>${DB.staff.filter(o => o.id !== s.id).map(o => `<option value="${o.id}"${o.id === s.mentorId ? ' selected' : ''}>${esc(o.name)}${isVet(o) ? '（中堅以上）' : ''}</option>`).join('')}</select></div></div>
    <div class="field"><div>夜勤は指導者と同じ帯にする<div class="hint">夜勤の独り立ち前の新人向け。指導者がいない夜勤帯には入れません</div></div>
      <div><input type="checkbox" id="sdNeedMentor"${s.needMentor ? ' checked' : ''}></div></div>
    <h4 style="margin:14px 0 4px">同じ夜勤帯に入れない人</h4>
    <div class="chips" style="gap:6px 12px">${others.map(o => `<label style="font-size:12px;white-space:nowrap"><input type="checkbox" data-ngp="${o.id}"${isNgPair(s, o) ? ' checked' : ''}> ${esc(o.name)}</label>`).join('') || '<span class="note">夜勤に入る人がいません</span>'}</div>
    <h4 style="margin:14px 0 4px">有給休暇</h4>
    <div class="field"><div>年間の付与日数</div><div><input type="number" id="sdPaidGranted" min="0" max="40" value="${s.paidGranted}"> 日</div></div>
    <div class="field"><div>今月より前に使った日数<div class="hint">年度の途中から使い始める場合に入れてください</div></div><div><input type="number" id="sdPaidUsed" min="0" max="40" value="${s.paidUsedBefore}"> 日</div></div>
    <h4 style="margin:14px 0 4px">メモ</h4>
    <input type="text" id="sdMemo" value="${esc(s.memo || '')}" style="width:100%" placeholder="配慮事項など">
  `;
  const body = document.getElementById('staffDetailBody');
  const changed = () => { scheduleSave(); if (view.tab === 'staff') renderStaff(); };
  body.querySelectorAll('[data-ng]').forEach(cb => {
    cb.onchange = () => {
      const w = cb.dataset.ng, c = cb.dataset.code;
      s.nightNg = s.nightNg || {};
      const list = new Set(s.nightNg[w] || []);
      if (cb.checked) list.add(c); else list.delete(c);
      if (list.size) s.nightNg[w] = [...list]; else delete s.nightNg[w];
      changed();
    };
  });
  body.querySelectorAll('[data-ngp]').forEach(cb => {
    cb.onchange = () => {
      const o = staffById(Number(cb.dataset.ngp));
      // 相手側にも同じ設定を持たせて、どちらから見ても分かるようにする
      [[s, o], [o, s]].forEach(([a, b]) => {
        a.ngPartners = (a.ngPartners || []).filter(x => x !== b.id);
        if (cb.checked) a.ngPartners.push(b.id);
      });
      changed();
    };
  });
  const num = (el, min, max) => Math.max(min, Math.min(max, Number(el.value) || 0));
  document.getElementById('sdNightMin').onchange = e => { s.nightMin = num(e.target, 0, 20); changed(); };
  document.getElementById('sdMentor').onchange = e => { s.mentorId = e.target.value ? Number(e.target.value) : null; if (!s.mentorId) { s.needMentor = false; document.getElementById('sdNeedMentor').checked = false; } changed(); };
  document.getElementById('sdNeedMentor').onchange = e => {
    if (e.target.checked && !s.mentorId) { e.target.checked = false; showToast('先に指導者を選んでください', 'error'); return; }
    s.needMentor = e.target.checked; changed();
  };
  document.getElementById('sdPaidGranted').onchange = e => { s.paidGranted = num(e.target, 0, 40); changed(); };
  document.getElementById('sdPaidUsed').onchange = e => { s.paidUsedBefore = num(e.target, 0, 40); changed(); };
  document.getElementById('sdMemo').onchange = e => { s.memo = e.target.value; changed(); };
  document.getElementById('staffOverlay').classList.add('show');
}

function renderStatus() {
  const { y, m } = view;
  const S = DB.settings;
  const n = daysInMonth(y, m);
  const md = monthData(y, m);
  const plan = buildPlan(y, m, false);
  const a = analyze(plan);
  const ptoStaff = DB.staff.filter(s => a.staffStats[s.id].ptoCount > 0);
  const noPto = DB.staff.filter(s => a.staffStats[s.id].ptoCount === 0);
  const complete = DB.staff.filter(s => a.staffStats[s.id].empty === 0);
  const ptoOver = DB.staff.filter(s => a.staffStats[s.id].ptoCount > S.maxPtoRequests);
  const paidOver = DB.staff.filter(s => a.staffStats[s.id].paidLeft < 0);
  const nightShort = DB.staff.filter(s => s.nightOK && s.nightMin && a.staffStats[s.id].empty === 0 && a.staffStats[s.id].nightUnits < s.nightMin);
  const crewBadDays = a.days.filter(dd => dd.eveCheck.problems.length || dd.lateCheck.problems.length);
  const errors = a.issues.filter(i => i.sev === 'error').length;
  const nothing = !DB.staff.some(s => Object.keys(md.cells[s.id] || {}).length || Object.keys(md.pto[s.id] || {}).length);

  let deadline = '';
  if (S.ptoDeadline) {
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const left = Math.round((new Date(S.ptoDeadline + 'T00:00:00') - today) / 86400000);
    deadline = `<div class="card${left <= 3 ? ' warn' : ''}"><div class="num" style="font-size:18px">${left > 0 ? `あと${left}日` : left === 0 ? '本日締切' : `${-left}日超過`}</div><div class="lbl">休み希望の締切（${S.ptoDeadline}）</div></div>`;
  }
  const chipList = arr => arr.length
    ? `<div class="chips" style="gap:6px">${arr.map(([s, extra]) => `<button class="btn small" data-staff="${s.id}">${esc(s.name)}${extra ? `（${extra}）` : ''}</button>`).join('')}</div>`
    : '<div class="note">該当する人はいません。</div>';
  const section = (title, hint, arr) => `<div class="panel"><h3>${title}</h3>${hint ? `<div class="note" style="margin-bottom:6px">${hint}</div>` : ''}${chipList(arr)}</div>`;
  document.getElementById('main').innerHTML = `
    <h2 style="font-size:17px;margin:0 0 10px">${y}年${m}月の入力状況</h2>
    <div class="cards">
      <div class="card"><div class="num">${DB.staff.length}</div><div class="lbl">スタッフ</div></div>
      <div class="card"><div class="num">${ptoStaff.length}</div><div class="lbl">休み希望を入れた人</div></div>
      <div class="card"><div class="num">${complete.length}</div><div class="lbl">全日入力済みの人</div></div>
      <div class="card${errors ? ' warn' : ''}"><div class="num">${errors}</div><div class="lbl">要修正（勤務表タブで確認）</div></div>
      <div class="card"><div class="num">${a.avgNightHours.toFixed(1)}h</div><div class="lbl">夜勤ありの人の平均夜勤時間</div></div>
      <div class="card${a.nightCap < a.nightNeed ? ' warn' : ''}"><div class="num" style="font-size:18px">${a.nightCap}／${a.nightNeed}回</div><div class="lbl">夜勤の上限回数の合計／必要な回数</div></div>
      ${deadline}
    </div>
    ${nothing ? `<div class="panel guide"><h3>はじめに ― 3ステップで勤務表ができます</h3><ol>
      <li><b>スタッフ</b>タブで、勤務形態と看護師経験・病棟経験の年数を確認します（夜勤の約束ごとは「詳細」から）。</li>
      <li><b>勤務表</b>タブで、休み希望（★）と決まっている勤務を入れます。</li>
      <li>「▶ 自動作成」を押し、下のチェック結果を見ながら手直しします。</li></ol></div>` : ''}
    ${section('まだ休み希望が入っていない人', '休み希望がない人もいるので、提出済みかどうかの確認に使ってください。', noPto.map(s => [s]))}
    ${ptoOver.length ? section(`⚠ 休み希望が${S.maxPtoRequests}日を超えている人`, '上限は「設定」で変えられます。', ptoOver.map(s => [s, a.staffStats[s.id].ptoCount + '日'])) : ''}
    ${paidOver.length ? section('⚠ 有給が年間の残日数を超えている人', '付与日数と今月より前に使った日数は、スタッフの「詳細」で変えられます。', paidOver.map(s => [s, '残' + a.staffStats[s.id].paidLeft + '日'])) : ''}
    ${nightShort.length ? section('⚠ 夜勤が下限に届いていない人', '', nightShort.map(s => [s, `${a.staffStats[s.id].nightUnits}/${s.nightMin}回`])) : ''}
    <div class="panel"><h3>夜勤の経験バランスに問題がある日</h3>
      ${crewBadDays.length ? `<div class="chips" style="gap:6px">${crewBadDays.map(dd => `<button class="btn small" data-day="${dd.d}">${m}/${dd.d}(${WEEKDAYS_JP[weekday(y, m, dd.d)]})</button>`).join('')}</div>` : '<div class="ok-msg">✓ すべての夜勤帯で条件を満たしています</div>'}
    </div>
    <div class="panel"><h3>休み希望の締切</h3>
      <div class="field"><div>締切日<div class="hint">入れると上にカウントダウンが出ます</div></div><div><input type="date" id="ptoDeadline" value="${S.ptoDeadline || ''}"></div></div>
    </div>`;
  document.querySelectorAll('#main [data-staff]').forEach(b => { b.onclick = () => openStaffDetail(Number(b.dataset.staff)); });
  document.querySelectorAll('#main [data-day]').forEach(b => { b.onclick = () => openDayDetail(Number(b.dataset.day)); });
  document.getElementById('ptoDeadline').onchange = e => { S.ptoDeadline = e.target.value || null; scheduleSave(); renderStatus(); };
}

          <td style="white-space:nowrap">${w.id === STORE.currentId ? '<b style="color:var(--navy)">表示中</b>' : `<button class="btn small" data-ward-open="${w.id}">開く</button>`}
            ${STORE.wards.length > 1 ? `<button class="btn small danger" data-ward-del="${w.id}">削除</button>` : ''}</td>
        </tr>`).join('')}
      </table>
      <div class="toolbar" style="margin:10px 0 0">
        <input type="text" id="newWardName" placeholder="例：3階東病棟" style="width:170px">
        <label style="font-size:12px"><input type="checkbox" id="newWardCopy" checked> 今の病棟の設定を引き継ぐ</label>
        <label style="font-size:12px"><input type="checkbox" id="newWardSample"> サンプルのスタッフ30名を入れる</label>
        <button class="btn primary" id="addWardBtn">＋ 病棟を追加</button>
      </div>

    <div class="settings-grid">
      <div class="panel">
        <h3>必要人数（${esc(DB.name)}）</h3>
        ${num('reqDayWeekday', 0, 60, '平日の日勤')}
        ${num('reqDayHoliday', 0, 60, '土日祝の日勤（基本）', '日ごとの人数は勤務表の「日勤 必要人数」の行で入れます（4〜6人など）')}
        ${num('reqEve', 0, 20, '準夜帯', '準夜（3交代）＋夜勤（2交代）の合計')}
        ${num('reqLate', 0, 20, '深夜帯', '深夜（3交代）＋前日からの夜勤（2交代）の合計')}

        ${num('minVet', 0, 10, '中堅以上の最低人数（1つの夜勤帯）')}

        ${num('maxNewbie', 0, 10, '新人（看護師1年目）の上限（1つの夜勤帯）')}
        ${num('maxWardNew', 0, 10, '病棟1年目の上限（1つの夜勤帯）', '異動・中途で来た人も含みます')}

          <div><select id="maxConsecWorkSel">${[4, 5].map(v => `<option value="${v}"${S.maxConsecWork === v ? ' selected' : ''}>${v}日まで</option>`).join('')}</select></div></div>
        <div class="field"><div>夜勤の連続<div class="hint">準夜・深夜・2交代夜勤を何日続けてよいか</div></div>

        ${chk('restAfterAke', '2交代の夜勤明けの翌日は休みにする')}
        ${num('maxPtoRequests', 0, 31, '休み希望は1人何日まで', '★公・★有の合計。これを超える希望は入力できません')}
        <div class="field"><div>公休の目標日数<div class="hint">空欄＝その月の土日祝の日数（${view.y}年${view.m}月は${autoOff}日）</div></div>
          <div><input type="number" id="offOverride" min="0" max="20" value="${S.offTargetOverride ?? ''}" placeholder="${autoOff}"></div></div>
        <div class="note">準夜の翌日は「休み」か「準夜」、深夜の翌日は「休み」「深夜」「準夜」のどれかにします。休み希望の前日に準夜（2交代夜勤も）、休み希望の翌日に深夜は入れません。</div>
      </div>
      <div class="panel">
        <h3>夜勤時間（72時間ルールの目安）</h3>
        <div class="field"><div>準夜勤 1回の夜勤時間</div><div><input type="number" data-h="準" min="0" max="24" value="${S.hours['準']}"> h</div></div>
        <div class="field"><div>深夜勤 1回の夜勤時間</div><div><input type="number" data-h="深" min="0" max="24" value="${S.hours['深']}"> h</div></div>
        <div class="field"><div>2交代夜勤 1回の夜勤時間</div><div><input type="number" data-h="夜" min="0" max="24" value="${S.hours['夜']}"> h</div></div>
        <div class="note">勤務表の下に「夜勤ありの人の平均夜勤時間」を表示します。正式な計算は病院の届出の定義に合わせて確認してください。</div>
      </div>
      <div class="panel">
        <h3>データ</h3>
        <div class="note">入力内容はこのブラウザに自動保存されます。別のパソコンで使うときや念のための控えには、スタッフ画面の「バックアップを保存」を使ってください。</div>
        <div style="margin-top:10px"><button class="btn danger" id="resetBtn">すべての病棟を初期状態に戻す</button></div>
      </div>
    </div>
  `;
  document.querySelectorAll('[data-s]').forEach(inp => {
    inp.onchange = () => {
      const k = inp.dataset.s;
      if (inp.type === 'checkbox') S[k] = inp.checked;
      else S[k] = Math.max(Number(inp.min), Math.min(Number(inp.max), Number(inp.value) || 0));
      scheduleSave();
      renderSettings();
    };
  });
  document.getElementById('maxConsecWorkSel').onchange = e => { S.maxConsecWork = Number(e.target.value); scheduleSave(); };
  document.getElementById('maxConsecNightSel').onchange = e => { S.maxConsecNight = Number(e.target.value); scheduleSave(); };
  document.querySelectorAll('[data-h]').forEach(inp => {
    inp.onchange = () => { S.hours[inp.dataset.h] = Math.max(0, Number(inp.value) || 0); scheduleSave(); };
  });
  document.getElementById('offOverride').onchange = e => {
    S.offTargetOverride = e.target.value === '' ? null : Math.max(0, Number(e.target.value));
    scheduleSave();
    renderSettings();
  };
  document.getElementById('resetBtn').onclick = () => {
    if (!confirm('すべての病棟のスタッフ・設定・勤務表を削除して初期状態に戻します。よろしいですか？')) return;
    try { localStorage.removeItem(STORAGE_KEY); localStorage.removeItem(OLD_STORAGE_KEY); } catch (e) {}
    location.reload();
  };
  document.querySelectorAll('[data-ward-name]').forEach(inp => {
    inp.onchange = () => {
      const w = STORE.wards.find(x => x.id === Number(inp.dataset.wardName));
      const name = inp.value.trim();
      if (!name) { inp.value = w.name; return; }
      if (STORE.wards.some(x => x !== w && x.name === name)) { showToast('同じ名前の病棟があります', 'error'); inp.value = w.name; return; }
      w.name = name;
      scheduleSave();
      render();
    };
  });
  document.querySelectorAll('[data-ward-open]').forEach(b => { b.onclick = () => switchWard(Number(b.dataset.wardOpen)); });
  document.querySelectorAll('[data-ward-del]').forEach(b => { b.onclick = () => deleteWard(Number(b.dataset.wardDel)); });
  document.getElementById('addWardBtn').onclick = () => {
    const name = document.getElementById('newWardName').value.trim();
    if (!name) { showToast('病棟名を入れてください', 'error'); return; }
    if (STORE.wards.some(w => w.name === name)) { showToast('同じ名前の病棟があります', 'error'); return; }
    addWard(name, document.getElementById('newWardCopy').checked, document.getElementById('newWardSample').checked);
  };
}

      <p>勤務の入ったマスをクリックし「代わりを探す」を押すと、代わりに入れる人が一覧で出ます。代わった後の勤務表をまるごとチェックして、問題が増えない人から順に並べます。</p>
      <h3>便利な操作</h3>
      <ul>
        <li><b>⇄入れ替え</b>：2つのマスを順にクリックすると勤務を交換します（2交代の夜勤は明けと一緒に動きます）。</li>
        <li><b>↶ 元に戻す</b>（Ctrl+Z）：直前の操作を取り消します。</li>
        <li><b>自動作成分を確定</b>：自動で入った勤務を手入力扱いにして、次の自動作成でも動かさないようにします。</li>
        <li><b>Excelを読み込む</b>：このツールで保存したExcelを読み込みます（氏名で突き合わせます）。</li>
        <li><b>入力状況</b>タブ：休み希望の締切、希望の多すぎる人、有給の残日数、夜勤の経験バランスに問題がある日をまとめて見られます。</li>
      </ul>
      <h3>月をまたぐ勤務</h3>
      <p>前の月の最終日が2交代夜勤なら、その月の1日は自動で「明」になります。前の月の勤務表もこのツールで作っておくと、月初めの勤務の並びもチェックされます。</p>
    </div>
  `;
}

function buildWardWorkbook(y, m) {
  const plan = buildPlan(y, m, false);
  const a = analyze(plan);
  const n = plan.n;
  const S = DB.settings;
  const reg = new StyleRegistry();
  const sty = {
    title: reg.style({ bold: true, size: 14 }),
    head: reg.style({ bold: true, fill: '1F4E79', color: 'FFFFFF', halign: 'center', valign: 'center', border: true }),
    sat: reg.style({ bold: true, fill: 'DCE8F7', color: '1565C0', halign: 'center', border: true }),
    sun: reg.style({ bold: true, fill: 'FDE3E1', color: 'C62828', halign: 'center', border: true }),
    text: reg.style({ border: true, valign: 'center' }),
    center: reg.style({ border: true, halign: 'center', valign: 'center' }),
    sum: reg.style({ bold: true, fill: 'F3F1EA', border: true }),
    sumC: reg.style({ bold: true, fill: 'F3F1EA', border: true, halign: 'center' }),
    bad: reg.style({ bold: true, fill: 'FFC7CE', color: '9C0006', border: true, halign: 'center' }),
    err: reg.style({ color: '9C0006', border: true }),
    warn: reg.style({ color: '9C6500', border: true }),
  };
  const codeStyle = {};
  CODE_ORDER.forEach(c => { codeStyle[c] = reg.style({ bold: true, fill: CODES[c].color.slice(1), halign: 'center', border: true }); });

  const sh = new SheetBuilder('勤務表');
  sh.set('A1', `${DB.name} ${y}年${m}月 勤務表`, { style: sty.title });
  const fixedCols = ['氏名', '役職', '勤務形態', '看護師経験', '病棟経験'];
  fixedCols.forEach((h, i) => { sh.set(colLetter(i + 1) + '3', h, { style: sty.head }); sh.merge(`${colLetter(i + 1)}3:${colLetter(i + 1)}4`); });
  const dc = d => colLetter(fixedCols.length + d);
  for (let d = 1; d <= n; d++) {
    const w = weekday(y, m, d);
    const s = (w === 0 || isJapaneseHoliday(y, m, d)) ? sty.sun : w === 6 ? sty.sat : sty.head;
    sh.set(dc(d) + '3', d, { style: s });
    sh.set(dc(d) + '4', WEEKDAYS_JP[w], { style: s });
    sh.colWidth(dc(d), 3.6);
  }
  const tail = ['公休', '有給', '夜勤回数', '夜勤時間', '土日祝休み', '有給残'];
  tail.forEach((h, i) => { const c = colLetter(fixedCols.length + n + 1 + i); sh.set(c + '3', h, { style: sty.head }); sh.merge(`${c}3:${c}4`); sh.colWidth(c, 7); });
  sh.colWidth('A', 14).colWidth('B', 7).colWidth('C', 10).colWidth('D', 9).colWidth('E', 8);
  let r = 5;
  DB.staff.forEach(s => {
    const stt = a.staffStats[s.id];
    sh.set('A' + r, s.name, { style: sty.text });
    sh.set('B' + r, s.role, { style: sty.center });
    sh.set('C' + r, WORK_TYPES[s.workType].short, { style: sty.center });
    sh.set('D' + r, `${s.nurseYear}年目`, { style: isNewbie(s) ? sty.bad : sty.center });
    sh.set('E' + r, `${s.wardYear}年目`, { style: isWardNew(s) ? sty.bad : sty.center });
    for (let d = 1; d <= n; d++) {
      const c = plan.get(s.id, d);
      sh.set(dc(d) + r, c + (plan.pto[s.id][d] ? '★' : ''), { style: c && codeStyle[c] ? codeStyle[c] : sty.center });
    }
    const t0 = fixedCols.length + n + 1;
    sh.set(colLetter(t0) + r, `${stt.off}/${stt.target}`, { style: sty.center });
    sh.set(colLetter(t0 + 1) + r, stt.paid, { style: sty.center });
    sh.set(colLetter(t0 + 2) + r, stt.nightUnits, { style: stt.nightUnits > s.nightMax ? sty.bad : sty.center });
    sh.set(colLetter(t0 + 3) + r, stt.nightHours, { style: sty.center });
    sh.set(colLetter(t0 + 4) + r, stt.weekendOff, { style: sty.center });
    sh.set(colLetter(t0 + 5) + r, stt.paidLeft, { style: stt.paidLeft < 0 ? sty.bad : sty.center });
    r++;
  });
  const sumRows = [
    ['日勤 必要人数', day => [day.req, false]],
    ['日勤', day => [day.dayCount, day.dayCount < day.req]],
    ['準夜帯', day => [day.eve.length, day.eve.length < S.reqEve]],
    ['準夜帯 中堅以上', day => [day.eveCheck.vet, day.eveCheck.vet < S.minVet]],
    ['準夜帯 経験バランス', day => [day.eveCheck.problems.length ? '✕' : '○', day.eveCheck.problems.length > 0]],
    ['深夜帯', day => [day.late.length, day.late.length < S.reqLate]],
    ['深夜帯 中堅以上', day => [day.lateCheck.vet, day.lateCheck.vet < S.minVet]],
    ['深夜帯 経験バランス', day => [day.lateCheck.problems.length ? '✕' : '○', day.lateCheck.problems.length > 0]],
  ];
  sumRows.forEach(([label, fn]) => {
    sh.set('A' + r, label, { style: sty.sum });
    sh.merge(`A${r}:E${r}`);
    for (let d = 1; d <= n; d++) {
      const [v, bad] = fn(a.days[d - 1]);
      sh.set(dc(d) + r, v, { style: bad ? sty.bad : sty.sumC });
    }
    r++;
  });
  sh.set('A' + (r + 1), '★＝休み希望', {});
  sh.freeze(4, 1);

  const sh2 = new SheetBuilder('スタッフ一覧');
  ['氏名', '役職', '勤務形態', '看護師経験', '病棟経験', '区分', '夜勤可', '夜勤上限', '夜勤下限', '公休調整', '土日祝休み', '曜日の夜勤NG', '同じ夜勤にしない人', '指導者', '有給付与', 'メモ'].forEach((h, i) => sh2.set(colLetter(i + 1) + '1', h, { style: sty.head }));
  DB.staff.forEach((s, i) => {
    const rr = i + 2;
    const kinds = [];
    if (isNewbie(s)) kinds.push('新人'); else if (isYoung(s)) kinds.push('若手');
    if (isWardNew(s)) kinds.push('病棟1年目');
    if (isVet(s)) kinds.push('中堅以上');
    const mt = s.mentorId && staffById(s.mentorId);
    [s.name, s.role, WORK_TYPES[s.workType].label, s.nurseYear, s.wardYear, kinds.join('・'), s.nightOK ? '○' : '×', s.nightMax, s.nightMin || 0, s.offAdjust, s.weekendOff ? '○' : '',
      nightNgLabel(s), (s.ngPartners || []).map(staffById).filter(Boolean).map(o => o.name).join('、'), mt ? mt.name + (s.needMentor ? '（夜勤同伴）' : '') : '', s.paidGranted, s.memo || '']
      .forEach((v, k) => sh2.set(colLetter(k + 1) + rr, v, { style: sty.text }));
  });
  sh2.colWidth('A', 14).colWidth('C', 20).colWidth('F', 20).colWidth('L', 22).colWidth('M', 20).colWidth('N', 18).colWidth('P', 24);
  sh2.freeze(1, 1);

  const sh3 = new SheetBuilder('チェック結果');
  sh3.set('A1', '区分', { style: sty.head }).set('B1', '内容', { style: sty.head });
  if (!a.issues.length) sh3.set('A2', '問題は見つかりませんでした', {});
  a.issues.forEach((i, k) => {
    sh3.set('A' + (k + 2), i.sev === 'error' ? '要修正' : '注意', { style: i.sev === 'error' ? sty.err : sty.warn });
    sh3.set('B' + (k + 2), i.msg, { style: sty.text });
  });
  sh3.colWidth('A', 10).colWidth('B', 80);

  return renderWorkbook([sh, sh2, sh3], reg, []);
}

// ============================================================
// Excelの読み込み（外来版ツールと同じ読み取り部品を使う）
// ============================================================
async function readZipEntries(arrayBuffer) {
  const data = new Uint8Array(arrayBuffer);
  const view = new DataView(arrayBuffer);

  // find End Of Central Directory record by scanning from the end
  let eocdOffset = -1;
  for (let i = data.length - 22; i >= 0 && i >= data.length - 22 - 65536; i--) {
    if (view.getUint32(i, true) === 0x06054b50) { eocdOffset = i; break; }
  }
  if (eocdOffset === -1) throw new Error('ZIPの終端レコードが見つかりません（ファイルが壊れている可能性があります）');

  const entryCount = view.getUint16(eocdOffset + 10, true);
  const centralDirOffset = view.getUint32(eocdOffset + 16, true);

  const entries = {};
  let pos = centralDirOffset;
  for (let i = 0; i < entryCount; i++) {
    if (view.getUint32(pos, true) !== 0x02014b50) break;
    const compMethod = view.getUint16(pos + 10, true);
    const compSize = view.getUint32(pos + 20, true);
    const uncompSize = view.getUint32(pos + 24, true);
    const nameLen = view.getUint16(pos + 28, true);
    const extraLen = view.getUint16(pos + 30, true);
    const commentLen = view.getUint16(pos + 32, true);
    const localHeaderOffset = view.getUint32(pos + 42, true);
    const name = new TextDecoder().decode(data.slice(pos + 46, pos + 46 + nameLen));

    // local header: read actual compressed data location (name/extra length can differ from central dir, so re-read)
    const lhNameLen = view.getUint16(localHeaderOffset + 26, true);
    const lhExtraLen = view.getUint16(localHeaderOffset + 28, true);
    const dataStart = localHeaderOffset + 30 + lhNameLen + lhExtraLen;
    const compData = data.slice(dataStart, dataStart + compSize);

    entries[name] = { compMethod, compData, uncompSize };
    pos += 46 + nameLen + extraLen + commentLen;
  }

  // inflate any DEFLATE entries
  const result = {};
  for (const [name, entry] of Object.entries(entries)) {
    if (entry.compMethod === 0) {
      result[name] = entry.compData;
    } else if (entry.compMethod === 8) {
      result[name] = await inflateRaw(entry.compData);
    } else {
      throw new Error(`未対応の圧縮方式です (${name})`);
    }
  }
  return result;
}

async function inflateRaw(compressedBytes) {
  if (typeof DecompressionStream === 'undefined') {
    throw new Error('このブラウザはZIP解凍に対応していません。Chrome/Edge/Firefoxの最新版をお使いください。');
  }
  const ds = new DecompressionStream('deflate-raw');
  const stream = new Blob([compressedBytes]).stream().pipeThrough(ds);
  const buf = await new Response(stream).arrayBuffer();
  return new Uint8Array(buf);
}

function bytesToStr(bytes) { return new TextDecoder('utf-8').decode(bytes); }

// ---------- minimal XML helpers (regex-based, sufficient for OOXML's predictable structure) ----------
function extractAttr(tag, attr) {
  const m = tag.match(new RegExp(attr + '="([^"]*)"'));
  return m ? m[1] : null;
}

function decodeXmlEntities(s) {
  return s.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"')
    .replace(/&apos;/g, "'").replace(/&#(\d+);/g, (_, n) => String.fromCharCode(n))
    .replace(/&amp;/g, '&');
}

function parseSharedStrings(xml) {
  if (!xml) return [];
  const strings = [];
  const siBlocks = xml.match(/<si>[\s\S]*?<\/si>/g) || [];
  siBlocks.forEach(block => {
    const texts = (block.match(/<t[^>]*>([\s\S]*?)<\/t>/g) || [])
      .map(t => decodeXmlEntities(t.replace(/<t[^>]*>/, '').replace('</t>', '')));
    strings.push(texts.join(''));
  });
  return strings;
}

function parseSheetXml(xml, sharedStrings) {
  const cells = {};
  const rowBlocks = xml.match(/<row [^>]*>[\s\S]*?<\/row>|<row [^>]*\/>/g) || [];
  rowBlocks.forEach(rowBlock => {
    const cellTags = rowBlock.match(/<c [^>]*\/>|<c [^>]*>[\s\S]*?<\/c>/g) || [];
    cellTags.forEach(cTag => {
      const ref = extractAttr(cTag, 'r');
      if (!ref) return;
      const type = extractAttr(cTag, 't');
      let value = null;
      const vMatch = cTag.match(/<v>([\s\S]*?)<\/v>/);
      const isMatch = cTag.match(/<is>([\s\S]*?)<\/is>/);
      if (type === 's' && vMatch) {
        const idx = parseInt(vMatch[1], 10);
        value = sharedStrings[idx] !== undefined ? sharedStrings[idx] : '';
      } else if (type === 'inlineStr' && isMatch) {
        const tMatch = isMatch[1].match(/<t[^>]*>([\s\S]*?)<\/t>/);
        value = tMatch ? decodeXmlEntities(tMatch[1]) : '';
      } else if (vMatch) {
        const raw = vMatch[1];
        value = type === 'str' ? decodeXmlEntities(raw) : parseFloat(raw);
      }
      if (value !== null && value !== '') cells[ref] = value;
    });
  });
  return cells;
}

function parseWorkbookSheetNames(workbookXml, relsXml) {
  const sheetTags = workbookXml.match(/<sheet [^>]*\/>/g) || [];
  const relMap = {};
  (relsXml.match(/<Relationship [^>]*\/>/g) || []).forEach(r => {
    const id = extractAttr(r, 'Id');
    const target = extractAttr(r, 'Target');
    relMap[id] = target;
  });
  return sheetTags.map(tag => ({
    name: decodeXmlEntities(extractAttr(tag, 'name')),
    rId: extractAttr(tag, 'r:id'),
    target: relMap[extractAttr(tag, 'r:id')],
  }));
}

// ============================================================
// Public API
// ============================================================
async function readXlsxFile(arrayBuffer) {
  const files = await readZipEntries(arrayBuffer);
  const decoded = {};
  Object.entries(files).forEach(([name, bytes]) => { decoded[name] = bytesToStr(bytes); });

  const workbookXml = decoded['xl/workbook.xml'];
  const relsXml = decoded['xl/_rels/workbook.xml.rels'];
  if (!workbookXml || !relsXml) throw new Error('xlsxの構造を認識できませんでした（workbook.xmlが見つかりません）');

  const sheetMeta = parseWorkbookSheetNames(workbookXml, relsXml);
  const sharedStrings = parseSharedStrings(decoded['xl/sharedStrings.xml']);

  const sheets = {};
  sheetMeta.forEach(meta => {
    const path = 'xl/' + meta.target.replace(/^\/?xl\//, '').replace(/^\.?\//, '');
    const xml = decoded[path] || decoded[meta.target] || decoded['xl/' + meta.target];
    if (!xml) return;
    sheets[meta.name] = parseSheetXml(xml, sharedStrings);
  });
  return sheets;
}

function colNumFromRef(ref) {
  const m = ref.match(/^([A-Z]+)(\d+)$/);
  let n = 0;
  for (let i = 0; i < m[1].length; i++) n = n * 26 + (m[1].charCodeAt(i) - 64);
  return { col: n, row: parseInt(m[2], 10) };
}

// このツールで保存した「勤務表」シートを読み込む。氏名で人を突き合わせる。
async function importWardExcel(file) {
  showLoading(true);
  try {
    const sheets = await readXlsxFile(await file.arrayBuffer());
    const sh = sheets['勤務表'];
    if (!sh) throw new Error('「勤務表」シートが見つかりません（このツールで保存したExcelを選んでください）');
    const title = String(sh['A1'] || '');
    const tm = title.match(/(\d{4})年(\d{1,2})月/);
    let [y, m] = tm ? [Number(tm[1]), Number(tm[2])] : [view.y, view.m];
    const fileWard = tm ? title.slice(0, tm.index).trim() : '';
    if (fileWard && fileWard !== DB.name && !confirm(`このファイルは「${fileWard}」の勤務表です。いま表示中の「${DB.name}」に読み込みます。よろしいですか？`)) return;
    if ((y !== view.y || m !== view.m) && !confirm(`このファイルは${y}年${m}月の勤務表です。${y}年${m}月として読み込みます。よろしいですか？`)) return;
    // 3行目の日付見出しから、日付の列を探す
    const dayCol = {};
    Object.keys(sh).forEach(ref => {
      const { col, row } = colNumFromRef(ref);
      if (row === 3 && typeof sh[ref] === 'number') dayCol[sh[ref]] = col;
    });
    if (!dayCol[1]) throw new Error('日付の見出し（3行目）が見つかりません');
    const n = daysInMonth(y, m);
    const byName = {};
    DB.staff.forEach(s => { byName[s.name] = s; });
    const rows = {};
    Object.keys(sh).forEach(ref => { const { col, row } = colNumFromRef(ref); if (col === 1 && row >= 5) rows[row] = String(sh[ref]).trim(); });
    view.y = y; view.m = m;
    syncMonthInputs();
    pushHistory();
    const md = monthData(y, m);
    let matched = 0;
    const unknown = [];
    Object.entries(rows).forEach(([row, name]) => {
      const s = byName[name];
      if (!s) { if (!/帯|日勤|休み希望/.test(name)) unknown.push(name); return; }
      matched++;
      md.cells[s.id] = {}; md.pto[s.id] = {}; md.auto[s.id] = {};
      for (let d = 1; d <= n; d++) {
        const v = String(sh[colLetter(dayCol[d]) + row] || '').trim();
        if (!v) continue;
        const code = v.replace('★', '');
        if (!CODES[code]) continue;
        if (v.includes('★') && (code === '公' || code === '有')) mdSet(md, 'pto', s.id, d, code);
        else mdSet(md, 'cells', s.id, d, code);
      }
    });
    scheduleSave();
    render();
    showToast(`${y}年${m}月の勤務表を読み込みました（${matched}人${unknown.length ? `／名簿にない${unknown.length}人は読み飛ばし：${unknown.slice(0, 3).join('、')}${unknown.length > 3 ? '…' : ''}` : ''}）`, unknown.length ? 'error' : 'success');
  } catch (err) {
    console.error(err);
    showToast('読み込めませんでした: ' + err.message, 'error');
  } finally {
    showLoading(false);
  }
}
document.getElementById('xlsxInput').onchange = e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (file) importWardExcel(file);
};

// ファイルの渡し方は開き方によって変わる。
//   ・HTMLファイルを直接開いた場合 … 通常のリンクでダウンロードする
//   ・Webページ（claude.ai）で開いた場合 … 閲覧者に確認を出す仕組みを通して渡す
async function saveGeneratedFile(blob, filename) {
  try {
    const downloads = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    if (downloads) {
      await downloads.save({ filename, data: blob });
      return { ok: true, via: 'viewer' };
    }
  } catch (e) {
    return { ok: false, code: (e && e.code) || 'unavailable', message: (e && e.message) || '' };
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  return { ok: true, via: 'link' };
}
function reportSave(res, fname) {
  if (res.ok) showToast(`${fname} を保存しました`);
  else if (res.code === 'declined') showToast('保存を取り消しました');
  else showToast('保存できませんでした。HTMLファイル版をお使いください', 'error');
}
function exportToExcel() {
  const { y, m } = view;
  showLoading(true);
  setTimeout(async () => {
    try {
      const bytes = buildWardWorkbook(y, m);
      const blob = new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      const fname = `${DB.name}_勤務表_${y}年${m}月.xlsx`;
      reportSave(await saveGeneratedFile(blob, fname), fname);
    } catch (e) {
      console.error(e);
      showToast('Excelの作成に失敗しました: ' + e.message, 'error');
    } finally {
      showLoading(false);
    }
  }, 30);
}
async function saveBackup() {
  const blob = new Blob([JSON.stringify(STORE, null, 1)], { type: 'application/json' });
  const d = new Date();
  const fname = `勤務表_全病棟バックアップ_${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}.json`;
  reportSave(await saveGeneratedFile(blob, fname), fname);
}

      applyLoaded(data);
    } else {
      // 病棟が1つだった頃のバックアップは、新しい病棟として追加する
      const w = normalizeWard(clone(data), '読み込んだ病棟');
      let name = w.name;
      for (let i = 2; STORE.wards.some(x => x.name === name); i++) name = `${w.name}(${i})`;
      if (!confirm(`このバックアップを新しい病棟「${name}」として追加します。よろしいですか？`)) return;
      w.id = STORE.nextWardId++;
      w.name = name;
      STORE.wards.push(w);
      STORE.currentId = w.id;
      DB = w;
      HISTORY.length = 0;
    }
    saveState();
    syncMonthInputs();
    render();
    showToast('バックアップを読み込みました');
  } catch (err) {
    showToast('読み込めませんでした: ' + err.message, 'error');
  }
};

// ============================================================
// 共通
// ============================================================
function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('error', type === 'error');
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.classList.remove('show'), 3200);
}
function showLoading(show) { document.getElementById('loading').classList.toggle('show', show); }

function render() {
  renderWardSelect();
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === view.tab));
  if (view.tab === 'grid') renderGrid();
  else if (view.tab === 'staff') renderStaff();
  else if (view.tab === 'status') renderStatus();
  else if (view.tab === 'settings') renderSettings();
  else renderGuide();
}
function syncMonthInputs() {
  document.getElementById('yearInput').value = view.y;
  document.getElementById('monthInput').value = view.m;
}
function setMonth(y, m) {
  view.y = y; view.m = m; view.highlight = null;
  syncMonthInputs();
  scheduleSave();
  render();
}

document.querySelectorAll('#tabs button').forEach(b => {
  b.onclick = () => { view.tab = b.dataset.tab; render(); };
});
document.getElementById('wardSelect').onchange = e => switchWard(Number(e.target.value));
document.getElementById('prevMonthBtn').onclick = () => setMonth(...prevYM(view.y, view.m));
document.getElementById('nextMonthBtn').onclick = () => setMonth(...nextYM(view.y, view.m));
['yearInput', 'monthInput'].forEach(id => {
  document.getElementById(id).onchange = () => {
    const y = Number(document.getElementById('yearInput').value);
    const m = Number(document.getElementById('monthInput').value);
    if (y >= 2020 && y <= 2100 && m >= 1 && m <= 12) setMonth(y, m);
    else syncMonthInputs();
  };
});
document.getElementById('pickerClose').onclick = () => closeOverlay('pickerOverlay');
document.getElementById('dayClose').onclick = () => closeOverlay('dayOverlay');
document.getElementById('staffDetailClose').onclick = () => { closeOverlay('staffOverlay'); render(); };
['pickerOverlay', 'dayOverlay', 'staffOverlay'].forEach(id => {
  document.getElementById(id).addEventListener('click', e => { if (e.target.id === id) closeOverlay(id); });
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    const wasStaff = document.getElementById('staffOverlay').classList.contains('show');
    ['pickerOverlay', 'dayOverlay', 'staffOverlay'].forEach(closeOverlay);
    if (wasStaff) render();
  }
  const typing = /INPUT|SELECT|TEXTAREA/.test((document.activeElement || {}).tagName || '');
  if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !typing) { e.preventDefault(); undo(); }
});

(function init() {
  const today = new Date();
  [view.y, view.m] = nextYM(today.getFullYear(), today.getMonth() + 1);
  loadState();
  syncMonthInputs();
  render();
})();
</script>
</body>
</html>
