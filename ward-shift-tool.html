<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>病棟勤務表ツール</title>
<style>
  :root {
    --navy: #1F4E79;
    --navy-dark: #163a59;
    --ink: #2c2c2a;
    --muted: #6b6b68;
    --line: #d8d6cd;
    --bg: #f7f5f0;
    --panel: #ffffff;
    --red: #c0392b;
    --red-bg: #fde2e1;
    --orange-bg: #ffe8cc;
    --purple-bg: #ede4f7;
    --green-bg: #dff0d8;
    --yellow-bg: #fff4c2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 13px;
  }
  header {
    background: var(--navy);
    color: #fff;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  header h1 { font-size: 18px; margin: 0; letter-spacing: 0.02em; }
  header .sub { font-size: 12px; color: #cfe0ee; margin-top: 2px; }
  .month-input { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .month-input input {
    border: none; border-radius: 4px; padding: 6px 8px; font-size: 13px; width: 72px;
  }
  .month-nav-btn {
    background: rgba(255,255,255,0.15); color: #fff; border: 1px solid rgba(255,255,255,0.35);
    border-radius: 4px; padding: 5px 9px; cursor: pointer; font-size: 12px;
  }
  .month-nav-btn:hover { background: rgba(255,255,255,0.28); }
  .ward-select { border: none; border-radius: 4px; padding: 6px 8px; font-size: 13px; font-weight: 700; max-width: 180px; }
  .autosave-indicator { font-size: 11px; color: #cfe0ee; margin-left: 6px; }

  nav.tabs {
    display: flex; gap: 2px; padding: 0 24px; background: var(--panel);
    border-bottom: 1px solid var(--line); overflow-x: auto;
  }
  nav.tabs button {
    border: none; background: none; padding: 12px 16px; font-size: 14px; cursor: pointer;
    color: var(--muted); border-bottom: 3px solid transparent; font-family: inherit; white-space: nowrap;
  }
  nav.tabs button.active { color: var(--navy); border-bottom-color: var(--navy); font-weight: 700; }
  main { padding: 16px 24px 60px; }

  .btn {
    border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 6px;
    padding: 7px 12px; font-size: 13px; cursor: pointer; font-family: inherit;
  }
  .btn:hover { background: #f0eee7; }
  .btn.primary { background: var(--navy); color: #fff; border-color: var(--navy); }
  .btn.primary:hover { background: var(--navy-dark); }
  .btn.danger { color: var(--red); border-color: #e6b8b3; }
  .btn.small { padding: 4px 8px; font-size: 12px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  .toolbar .spacer { flex: 1; }

  .palette {
    display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-bottom: 10px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
  }
  .palette .label { font-size: 12px; color: var(--muted); margin-right: 6px; }
  .pen {
    border: 2px solid transparent; border-radius: 6px; padding: 4px 8px; cursor: pointer; font-size: 13px;
    font-family: inherit; min-width: 34px;
  }
  .pen.active { border-color: var(--navy); box-shadow: 0 0 0 2px #bcd3ea; font-weight: 700; }

  .grid-wrap {
    overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    max-height: calc(100vh - 260px);
  }
  table.grid { border-collapse: separate; border-spacing: 0; font-size: 12px; }
  table.grid th, table.grid td {
    border-right: 1px solid #e6e4dc; border-bottom: 1px solid #e6e4dc; text-align: center;
    padding: 0; height: 30px; min-width: 30px;
  }
  table.grid thead th {
    position: sticky; top: 0; background: #f3f1ea; z-index: 2; font-weight: 600; cursor: pointer;
  }
  table.grid thead tr:nth-child(2) th { top: 30px; }
  table.grid th.name-col, table.grid td.name-col {
    position: sticky; left: 0; background: #fff; z-index: 1; text-align: left; padding: 3px 8px;
    min-width: 190px; max-width: 220px; cursor: default;
  }
  table.grid thead th.name-col { z-index: 3; background: #f3f1ea; }
  table.grid th.sat { color: #1565c0; background: #e8f0fb; }
  table.grid th.sun { color: #c62828; background: #fdecea; }
  table.grid td.sat { background-color: #f5f9ff; }
  table.grid td.sun { background-color: #fff6f5; }
  table.grid td.cell { cursor: pointer; font-weight: 700; font-size: 13px; position: relative; }
  table.grid td.cell:hover { outline: 2px solid var(--navy); outline-offset: -2px; }
  table.grid td.cell.auto { font-weight: 400; }
  table.grid td.cell.pto::after {
    content: '★'; position: absolute; top: 0; right: 1px; font-size: 8px; color: #b8860b;
  }
  .req-input {
    width: 30px; padding: 2px 0; text-align: center; font-size: 12px; font-weight: 700; border: 1px solid transparent;
    background: transparent; -moz-appearance: textfield;
  }
  .req-input::-webkit-outer-spin-button, .req-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .req-input.off { border-color: #e0a36b; background: #fff7ef; }
  .req-input.custom { border-color: var(--navy); background: #e8f0f8; color: var(--navy); }
  table.grid td.cell.swap-sel { box-shadow: inset 0 0 0 3px #ff9800; }
  .btn:disabled { opacity: 0.45; cursor: default; }
  table.grid td.cell.bad { box-shadow: inset 0 0 0 2px var(--red); }
  table.grid td.cell.flash { animation: flash 1.2s ease-out 2; }
  @keyframes flash { 0% { box-shadow: inset 0 0 0 3px #ff9800; } 100% { box-shadow: none; } }
  table.grid td.stat { padding: 0 6px; min-width: 44px; font-size: 12px; white-space: nowrap; }
  table.grid td.stat.bad { color: var(--red); font-weight: 700; background: var(--red-bg); }
  table.grid tr.sum td { background: #faf9f5; font-weight: 600; }
  table.grid tr.sum td.name-col { background: #f3f1ea; font-size: 12px; }
  table.grid tr.sum-first td { border-top: 2px solid #b9b6aa; }
  table.grid tr.sum td.ok { color: #2e7d32; }
  table.grid tr.sum td.short { color: var(--red); background: var(--red-bg); }
  table.grid tr.sum td.over { color: #9c6500; background: var(--yellow-bg); }
  .staff-name { font-weight: 700; font-size: 13px; }
  .chips { display: flex; gap: 3px; flex-wrap: wrap; margin-top: 2px; }
  .chip {
    font-size: 10px; padding: 0 5px; border-radius: 8px; background: #eef1f4; color: #444; line-height: 16px;
    white-space: nowrap;
  }
  .chip.new { background: var(--red-bg); color: #9c0006; font-weight: 700; }
  .chip.young { background: var(--orange-bg); color: #8a4b00; }
  .chip.wardnew { background: var(--purple-bg); color: #5b2d8e; font-weight: 700; }
  .chip.vet { background: var(--green-bg); color: #2e6b1f; }
  .chip.type { background: #e0e8f0; color: var(--navy); }
  .chip.nonight { background: #eee; color: #777; }

  .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px;
    margin-top: 14px;
  }
  .panel h3 { margin: 0 0 10px; font-size: 14px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
  .card .num { font-size: 24px; font-weight: 700; color: var(--navy); }
  .card .lbl { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .card.warn { border-color: #e6b8b3; background: var(--red-bg); }
  .card.warn .num { color: var(--red); }
  .issues { list-style: none; margin: 0; padding: 0; max-height: 320px; overflow: auto; }
  .issues li { padding: 5px 8px; border-radius: 5px; cursor: pointer; display: flex; gap: 8px; }
  .issues li:hover { background: #f0eee7; }
  .issues .sev { font-size: 11px; font-weight: 700; border-radius: 4px; padding: 0 6px; white-space: nowrap; }
  .issues .sev.error { background: var(--red-bg); color: #9c0006; }
  .issues .sev.warn { background: var(--yellow-bg); color: #9c6500; }
  .ok-msg { color: #2e7d32; font-weight: 700; }
  .legend { display: flex; flex-wrap: wrap; gap: 10px 16px; font-size: 12px; color: var(--muted); }
  .legend span b { display: inline-block; min-width: 22px; text-align: center; border-radius: 4px; color: var(--ink); margin-right: 4px; }

  table.form { border-collapse: collapse; background: var(--panel); font-size: 13px; }
  table.form th, table.form td { border: 1px solid var(--line); padding: 5px 6px; text-align: left; }
  table.form th { background: #f3f1ea; font-weight: 600; white-space: nowrap; font-size: 12px; }
  table.form input[type=text] { width: 110px; }
  table.form input[type=number] { width: 58px; }
  input, select {
    font-family: inherit; font-size: 13px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 5px;
  }
  .scroll-x { overflow-x: auto; }
  .settings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 14px; }
  .settings-grid .panel { margin-top: 0; }
  .field { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px dashed #eee; }
  .field:last-child { border-bottom: none; }
  .field .hint { font-size: 11px; color: var(--muted); }
  .note { font-size: 12px; color: var(--muted); line-height: 1.7; }
  .guide h3 { margin-top: 20px; }
  .guide p, .guide li { line-height: 1.8; }

  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.35); display: none; align-items: center;
    justify-content: center; z-index: 50; padding: 16px;
  }
  .overlay.show { display: flex; }
  .modal {
    background: #fff; border-radius: 10px; padding: 18px 20px; width: 100%; max-width: 560px;
    max-height: 90vh; overflow: auto; box-shadow: 0 10px 40px rgba(0,0,0,0.25);
  }
  .modal h3 { margin: 0 0 4px; font-size: 16px; }
  .modal .sub { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
  .code-buttons { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 6px; }
  .code-btn {
    border: 1px solid var(--line); border-radius: 6px; padding: 8px 6px; cursor: pointer; text-align: left;
    font-family: inherit; font-size: 13px; line-height: 1.3;
  }
  .code-btn b { font-size: 16px; margin-right: 4px; }
  .code-btn small { display: block; color: #555; font-size: 10px; }
  .code-btn.dim { opacity: 0.45; }
  .modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  .crew { margin: 6px 0 12px; }
  .crew .member { display: flex; align-items: center; gap: 6px; padding: 3px 0; }
  .rule { font-size: 12px; padding: 2px 0; }
  .rule.ng { color: var(--red); font-weight: 700; }
  .rule.okr { color: #2e7d32; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); opacity: 0;
    background: #2e7d32; color: #fff; padding: 10px 18px; border-radius: 6px; transition: all .25s;
    z-index: 100; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.error { background: var(--red); }
  .loading {
    position: fixed; inset: 0; background: rgba(255,255,255,0.6); display: none; align-items: center;
    justify-content: center; z-index: 90; font-size: 15px; font-weight: 700; color: var(--navy);
  }
  .loading.show { display: flex; }

  @media (max-width: 640px) {
    header, main { padding-left: 16px; padding-right: 16px; }
    nav.tabs { padding: 0 8px; }
    table.grid th.name-col, table.grid td.name-col { min-width: 130px; }
  }

  @media print {
    @page { size: A3 landscape; margin: 8mm; }
    header .month-input, nav.tabs, .toolbar, .palette, .no-print { display: none !important; }
    header { background: #fff; color: #000; padding: 0 0 6px; }
    header .sub { display: none; }
    main { padding: 0; }
    .grid-wrap { max-height: none; overflow: visible; border: none; }
    table.grid thead th { position: static; }
    table.grid th.name-col, table.grid td.name-col { position: static; min-width: 120px; }
    table.grid th, table.grid td { height: 20px; min-width: 20px; font-size: 10px; }
    body { -webkit-print-color-adjust: exact; print-color-adjust: exact; background: #fff; }
  }
</style>
</head>
<body>

<header>
  <div>
    <h1 id="titleText">病棟 勤務表作成ツール</h1>
    <div class="sub">3交代・2交代・時短勤務が混在する病棟向け ／ 夜勤メンバーの経験年数バランスを自動チェック</div>
  </div>
  <div class="month-input">
    <label for="wardSelect">病棟</label>
    <select id="wardSelect" class="ward-select" title="病棟を切り替える"></select>
    <span style="width:10px"></span>
    <button class="month-nav-btn" id="prevMonthBtn" aria-label="前の月">◀</button>
    <input type="number" id="yearInput" min="2020" max="2100">年
    <input type="number" id="monthInput" min="1" max="12">月
    <button class="month-nav-btn" id="nextMonthBtn" aria-label="次の月">▶</button>
    <span class="autosave-indicator" id="autosaveIndicator"></span>
  </div>
</header>

<nav class="tabs" id="tabs">
  <button data-tab="grid" class="active">勤務表</button>
  <button data-tab="status">入力状況</button>
  <button data-tab="staff">スタッフ</button>
  <button data-tab="settings">設定</button>
  <button data-tab="guide">使い方</button>
</nav>

<main id="main"></main>

<div class="overlay" id="pickerOverlay">
  <div class="modal">
    <h3 id="pickerTitle"></h3>
    <div class="sub" id="pickerSub"></div>
    <div id="pickerBody"></div>
    <div class="modal-footer">
      <button class="btn" id="pickerClose">閉じる</button>
    </div>
  </div>
</div>

<div class="overlay" id="staffOverlay">
  <div class="modal" style="max-width:640px">
    <h3 id="staffDetailTitle"></h3>
    <div class="sub">変更はすぐに保存されます</div>
    <div id="staffDetailBody"></div>
    <div class="modal-footer">
      <button class="btn" id="staffDetailClose">閉じる</button>
    </div>
  </div>
</div>

<div class="overlay" id="dayOverlay">
  <div class="modal">
    <h3 id="dayTitle"></h3>
    <div class="sub">この日の勤務メンバーと、夜勤の経験バランスの判定です</div>
    <div id="dayBody"></div>
    <div class="modal-footer">
      <button class="btn" id="dayClose">閉じる</button>
    </div>
  </div>
</div>

<input type="file" id="backupInput" accept=".json" style="display:none;">
<input type="file" id="xlsxInput" accept=".xlsx" style="display:none;">
<div class="toast" id="toast"></div>
<div class="loading" id="loading">勤務表を作成しています…</div>

<script>
/*
  Expanded dependency-free XLSX writer (v2).
  Supports multiple sheets, formulas, fills, merged cells, column
  widths/hidden columns, conditional formatting rules, and basic
  data validation lists. Builds a valid OOXML package using an
  uncompressed ("STORE") ZIP container by hand, so it needs zero
  external libraries and works fully offline.

  This is a small, purpose-built subset of OOXML -- not a general
  spreadsheet engine. It deliberately writes FORMULAS as formula
  strings (no cached value), which is valid OOXML; Excel/LibreOffice
  recalculate on open.
*/

// ---------- CRC32 ----------
const CRC_TABLE = (() => {
  const table = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    table[n] = c >>> 0;
  }
  return table;
})();
function crc32(bytes) {
  let crc = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) crc = CRC_TABLE[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
  return (crc ^ 0xFFFFFFFF) >>> 0;
}
function strToBytes(str) { return new TextEncoder().encode(str); }

// ---------- minimal ZIP (store, no compression) ----------
function buildZip(files) {
  const localParts = [];
  const centralParts = [];
  let offset = 0;
  files.forEach(file => {
    const nameBytes = strToBytes(file.name);
    const data = file.data;
    const crc = crc32(data);
    const size = data.length;

    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true);
    lh.setUint16(4, 20, true);
    lh.setUint32(14, crc, true);
    lh.setUint32(18, size, true);
    lh.setUint32(22, size, true);
    lh.setUint16(26, nameBytes.length, true);
    const localChunk = new Uint8Array(30 + nameBytes.length + size);
    localChunk.set(new Uint8Array(lh.buffer), 0);
    localChunk.set(nameBytes, 30);
    localChunk.set(data, 30 + nameBytes.length);
    localParts.push(localChunk);

    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true);
    ch.setUint16(4, 20, true);
    ch.setUint16(6, 20, true);
    ch.setUint32(16, crc, true);
    ch.setUint32(20, size, true);
    ch.setUint32(24, size, true);
    ch.setUint16(28, nameBytes.length, true);
    ch.setUint32(42, offset, true);
    const centralChunk = new Uint8Array(46 + nameBytes.length);
    centralChunk.set(new Uint8Array(ch.buffer), 0);
    centralChunk.set(nameBytes, 46);
    centralParts.push(centralChunk);

    offset += localChunk.length;
  });
  const centralStart = offset;
  let centralSize = 0;
  centralParts.forEach(p => centralSize += p.length);
  const eocd = new DataView(new ArrayBuffer(22));
  eocd.setUint32(0, 0x06054b50, true);
  eocd.setUint16(8, files.length, true);
  eocd.setUint16(10, files.length, true);
  eocd.setUint32(12, centralSize, true);
  eocd.setUint32(16, centralStart, true);
  const out = new Uint8Array(offset + centralSize + 22);
  let pos = 0;
  localParts.forEach(p => { out.set(p, pos); pos += p.length; });
  centralParts.forEach(p => { out.set(p, pos); pos += p.length; });
  out.set(new Uint8Array(eocd.buffer), pos);
  return out;
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
}
function colLetter(n) {
  let s = '';
  while (n > 0) { const rem = (n - 1) % 26; s = String.fromCharCode(65 + rem) + s; n = Math.floor((n - 1) / 26); }
  return s;
}

// ============================================================
// Sheet builder: a thin object model so calling code can describe
// a sheet declaratively, then renderWorkbook() turns N of these
// into a complete xlsx.
// ============================================================
class SheetBuilder {
  constructor(name) {
    this.name = name;
    this.cells = {};       // 'A1' -> {v, f, s (style key), t}
    this.merges = [];      // 'A1:B1'
    this.colWidths = {};   // 'A' -> width
    this.colHidden = {};   // 'A' -> true
    this.rowHeights = {};  // 1 -> height
    this.condFormats = []; // {ref, type, formula, dxfId}
    this.dataValidations = []; // {ref, formula1}
    this.freezeRow = 0;
    this.freezeCol = 0;
    this.showGridLines = true;
    this.tabColor = null;
  }
  set(ref, value, opts) {
    opts = opts || {};
    this.cells[ref] = { v: value, s: opts.style || null, formula: !!opts.formula };
    return this;
  }
  formula(ref, formulaStr, opts) {
    opts = opts || {};
    this.cells[ref] = { f: formulaStr, s: opts.style || null };
    return this;
  }
  merge(ref) { this.merges.push(ref); return this; }
  colWidth(letterOrRange, width) {
    if (letterOrRange.includes(':')) {
      const [a, b] = letterOrRange.split(':');
      const start = colNum(a), end = colNum(b);
      for (let i = start; i <= end; i++) this.colWidths[colLetter(i)] = width;
    } else this.colWidths[letterOrRange] = width;
    return this;
  }
  hideCol(letter) { this.colHidden[letter] = true; return this; }
  rowHeight(row, h) { this.rowHeights[row] = h; return this; }
  freeze(row, col) { this.freezeRow = row; this.freezeCol = col; return this; }
  noGrid() { this.showGridLines = false; return this; }
  condFormat(ref, type, params) {
    this.condFormats.push({ ref, type, params });
    return this;
  }
  dataValidation(ref, listFormula) {
    this.dataValidations.push({ ref, formula: listFormula });
    return this;
  }
}

function colNum(letter) {
  let n = 0;
  for (let i = 0; i < letter.length; i++) n = n * 26 + (letter.charCodeAt(i) - 64);
  return n;
}

// ============================================================
// Style registry: collects fonts/fills/borders/numFmts used across
// ALL sheets and assigns shared cellXfs indices.
// ============================================================
class StyleRegistry {
  constructor() {
    this.fonts = [{ name: 'Yu Gothic', sz: 10, bold: false, color: null }];
    this.fills = [null, null]; // 0=none,1=gray125 reserved by spec
    this.numFmts = {}; // code -> id (custom only, 164+)
    this.xfs = [{ fontId: 0, fillId: 0, numFmtId: 0, align: null, border: false }];
    this.xfKey = new Map();
    this._nextNumFmtId = 164;
  }
  font(opts) {
    opts = opts || {};
    const key = JSON.stringify(opts);
    let idx = this.fonts.findIndex(f => JSON.stringify(f) === key);

function renderStylesXml(reg) {
  let fontsXml = reg.fonts.map(f => {
    let s = '<font>';
    if (f.bold) s += '<b/>';
    s += `<sz val="${f.sz}"/>`;
    if (f.color) s += `<color rgb="FF${f.color}"/>`;
    s += `<name val="${esc(f.name)}"/></font>`;
    return s;
  }).join('');

  let fillsXml = '<fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill>';
  reg.fills.slice(2).forEach(hex => {
    fillsXml += `<fill><patternFill patternType="solid"><fgColor rgb="FF${hex}"/><bgColor indexed="64"/></patternFill></fill>`;
  });

  let numFmtsXml = '';
  const numFmtEntries = Object.entries(reg.numFmts);
  if (numFmtEntries.length) {
    numFmtsXml = `<numFmts count="${numFmtEntries.length}">` +
      numFmtEntries.map(([code, id]) => `<numFmt numFmtId="${id}" formatCode="${esc(code)}"/>`).join('') +
      '</numFmts>';
  }

  let borderXml = '<border><left/><right/><top/><bottom/><diagonal/></border>' +
    '<border><left style="thin"><color rgb="FFBFBFBF"/></left><right style="thin"><color rgb="FFBFBFBF"/></right>' +
    '<top style="thin"><color rgb="FFBFBFBF"/></top><bottom style="thin"><color rgb="FFBFBFBF"/></bottom><diagonal/></border>';

  let cellXfsXml = reg.xfs.map(xf => {
    const align = xf.align;
    let alignXml = '';
    if (align && (align.h || align.v || align.wrap)) {
      alignXml = `<alignment${align.h ? ` horizontal="${align.h}"` : ''}${align.v ? ` vertical="${align.v}"` : ''}${align.wrap ? ' wrapText="1"' : ''}/>`;
    }
    const borderId = xf.border ? 1 : 0;
    return `<xf numFmtId="${xf.numFmtId || 0}" fontId="${xf.fontId || 0}" fillId="${xf.fillId || 0}" borderId="${borderId}" applyFont="1" applyFill="1" applyBorder="${borderId ? 1 : 0}" applyAlignment="${alignXml ? 1 : 0}" applyNumberFormat="${xf.numFmtId ? 1 : 0}">${alignXml}</xf>`;
  }).join('');

  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
    numFmtsXml +
    `<fonts count="${reg.fonts.length}">${fontsXml}</fonts>` +
    `<fills count="${reg.fills.length}">${fillsXml}</fills>` +
    `<borders count="2">${borderXml}</borders>` +
    '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
    `<cellXfs count="${reg.xfs.length}">${cellXfsXml}</cellXfs>` +
    '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>' +
    '</styleSheet>';
}

function renderSheetXml(sheet) {

  Object.keys(sheet.cells).forEach(ref => {
    const m = ref.match(/^([A-Z]+)(\d+)$/);
    maxCol = Math.max(maxCol, colNum(m[1]));
    maxRow = Math.max(maxRow, parseInt(m[2]));
  });

  const rowsMap = {};
  Object.entries(sheet.cells).forEach(([ref, cell]) => {
    const m = ref.match(/^([A-Z]+)(\d+)$/);
    const r = parseInt(m[2]);
    if (!rowsMap[r]) rowsMap[r] = [];
    rowsMap[r].push({ ref, col: colNum(m[1]), cell });
  });

  let sheetData = '';
  for (let r = 1; r <= maxRow; r++) {
    const rowCells = (rowsMap[r] || []).sort((a, b) => a.col - b.col);
    if (rowCells.length === 0 && !sheet.rowHeights[r]) continue;
    const hAttr = sheet.rowHeights[r] ? ` ht="${sheet.rowHeights[r]}" customHeight="1"` : '';
    let cellsXml = '';
    rowCells.forEach(({ ref, cell }) => {

      } else if (typeof cell.v === 'number') {
        cellsXml += `<c r="${ref}"${sAttr}><v>${cell.v}</v></c>`;
      } else if (cell.v === null || cell.v === undefined || cell.v === '') {
        cellsXml += `<c r="${ref}"${sAttr}/>`;

      sheet.merges.map(m => `<mergeCell ref="${m}"/>`).join('') + '</mergeCells>';
  }

  let cfXml = '';
  sheet.condFormats.forEach(cf => {
    if (cf.type === 'cellIs') {
      cfXml += `<conditionalFormatting sqref="${cf.ref}"><cfRule type="cellIs" dxfId="${cf.params.dxfId}" priority="${cfXml.length + 1}" operator="${cf.params.operator}"><formula>${esc(cf.params.formula)}</formula></cfRule></conditionalFormatting>`;
    } else if (cf.type === 'expression') {
      cfXml += `<conditionalFormatting sqref="${cf.ref}"><cfRule type="expression" dxfId="${cf.params.dxfId}" priority="${cfXml.length + 1}"><formula>${esc(cf.params.formula)}</formula></cfRule></conditionalFormatting>`;
    }
  });

  let dvXml = '';
  if (sheet.dataValidations.length) {
    dvXml = `<dataValidations count="${sheet.dataValidations.length}">` +
      sheet.dataValidations.map(dv =>
        `<dataValidation type="list" allowBlank="1" showInputMessage="1" showErrorMessage="1" sqref="${dv.ref}"><formula1>${esc(dv.formula)}</formula1></dataValidation>`
      ).join('') + '</dataValidations>';
  }

  let paneXml = '';
  if (sheet.freezeRow || sheet.freezeCol) {
    const topLeft = colLetter(sheet.freezeCol + 1) + (sheet.freezeRow + 1);
    paneXml = `<pane xSplit="${sheet.freezeCol}" ySplit="${sheet.freezeRow}" topLeftCell="${topLeft}" activePane="bottomRight" state="frozen"/>`;
  }
  const sheetViewXml = `<sheetViews><sheetView${sheet.showGridLines ? '' : ' showGridLines="0"'} workbookViewId="0">${paneXml}</sheetView></sheetViews>`;

  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
    sheetViewXml +
    colsXml +
    `<sheetData>${sheetData}</sheetData>` +
    mergeXml +
    dvXml +
    cfXml +
    '</worksheet>';
}

function renderDxfsXml(dxfs) {

  const items = dxfs.map(d => {

    if (d.fontColor || d.bold) {

function renderWorkbook(sheets, styleRegistry, dxfs) {

    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
    '</Relationships>';

  const contentTypes =
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
    '<Default Extension="xml" ContentType="application/xml"/>' +
    '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
    sheetEntries.map(e => `<Override PartName="/xl/worksheets/sheet${e.idx}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('') +
    '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
    '</Types>';

  const files = [
    { name: '[Content_Types].xml', data: strToBytes(contentTypes) },
    { name: '_rels/.rels', data: strToBytes(rootRels) },
    { name: 'xl/workbook.xml', data: strToBytes(workbookXml) },
    { name: 'xl/_rels/workbook.xml.rels', data: strToBytes(workbookRels) },
    { name: 'xl/styles.xml', data: strToBytes(stylesXml) },
  ];
  sheetEntries.forEach(e => {
    files.push({ name: `xl/worksheets/sheet${e.idx}.xml`, data: strToBytes(renderSheetXml(e.sheet)) });
  });

  return buildZip(files);
}

function nthMonday(year, month, n) {
  const first = new Date(year, month - 1, 1);
  const firstMonday = 1 + ((8 - first.getDay()) % 7);
  return firstMonday + (n - 1) * 7;
}
function vernalEquinoxDay(year) {
  // 近似式（国立天文台の式に基づく、2000-2099年で有効）
  return Math.floor(20.8431 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4));
}
function autumnalEquinoxDay(year) {
  return Math.floor(23.2488 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4));
}
function japaneseHolidaysForYear(year) {
  // returns a Set of 'YYYY-MM-DD' strings for all holidays (including 振替休日)
  const holidays = new Map(); // 'YYYY-MM-DD' -> name

  function add(month, day, name) {
    const key = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    holidays.set(key, name);
  }

  add(1, 1, '元日');
  add(1, nthMonday(year, 1, 2), '成人の日');
  add(2, 11, '建国記念の日');
  if (year >= 2020) add(2, 23, '天皇誕生日');
  add(3, vernalEquinoxDay(year), '春分の日');
  add(4, 29, '昭和の日');
  add(5, 3, '憲法記念日');
  add(5, 4, 'みどりの日');
  add(5, 5, 'こどもの日');
  add(7, nthMonday(year, 7, 3), '海の日');
  if (year >= 2016) add(8, 11, '山の日');
  add(9, nthMonday(year, 9, 3), '敬老の日');
  add(9, autumnalEquinoxDay(year), '秋分の日');
  add(10, nthMonday(year, 10, 2), 'スポーツの日');
  add(11, 3, '文化の日');
  add(11, 23, '勤労感謝の日');

  // 振替休日: 祝日が日曜なら、その後の最初の平日（祝日でない日）を休日にする
  const sorted = [...holidays.keys()].sort();
  sorted.forEach(key => {
    const [y, m, d] = key.split('-').map(Number);
    const date = new Date(y, m - 1, d);
    if (date.getDay() === 0) {
      let next = new Date(y, m - 1, d + 1);
      let nextKey = `${next.getFullYear()}-${String(next.getMonth() + 1).padStart(2, '0')}-${String(next.getDate()).padStart(2, '0')}`;
      while (holidays.has(nextKey)) {
        next = new Date(next.getFullYear(), next.getMonth(), next.getDate() + 1);
        nextKey = `${next.getFullYear()}-${String(next.getMonth() + 1).padStart(2, '0')}-${String(next.getDate()).padStart(2, '0')}`;
      }
      holidays.set(nextKey, '振替休日');
    }
  });

  // 国民の休日: 祝日と祝日に挟まれた平日（祝日でなく、日曜でもない日）も休日とする
  const afterSubstitutes = [...holidays.keys()];
  afterSubstitutes.forEach(key => {
    const [y, m, d] = key.split('-').map(Number);
    const middle = new Date(y, m - 1, d + 1);
    const middleKey = `${middle.getFullYear()}-${String(middle.getMonth() + 1).padStart(2, '0')}-${String(middle.getDate()).padStart(2, '0')}`;
    if (holidays.has(middleKey) || middle.getDay() === 0 || middle.getDay() === 6) return;
    const after = new Date(y, m - 1, d + 2);
    const afterKey = `${after.getFullYear()}-${String(after.getMonth() + 1).padStart(2, '0')}-${String(after.getDate()).padStart(2, '0')}`;
    if (holidays.has(afterKey)) holidays.set(middleKey, '国民の休日');
  });

  return holidays;
}

// 病棟ごとに、スタッフ・設定・各月の勤務表を別々に持つ。
//   STORE = { wards: [病棟, ...], currentId, nextWardId, lastYM, savedAt }
//   病棟   = { id, name, staff, settings, months, nextId }
// 画面や自動作成は「いま選んでいる病棟」だけを DB として扱う。
const STORAGE_KEY = 'wardShiftTool_autosave_v2';
const OLD_STORAGE_KEY = 'wardShiftTool_autosave_v1'; // 病棟が1つだった頃の保存データ
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function makeWard(id, name, opts) {
  opts = opts || {};
  const staff = opts.sample ? clone(DEFAULT_STAFF) : [];
  return {
    id, name,
    staff,
    settings: clone(opts.settings || DEFAULT_SETTINGS),
    months: {},
    nextId: Math.max(0, ...staff.map(s => s.id)) + 1,
  };
}
// 古いデータ・バックアップにも欠けている項目を補う
function normalizeWard(w, fallbackName) {
  if (!w || !Array.isArray(w.staff)) throw new Error('形式が違います');
  w.name = w.name || (w.settings && w.settings.wardName) || fallbackName || '病棟';
  w.settings = Object.assign(clone(DEFAULT_SETTINGS), w.settings || {});
  w.months = w.months || {};
  w.staff.forEach(normalizeStaff);
  w.nextId = w.nextId || (Math.max(0, ...w.staff.map(s => s.id)) + 1);
  const S = w.settings;
  S.maxConsecWork = Math.min(5, Math.max(4, Number(S.maxConsecWork) || 5));
  S.maxConsecNight = Math.min(2, Math.max(1, Number(S.maxConsecNight) || 2));
  delete w.lastYM; delete w.savedAt;
  return w;
}
let STORE = { wards: [makeWard(1, 'A病棟', { sample: true })], currentId: 1, nextWardId: 2 };
let DB = STORE.wards[0];
function currentWard() { return STORE.wards.find(w => w.id === STORE.currentId) || STORE.wards[0]; }

const HISTORY = [];
function pushHistory() {
  HISTORY.push({ y: view.y, m: view.m, data: JSON.stringify(monthData(view.y, view.m)) });
  if (HISTORY.length > 30) HISTORY.shift();
}
function undo() {
  const h = HISTORY.pop();
  if (!h) { showToast('元に戻せる操作がありません', 'error'); return; }
  DB.months[monthKey(h.y, h.m)] = JSON.parse(h.data);
  view.y = h.y; view.m = h.m; view.swapSel = null; view.highlight = null;
  syncMonthInputs();
  scheduleSave();
  render();
  showToast('1つ前の状態に戻しました');
}

// ============================================================
// 保存（ブラウザ内に自動保存）
// ============================================================
let saveTimer = null;
function scheduleSave() {
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { saveTimer = null; saveState(); }, 300);
}
function saveState() {
  try {
    STORE.lastYM = [view.y, view.m];
    STORE.savedAt = new Date().toISOString();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(STORE));
    showSavedAt(STORE.savedAt);
  } catch (e) { console.error('autosave failed', e); }
}
function showSavedAt(iso) {
  const t = new Date(iso);
  document.getElementById('autosaveIndicator').textContent =
    `✓ 自動保存 ${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')}`;
}
// 全病棟の保存データ（新形式）か、病棟1つ分の保存データ（旧形式）を読み込む
function applyLoaded(saved) {
  let store;
  if (saved && Array.isArray(saved.wards)) {
    if (!saved.wards.length) throw new Error('病棟がありません');
    saved.wards.forEach((w, i) => normalizeWard(w, `病棟${i + 1}`));
    store = saved;
    store.nextWardId = store.nextWardId || (Math.max(...store.wards.map(w => w.id)) + 1);
  } else {
    const w = normalizeWard(clone(saved), 'A病棟');
    w.id = 1;
    store = { wards: [w], currentId: 1, nextWardId: 2, lastYM: saved.lastYM, savedAt: saved.savedAt };
  }
  STORE = store;
  if (!STORE.wards.some(w => w.id === STORE.currentId)) STORE.currentId = STORE.wards[0].id;
  DB = currentWard();
  HISTORY.length = 0;
  if (Array.isArray(STORE.lastYM)) { view.y = STORE.lastYM[0]; view.m = STORE.lastYM[1]; }
  if (STORE.savedAt) setTimeout(() => showSavedAt(STORE.savedAt), 0);
}
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem(OLD_STORAGE_KEY);
    if (!raw) return false;
    applyLoaded(JSON.parse(raw));
    return true;
  } catch (e) {
    console.error('failed to restore autosave', e);
    return false;
  }
}

function switchWard(id) {
  if (!STORE.wards.some(w => w.id === id)) return;
  STORE.currentId = id;
  DB = currentWard();

  scheduleSave();

}
function addWard(name, copySettings, sample) {

  STORE.wards.push(w);

function deleteWard(id) {
  const w = STORE.wards.find(x => x.id === id);
  if (!w || STORE.wards.length <= 1) return;
  if (!confirm(`${w.name} のスタッフ・設定・すべての月の勤務表を削除します。元に戻せません。よろしいですか？`)) return;
  STORE.wards = STORE.wards.filter(x => x.id !== id);
  if (STORE.currentId === id) STORE.currentId = STORE.wards[0].id;

}

// ============================================================
// 日付
// ============================================================
function daysInMonth(y, m) { return new Date(y, m, 0).getDate(); }
function weekday(y, m, d) { return new Date(y, m - 1, d).getDay(); }
const WEEKDAYS_JP = ['日', '月', '火', '水', '木', '金', '土'];
function isOffDay(y, m, d) {
  const w = weekday(y, m, d);
  return w === 0 || w === 6 || isJapaneseHoliday(y, m, d);
}
function prevYM(y, m) { return m === 1 ? [y - 1, 12] : [y, m - 1]; }
function nextYM(y, m) { return m === 12 ? [y + 1, 1] : [y, m + 1]; }
function monthKey(y, m) { return `${y}-${String(m).padStart(2, '0')}`; }
function offDayCountOfMonth(y, m) {
  let n = 0;
  for (let d = 1; d <= daysInMonth(y, m); d++) if (isOffDay(y, m, d)) n++;
  return n;
}
function offTarget(staff, y, m) {
  const S = DB.settings;
  const base = (S.offTargetOverride !== null && S.offTargetOverride !== '' && !isNaN(S.offTargetOverride))
    ? Number(S.offTargetOverride) : offDayCountOfMonth(y, m);
  return Math.max(0, base + (Number(staff.offAdjust) || 0));
}
// 日勤の必要人数。土日祝は日によって4〜6人とばらつくので、日ごとに入れた
// 人数（months[月].reqDay）があればそれを使い、なければ設定の基本の人数を使う。
function reqDayDefault(y, m, d) {
  return isOffDay(y, m, d) ? DB.settings.reqDayHoliday : DB.settings.reqDayWeekday;
}
function reqDay(y, m, d) {
  const md = DB.months[monthKey(y, m)];
  const v = md && md.reqDay && md.reqDay[d];
  return typeof v === 'number' ? v : reqDayDefault(y, m, d);
}
function setReqDay(y, m, d, v) {
  const md = monthData(y, m);
  if (!md.reqDay) md.reqDay = {};
  if (v === null || v === reqDayDefault(y, m, d)) delete md.reqDay[d];
  else md.reqDay[d] = v;
}

// ============================================================
// 経験年数による区分
// ============================================================
function isNewbie(s) { return s.nurseYear <= 1; }
function isYoung(s) { return s.nurseYear <= DB.settings.youngMaxYear; }
function isWardNew(s) { return s.wardYear <= 1; }
function isVet(s) {
  return s.nurseYear >= DB.settings.vetNurseYear && s.wardYear >= DB.settings.vetWardYear;
}
function expChips(s) {
  const chips = [];
  chips.push(`<span class="chip type">${WORK_TYPES[s.workType].short}</span>`);
  const nCls = isNewbie(s) ? 'new' : isYoung(s) ? 'young' : '';
  chips.push(`<span class="chip ${nCls}" title="看護師経験">看${s.nurseYear}年目${isNewbie(s) ? '（新人）' : ''}</span>`);
  chips.push(`<span class="chip ${isWardNew(s) ? 'wardnew' : ''}" title="病棟経験">病棟${s.wardYear}年目</span>`);
  if (isVet(s)) chips.push('<span class="chip vet" title="夜勤の中心になれる人">中堅以上</span>');
  if (!s.nightOK && WORK_TYPES[s.workType].codes.some(isNight)) chips.push('<span class="chip nonight">夜勤なし</span>');
  const ng = nightNgLabel(s);
  if (ng) chips.push(`<span class="chip nonight" title="曜日ごとの夜勤の約束">${esc(ng)}</span>`);
  const mt = s.mentorId && staffById(s.mentorId);
  if (mt) chips.push(`<span class="chip" title="${s.needMentor ? '夜勤は指導者と同じ帯にする' : '指導者'}">指導:${esc(mt.name)}${s.needMentor ? '（夜勤同伴）' : ''}</span>`);
  return chips.join('');
}
function staffById(id) { return DB.staff.find(s => s.id === id); }

// 曜日ごとの夜勤の約束（例：水曜は保育園の都合で夜勤不可）
function nightNgOn(s, y, m, d, code) {
  const list = (s.nightNg || {})[weekday(y, m, d)];
  return !!list && list.includes(code);
}
function nightNgLabel(s) {
  const groups = {};
  Object.keys(s.nightNg || {}).forEach(w => {
    const list = s.nightNg[w];
    if (!list || !list.length) return;
    const key = list.slice().sort().join('・');
    (groups[key] = groups[key] || []).push(WEEKDAYS_JP[w]);
  });
  return Object.entries(groups).map(([codes, days]) => `${days.join('・')}曜は${codes}不可`).join(' ／ ');
}
function isNgPair(a, b) {
  return (a.ngPartners || []).includes(b.id) || (b.ngPartners || []).includes(a.id);
}
// 本人ごとの約束（組み合わせNG・指導者と一緒）に反している数
function personalProblems(members, ids) {
  const out = [];
  for (let i = 0; i < members.length; i++) {
    for (let j = i + 1; j < members.length; j++) {
      if (isNgPair(members[i], members[j])) out.push(`${members[i].name}と${members[j].name}は同じ夜勤にしない設定`);
    }
  }
  members.forEach(s => {
    if (s.needMentor && s.mentorId && !ids.includes(s.mentorId)) {
      const mt = staffById(s.mentorId);
      if (mt) out.push(`${s.name}の夜勤に指導者（${mt.name}）がいない`);
    }
  });
  return out;
}

// 夜勤帯のメンバー構成を判定する
function crewCheck(ids) {
  const S = DB.settings;
  const members = ids.map(staffById).filter(Boolean);
  const r = {
    total: members.length,
    vet: members.filter(isVet).length,
    newbie: members.filter(isNewbie).length,
    young: members.filter(isYoung).length,
    wardNew: members.filter(isWardNew).length,
    problems: [],
    personal: 0,
  };
  if (r.total > 0) {
    if (r.vet < S.minVet) r.problems.push(`中堅以上が${r.vet}人（${S.minVet}人以上必要）`);
    if (r.young > S.maxYoung) r.problems.push(`看護師${S.youngMaxYear}年目以下が${r.young}人（上限${S.maxYoung}人）`);
    if (r.newbie > S.maxNewbie) r.problems.push(`新人（看護師1年目）が${r.newbie}人（上限${S.maxNewbie}人）`);
    if (r.wardNew > S.maxWardNew) r.problems.push(`病棟1年目が${r.wardNew}人（上限${S.maxWardNew}人）`);
    if (r.total >= 2 && r.young === r.total) r.problems.push('全員が若手');
    const pp = personalProblems(members, ids);
    r.personal = pp.length;
    r.problems.push(...pp);
  }
  return r;
}

// ============================================================
// 月データ
// ============================================================
// months[YYYY-MM] = { cells: {id: {day: code}}, pto: {id: {day: '公'|'有'}}, auto: {id: {day: true}}, reqDay: {day: 日勤の必要人数} }
function monthData(y, m) {
  const key = monthKey(y, m);
  if (!DB.months[key]) DB.months[key] = { cells: {}, pto: {}, auto: {} };
  return DB.months[key];
}
function mdGet(md, part, id, d) { return (md && md[part][id] && md[part][id][d]) || ''; }
function mdSet(md, part, id, d, v) {
  if (!md[part][id]) md[part][id] = {};
  if (v) md[part][id][d] = v; else delete md[part][id][d];
}

// 1ヶ月分の勤務を配列にした作業用のコピー。d<1 は前月の末日を参照する。
function buildPlan(y, m, dropAuto) {
  const n = daysInMonth(y, m);
  const md = monthData(y, m);
  const [py, pm] = prevYM(y, m);
  const pn = daysInMonth(py, pm);
  const pmd = DB.months[monthKey(py, pm)];
  const nmd = DB.months[monthKey(...nextYM(y, m))];
  const cells = {}, fixed = {}, pto = {}, prev = {}, edgePto = {};
  DB.staff.forEach(s => {
    cells[s.id] = new Array(n + 2).fill('');
    fixed[s.id] = new Array(n + 2).fill(false);
    pto[s.id] = new Array(n + 2).fill(false);
    for (let d = 1; d <= n; d++) {
      const p = mdGet(md, 'pto', s.id, d);
      if (p) { cells[s.id][d] = p; fixed[s.id][d] = true; pto[s.id][d] = true; continue; }
      if (dropAuto && mdGet(md, 'auto', s.id, d)) continue;
      const c = mdGet(md, 'cells', s.id, d);
      if (c) { cells[s.id][d] = c; fixed[s.id][d] = true; }
    }
    prev[s.id] = {};
    for (let k = 0; k >= -3; k--) {
      prev[s.id][k] = pmd ? (mdGet(pmd, 'pto', s.id, pn + k) || mdGet(pmd, 'cells', s.id, pn + k)) : '';
    }
    // 前月末日・翌月1日の休み希望（月をまたぐ夜勤の判定に使う）
    edgePto[s.id] = { 0: !!(pmd && mdGet(pmd, 'pto', s.id, pn)), [n + 1]: !!(nmd && mdGet(nmd, 'pto', s.id, 1)) };
  });
  return {
    y, m, n, cells, fixed, pto, prev, edgePto,
    isPto(id, d) {
      if (d >= 1 && d <= this.n) return this.pto[id][d];
      return !!this.edgePto[id][d];
    },
    get(id, d) {
      if (d < 1) return (this.prev[id] && this.prev[id][d]) || '';
      if (d > this.n) return '';
      return this.cells[id][d];
    },
  };
}

// ============================================================
// チェック（勤務表の問題点を洗い出す）
// ============================================================
function analyze(plan) {
  const S = DB.settings;
  const { y, m, n } = plan;
  const issues = [];
  let score = 0;
  const add = (sev, d, id, msg, w) => { issues.push({ sev, d, id, msg }); score += w; };

  const days = [];
  for (let d = 1; d <= n; d++) {
    const day = { d, dayIds: [], shortIds: [], eve: [], late: [], req: reqDay(y, m, d) };
    DB.staff.forEach(s => {
      const c = plan.get(s.id, d);
      if (c === '日') day.dayIds.push(s.id);
      if (c === '短') day.shortIds.push(s.id);
      if (c === '準' || c === '夜') day.eve.push(s.id);
      if (c === '深' || plan.get(s.id, d - 1) === '夜') day.late.push(s.id);
    });
    day.dayCount = day.dayIds.length + (S.countShort ? day.shortIds.length : 0);
    day.eveCheck = crewCheck(day.eve);
    day.lateCheck = crewCheck(day.late);
    const label = `${m}/${d}(${WEEKDAYS_JP[weekday(y, m, d)]})`;
    if (day.dayCount < day.req) add('error', d, null, `${label} 日勤が${day.req - day.dayCount}人不足（${day.dayCount}/${day.req}人）`, 10 * (day.req - day.dayCount));
    [['準夜帯', day.eve, day.eveCheck, S.reqEve], ['深夜帯', day.late, day.lateCheck, S.reqLate]].forEach(([nm, ids, chk, req]) => {
      if (ids.length < req) add('error', d, null, `${label} ${nm}が${req - ids.length}人不足（${ids.length}/${req}人）`, 60 * (req - ids.length));
      if (ids.length > req) add('warn', d, null, `${label} ${nm}が${ids.length - req}人多い（${ids.length}/${req}人）`, 15 * (ids.length - req));
      chk.problems.forEach(p => add('error', d, null, `${label} ${nm}：${p}`, 50));
    });
    days.push(day);
  }

  const staffStats = {};
  DB.staff.forEach(s => {
    const stt = { off: 0, paid: 0, nightUnits: 0, nightHours: 0, empty: 0, counts: {}, weekendOff: 0, ptoCount: 0 };
    let run = 0, runStart = 0;
    let nightRun = 0;
    for (let k = 0; k >= -3 && isNight(plan.get(s.id, k)); k--) nightRun++;
    for (let d = 1; d <= n; d++) {
      const c = plan.get(s.id, d);
      const p = plan.get(s.id, d - 1);
      const label = `${m}/${d}`;
      if (!c) stt.empty++;
      if (c) stt.counts[c] = (stt.counts[c] || 0) + 1;
      if (c === '公') stt.off++;
      if (c === '有') stt.paid++;
      if ((c === '公' || c === '有') && isOffDay(y, m, d)) stt.weekendOff++;
      if (plan.isPto(s.id, d)) stt.ptoCount++;
      stt.nightUnits += nightUnits(c);
      stt.nightHours += (S.hours[c] || 0);

      if (c && !allowedCodes(s).includes(c)) add('warn', d, s.id, `${s.name} ${label}「${c}」は勤務形態（${WORK_TYPES[s.workType].label}）にない勤務です`, 20);
      if (isNight(c) && !s.nightOK) add('error', d, s.id, `${s.name} ${label} 夜勤なしの人に夜勤が入っています`, 40);
      if (p === '夜' && c !== '明' && d >= 1) add('error', d, s.id, `${s.name} ${label} 夜勤の翌日が「明」になっていません`, 40);
      if (c === '明' && p !== '夜') add('error', d, s.id, `${s.name} ${label}「明」の前日が夜勤ではありません`, 40);
      if (p === '準' && !followOk(p, c)) add('error', d, s.id, `${s.name} ${label} 準夜の翌日に「${c}」（準夜の翌日は休みか準夜）`, 40);
      if (p === '深' && !followOk(p, c)) add('error', d, s.id, `${s.name} ${label} 深夜の翌日に「${c}」（深夜の翌日は休み・深夜・準夜のどれか）`, 40);
      if (p === '明' && !followOk(p, c)) add('error', d, s.id, `${s.name} ${label} 夜勤明けの翌日に「${c}」（明けの翌日は休み）`, 40);
      // 休み希望の前日の準夜は休みの日の未明まで、翌日の深夜は休みの日の夜中から働くことになる
      if (c === '準' && plan.isPto(s.id, d + 1)) add('error', d, s.id, `${s.name} ${label} 翌日が休み希望なのに準夜（休みの日の未明まで勤務になる）`, 40);
      if (c === '深' && plan.isPto(s.id, d - 1)) add('error', d, s.id, `${s.name} ${label} 前日が休み希望なのに深夜（休みの日の夜中から勤務になる）`, 40);
      if (c === '夜' && plan.isPto(s.id, d + 1)) add('error', d, s.id, `${s.name} ${label} 翌日が休み希望なのに2交代夜勤（翌日が明けになる）`, 40);
      if (isNight(c) && nightNgOn(s, y, m, d, c)) add('error', d, s.id, `${s.name} ${label} ${WEEKDAYS_JP[weekday(y, m, d)]}曜は「${c}」に入れない約束です`, 40);

      nightRun = isNight(c) ? nightRun + 1 : 0;
      if (nightRun === S.maxConsecNight + 1) add('error', d, s.id, `${s.name} ${label} 夜勤が${S.maxConsecNight}日を超えて続いています（夜勤は${S.maxConsecNight}連続まで）`, 40);

      if (isWork(c)) { if (run === 0) runStart = d; run++; } else run = 0;
      if (run === S.maxConsecWork + 1) add('error', d, s.id, `${s.name} ${runStart}日から${S.maxConsecWork}日を超えて連続勤務（連続勤務は${S.maxConsecWork}日まで）`, 40);
    }
    const target = offTarget(s, y, m);
    if (stt.empty === 0 && stt.off !== target) {
      add('warn', null, s.id, `${s.name} 公休が${stt.off}日（目標${target}日）`, 8 * Math.abs(stt.off - target));
    } else if (stt.empty > 0 && stt.off > target) {
      add('warn', null, s.id, `${s.name} 公休が${stt.off}日で目標${target}日を超えています`, 8 * (stt.off - target));
    }
    if (stt.nightUnits > s.nightMax) add('warn', null, s.id, `${s.name} 夜勤${stt.nightUnits}回（上限${s.nightMax}回）`, 30 * (stt.nightUnits - s.nightMax));
    if (s.nightOK && s.nightMin && stt.empty === 0 && stt.nightUnits < s.nightMin) add('warn', null, s.id, `${s.name} 夜勤${stt.nightUnits}回（下限${s.nightMin}回）`, 15 * (s.nightMin - stt.nightUnits));
    if (stt.ptoCount > S.maxPtoRequests) add('warn', null, s.id, `${s.name} 休み希望が${stt.ptoCount}日（目安${S.maxPtoRequests}日まで）`, 0);
    stt.paidLeft = (Number(s.paidGranted) || 0) - (Number(s.paidUsedBefore) || 0) - stt.paid;
    if (stt.paidLeft < 0) add('warn', null, s.id, `${s.name} 有給が年間の残日数を${-stt.paidLeft}日超えています`, 0);
    stt.target = target;
    staffStats[s.id] = stt;
  });

  // 夜勤回数の偏り（上限に対する割合のばらつき）
  const ratios = DB.staff.filter(canNightType).map(s => staffStats[s.id].nightUnits / Math.max(1, s.nightMax));
  if (ratios.length > 1) {
    const avg = ratios.reduce((a, b) => a + b, 0) / ratios.length;
    const variance = ratios.reduce((a, b) => a + (b - avg) * (b - avg), 0) / ratios.length;
    score += variance * 200;
  }

  // 夜勤の上限回数の合計が、そもそも必要な回数に足りているか
  const nightCap = DB.staff.filter(canNightType).reduce((acc, s) => acc + (Number(s.nightMax) || 0), 0);
  const nightNeed = n * (S.reqEve + S.reqLate);
  if (nightCap < nightNeed) {
    issues.push({ sev: 'warn', d: null, id: null, msg: `夜勤に入れる人の上限回数の合計が${nightCap}回で、必要な${nightNeed}回（準夜帯${S.reqEve}人＋深夜帯${S.reqLate}人×${n}日）に足りません。上限回数か必要人数を見直してください` });
  }

  // 土日祝の休みの偏り（土日祝休みの約束がある人は除く）
  const wk = DB.staff.filter(s => !s.weekendOff).map(s => staffStats[s.id].weekendOff);
  if (wk.length > 1) {
    const avg = wk.reduce((a, b) => a + b, 0) / wk.length;
    score += wk.reduce((a, b) => a + (b - avg) * (b - avg), 0) / wk.length * 3;
  }

  // 月平均夜勤時間（72時間ルールの目安）：夜勤をした人の平均
  const nightWorkers = DB.staff.filter(s => staffStats[s.id].nightHours > 0);
  const avgNightHours = nightWorkers.length
    ? nightWorkers.reduce((a, s) => a + staffStats[s.id].nightHours, 0) / nightWorkers.length : 0;

  issues.sort((a, b) => (a.sev === b.sev ? 0 : a.sev === 'error' ? -1 : 1) || ((a.d || 99) - (b.d || 99)));
  return { days, staffStats, issues, score, avgNightHours, nightCap, nightNeed };
}

// ============================================================
// 自動作成
// ============================================================
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function autoGenerateOnce(y, m) {
  const S = DB.settings;
  const plan = buildPlan(y, m, true);
  const { n, cells, fixed } = plan;
  const get = (id, d) => plan.get(id, d);
  const empty = (id, d) => d >= 1 && d <= n && !cells[id][d];
  const staff = DB.staff;
  const units = {};
  staff.forEach(s => {
    units[s.id] = 0;
    for (let d = 1; d <= n; d++) units[s.id] += nightUnits(cells[s.id][d]);
  });

  // 前月末の夜勤の続き（明・明けの翌日の休み）
  staff.forEach(s => {
    if (get(s.id, 0) === '夜' && empty(s.id, 1)) cells[s.id][1] = '明';
    if (S.restAfterAke && get(s.id, 1) === '明' && empty(s.id, 2)) cells[s.id][2] = '公';
    if (S.restAfterAke && get(s.id, 0) === '明' && empty(s.id, 1)) cells[s.id][1] = '公';
  });

  function workRun(id, d, len) {
    // d から len 日連続で勤務にした場合の連続勤務日数
    let left = 0;
    for (let k = d - 1; k >= d - 10 && isWork(get(id, k)); k--) left++;
    let right = 0;
    for (let k = d + len; k <= n && isWork(get(id, k)); k++) right++;
    return left + len + right;
  }
  // d に夜勤を入れた場合に、夜勤（準夜・深夜・2交代夜勤）が何日続くか
  function nightRunAround(id, d) {
    let left = 0;
    for (let k = d - 1; k >= d - 5 && isNight(get(id, k)); k--) left++;
    let right = 0;
    for (let k = d + 1; k <= n && isNight(get(id, k)); k++) right++;
    return left + 1 + right;
  }

  function canNight(s, code, d) {
    if (!s.nightOK || !allowedCodes(s).includes(code) || !empty(s.id, d)) return false;
    if (units[s.id] + nightUnits(code) > s.nightMax) return false;
    if (nightNgOn(s, y, m, d, code)) return false;
    // 休み希望の前日の準夜・2交代夜勤、翌日の深夜は入れない（希望した休みが丸1日の休みにならないため）
    if ((code === '準' || code === '夜') && plan.isPto(s.id, d + 1)) return false;
    if (code === '深' && plan.isPto(s.id, d - 1)) return false;
    const p = get(s.id, d - 1), nx = get(s.id, d + 1);
    if (!followOk(p, code)) return false;
    if (nightRunAround(s.id, d) > S.maxConsecNight) return false;
    if (code === '深' || code === '準') {
      if (!followOk(code, nx)) return false;
      if (workRun(s.id, d, 1) > S.maxConsecWork) return false;
    } else if (code === '夜') {
      if (d < n && !empty(s.id, d + 1)) return false;
      if (S.restAfterAke && d + 2 <= n && !empty(s.id, d + 2) && isWork(get(s.id, d + 2))) return false;
      if (workRun(s.id, d, d < n ? 2 : 1) > S.maxConsecWork) return false;
    }
    return true;
  }
  function crewOf(slot, d) {
    const ids = [];
    staff.forEach(s => {
      const c = get(s.id, d);
      if (slot === 'eve' && (c === '準' || c === '夜')) ids.push(s.id);
      if (slot === 'late' && (c === '深' || get(s.id, d - 1) === '夜')) ids.push(s.id);
    });
    return ids;
  }
  // 候補者をこの夜勤帯に入れても経験バランスが崩れないか
  // 組み合わせNG・指導者と一緒、の約束を新たに破らないか
  function personalOk(s, ids) {
    return crewCheck(ids.concat([s.id])).personal <= crewCheck(ids).personal;
  }
  function fitsCrew(s, ids, req, strict) {
    const c = crewCheck(ids.concat([s.id]));
    if (!personalOk(s, ids)) return false;
    if (c.newbie > S.maxNewbie || c.wardNew > S.maxWardNew || c.young > S.maxYoung) return false;
    if (!strict) return true;
    // 残りの枠で中堅以上の最低人数を満たせるか
    const remaining = req - ids.length - 1;
    const vetShort = S.minVet - c.vet;
    return vetShort <= remaining;
  }
  function assign(s, code, d) {
    cells[s.id][d] = code;
    units[s.id] += nightUnits(code);
    if (code === '夜') {
      if (d + 1 <= n) cells[s.id][d + 1] = '明';
      if (S.restAfterAke && d + 2 <= n && empty(s.id, d + 2)) cells[s.id][d + 2] = '公';
    }
  }
  function nightScore(s, code, d, ids) {
    let sc = (units[s.id] / Math.max(1, s.nightMax)) * 10;
    const p = get(s.id, d - 1);
    if ((code === '深' || code === '準') && p === code) sc -= 1.5;        // 同じ夜勤を2回続けるまとまりを作る
    if (code === '深' && p === '日') sc -= 0.3;                            // 日勤→深夜
    for (let k = 2; k <= 3; k++) if (isNight(get(s.id, d - k))) sc += 0.6; // 夜勤が詰まりすぎないように
    const vetNow = crewCheck(ids).vet;
    if (isVet(s) && vetNow >= S.minVet) sc += 1.2;                         // 中堅は他の日のために温存
    if (!isVet(s) && vetNow < S.minVet) sc += 0.8;
    if (s.role === '師長' || s.role === '副師長') sc += 1.0;
    if (units[s.id] < (s.nightMin || 0)) sc -= 2;                          // 下限に届いていない人を先に
    if (s.needMentor && ids.includes(s.mentorId)) sc -= 3;                 // 指導者が入っている帯に新人を
    return sc + Math.random() * 2.5;
  }
  function pick(cands) {
    cands.sort((a, b) => a.sc - b.sc);
    return cands[0];
  }

  for (let d = 1; d <= n; d++) {
    // 深夜帯（深夜＋前日からの2交代夜勤）
    let late = crewOf('late', d);
    for (let guard = 0; late.length < S.reqLate && guard < 20; guard++) {
      let cands = [];
      for (const strict of [true, false]) {
        cands = staff.filter(s => canNight(s, '深', d) && fitsCrew(s, late, S.reqLate, strict))
          .map(s => ({ s, code: '深', sc: nightScore(s, '深', d, late) }));
        if (cands.length) break;
      }
      if (!cands.length) cands = staff.filter(s => canNight(s, '深', d) && personalOk(s, late)).map(s => ({ s, code: '深', sc: nightScore(s, '深', d, late) + 20 }));
      if (!cands.length) break;
      const c = pick(cands);
      assign(c.s, c.code, d);
      late = crewOf('late', d);
    }
    // 準夜帯（準夜＋2交代夜勤）。2交代夜勤は翌日の深夜帯も埋めるので、翌日が満員なら入れない。
    let eve = crewOf('eve', d);
    for (let guard = 0; eve.length < S.reqEve && guard < 20; guard++) {
      const nextLate = d < n ? crewOf('late', d + 1) : [];
      const nightRoom = d >= n || nextLate.length < S.reqLate;
      let cands = [];
      for (const strict of [true, false]) {
        cands = [];
        staff.forEach(s => {
          if (canNight(s, '準', d) && fitsCrew(s, eve, S.reqEve, strict)) {
            cands.push({ s, code: '準', sc: nightScore(s, '準', d, eve) });
          }
          if (nightRoom && canNight(s, '夜', d) && fitsCrew(s, eve, S.reqEve, strict)
              && (d >= n || fitsCrew(s, nextLate, S.reqLate, strict))) {
            // 2交代の人は夜勤が少ないと月の勤務が偏るので、同条件なら2交代を優先
            cands.push({ s, code: '夜', sc: nightScore(s, '夜', d, eve) - 0.5 });
          }
        });
        if (cands.length) break;
      }
      if (!cands.length) {
        staff.forEach(s => {
          if (canNight(s, '準', d) && personalOk(s, eve)) cands.push({ s, code: '準', sc: nightScore(s, '準', d, eve) + 20 });
          if (nightRoom && canNight(s, '夜', d) && personalOk(s, eve) && (d >= n || personalOk(s, nextLate))) cands.push({ s, code: '夜', sc: nightScore(s, '夜', d, eve) + 20 });
        });
      }
      if (!cands.length) break;
      const c = pick(cands);
      assign(c.s, c.code, d);
      eve = crewOf('eve', d);
    }
  }

  // ---- 日勤と公休 ----
  const dayCode = s => (s.workType === '時短' ? '短' : '日');
  const counts = s => (dayCode(s) === '短' ? (S.countShort ? 1 : 0) : 1);
  const tentative = {}; // 自動で日勤にした（公休と入れ替えてよい）日
  const forcedOff = {};
  staff.forEach(s => {
    tentative[s.id] = {};
    forcedOff[s.id] = {};
    for (let d = 1; d <= n; d++) {
      if (!empty(s.id, d)) continue;
      const p = get(s.id, d - 1);
      if (s.weekendOff && isOffDay(y, m, d)) { cells[s.id][d] = '公'; continue; }
      // 準夜・深夜・明けの翌日に日勤は入れられないので休みにする
      if (!followOk(p, dayCode(s))) { cells[s.id][d] = '公'; forcedOff[s.id][d] = true; continue; }
      cells[s.id][d] = dayCode(s);
      tentative[s.id][d] = true;
    }
  });
  const dayCount = new Array(n + 1).fill(0);
  for (let d = 1; d <= n; d++) {
    staff.forEach(s => {
      const c = cells[s.id][d];
      if (c === '日' || (c === '短' && S.countShort)) dayCount[d]++;
    });
  }
  const offCount = s => { let k = 0; for (let d = 1; d <= n; d++) if (cells[s.id][d] === '公') k++; return k; };
  const need = {};
  staff.forEach(s => { need[s.id] = offTarget(s, y, m) - offCount(s); });
  // 土日祝の休みが一部の人に偏らないよう、目安の回数を出しておく
  const offDaysInMonth = offDayCountOfMonth(y, m);
  const wkOff = s => { let k = 0; for (let d = 1; d <= n; d++) if ((cells[s.id][d] === '公' || cells[s.id][d] === '有') && isOffDay(y, m, d)) k++; return k; };
  const wkExpected = s => offTarget(s, y, m) * offDaysInMonth / n;

  function runAround(id, d) {
    let len = 1;
    for (let k = d - 1; k >= 1 && isWork(cells[id][k]); k--) len++;
    for (let k = d + 1; k <= n && isWork(cells[id][k]); k++) len++;
    return len;
  }
  function makeOff(s, d) {
    cells[s.id][d] = '公';
    delete tentative[s.id][d];
    dayCount[d] -= counts(s);
  }
  function makeWork(s, d) {
    cells[s.id][d] = dayCode(s);
    tentative[s.id][d] = true;
    dayCount[d] += counts(s);
  }
  // 公休を1日ずつ、人手に余裕のある日から順に割り当てる（全員に均等に回す）
  for (let round = 0; round < 40; round++) {
    const needy = shuffle(staff.filter(s => need[s.id] > 0));
    if (!needy.length) break;
    needy.sort((a, b) => need[b.id] - need[a.id]);
    needy.forEach(s => {
      let best = null, bestVal = -Infinity;
      Object.keys(tentative[s.id]).forEach(k => {
        const d = Number(k);
        const surplus = dayCount[d] - reqDay(y, m, d);
        let val = surplus * 3 + runAround(s.id, d) * 0.8 + Math.random() * 0.8;
        // 土日祝は入力した人数（4〜6人など）に近づける。余った人手は平日の日勤に回す
        if (isOffDay(y, m, d) && surplus > 0) val += 30;
        if (cells[s.id][d - 1] === '公' || cells[s.id][d + 1] === '公') val += 0.4;
        if (isOffDay(y, m, d) && !s.weekendOff) val += (wkExpected(s) - wkOff(s)) * 0.8;
        if (val > bestVal) { bestVal = val; best = d; }
      });
      if (best === null) { need[s.id] = 0; return; }
      makeOff(s, best);
      need[s.id]--;
    });
  }
  // 連続勤務が長すぎるところに休みを入れる
  staff.forEach(s => {
    for (let guard = 0; guard < 10; guard++) {
      let run = 0, found = null;
      for (let d = 1; d <= n; d++) {
        run = isWork(cells[s.id][d]) ? run + 1 : 0;
        if (run > S.maxConsecWork) { found = d; break; }
      }
      if (found === null) break;
      let best = null, bestSur = -Infinity;
      for (let d = found - S.maxConsecWork; d <= found; d++) {
        if (!tentative[s.id][d]) continue;
        const sur = dayCount[d] - reqDay(y, m, d);
        if (sur > bestSur) { bestSur = sur; best = d; }
      }
      if (best === null) break;
      makeOff(s, best);
      // 公休が目標より多くなったら、人手が足りない日の公休を1日勤務に戻す
      if (offCount(s) > offTarget(s, y, m)) {
        let back = null, worst = Infinity;
        for (let d = 1; d <= n; d++) {
          if (cells[s.id][d] !== '公' || fixed[s.id][d] || forcedOff[s.id][d] || d === best) continue;
          if (s.weekendOff && isOffDay(y, m, d)) continue;
          if (!followOk(get(s.id, d - 1), dayCode(s))) continue;
          cells[s.id][d] = dayCode(s);
          const ok = runAround(s.id, d) <= S.maxConsecWork;
          cells[s.id][d] = '公';
          if (!ok) continue;
          const sur = dayCount[d] - reqDay(y, m, d);
          if (sur < worst) { worst = sur; back = d; }
        }
        if (back !== null) makeWork(s, back);
      }
    }
  });
  // 夜勤の後の休みが重なって公休が目標より多くなった人は、並びの約束を守れる日を日勤に戻す
  staff.forEach(s => {
    for (let excess = offCount(s) - offTarget(s, y, m); excess > 0; excess--) {
      let best = null, bestSur = Infinity;
      for (let d = 1; d <= n; d++) {
        if (cells[s.id][d] !== '公' || fixed[s.id][d] || forcedOff[s.id][d]) continue;
        if (s.weekendOff && isOffDay(y, m, d)) continue;
        if (!followOk(get(s.id, d - 1), dayCode(s)) || !followOk(dayCode(s), get(s.id, d + 1))) continue;
        cells[s.id][d] = dayCode(s);
        const ok = runAround(s.id, d) <= S.maxConsecWork;
        cells[s.id][d] = '公';
        if (!ok) continue;
        const sur = dayCount[d] - reqDay(y, m, d);
        if (sur < bestSur) { bestSur = sur; best = d; }
      }
      if (best === null) break;
      makeWork(s, best);
    }
  });
  // 日勤が足りない日と余っている日で、同じ人の勤務と公休を入れ替える
  for (let iter = 0; iter < 300; iter++) {
    const shortDays = [];
    for (let d = 1; d <= n; d++) if (dayCount[d] < reqDay(y, m, d)) shortDays.push(d);
    if (!shortDays.length) break;
    const d = shortDays[Math.floor(Math.random() * shortDays.length)];
    let done = false;
    for (const s of shuffle(staff.slice())) {
      if (cells[s.id][d] !== '公' || fixed[s.id][d] || forcedOff[s.id][d]) continue;
      if (s.weekendOff && isOffDay(y, m, d)) continue;
      if (!followOk(get(s.id, d - 1), dayCode(s))) continue;
      for (const k of shuffle(Object.keys(tentative[s.id]).map(Number))) {
        if (dayCount[k] - counts(s) < reqDay(y, m, k)) continue;
        cells[s.id][k] = '公';
        cells[s.id][d] = dayCode(s);
        const ok = runAround(s.id, d) <= S.maxConsecWork;
        cells[s.id][k] = dayCode(s);
        cells[s.id][d] = '公';
        if (!ok) continue;
        makeOff(s, k);
        makeWork(s, d);
        done = true;
        break;
      }
      if (done) break;
    }
  }
  return plan;
}

function runAutoGenerate() {
  const { y, m } = view;
  const md = monthData(y, m);
  const hasManual = DB.staff.some(s => Object.keys(md.cells[s.id] || {}).some(d => !mdGet(md, 'auto', s.id, d)));
  const msg = hasManual
    ? '手で入力した勤務と休み希望はそのまま残し、空いている所を自動で埋めます。\n（前回の自動作成分は作り直します）\nよろしいですか？'
    : '休み希望を残して、この月の勤務表を自動で作成します。よろしいですか？';
  if (!confirm(msg)) return;
  showLoading(true);
  setTimeout(() => {
    try {
      let best = null, bestA = null;
      const tries = 40;
      for (let i = 0; i < tries; i++) {
        const plan = autoGenerateOnce(y, m);
        const a = analyze(plan);
        if (!best || a.score < bestA.score) { best = plan; bestA = a; }
      }
      // 自動作成分を書き込む
      pushHistory();
      DB.staff.forEach(s => {
        for (let d = 1; d <= best.n; d++) {
          if (mdGet(md, 'auto', s.id, d)) { mdSet(md, 'cells', s.id, d, ''); mdSet(md, 'auto', s.id, d, false); }
          if (best.fixed[s.id][d]) continue;
          const v = best.cells[s.id][d];
          if (v) { mdSet(md, 'cells', s.id, d, v); mdSet(md, 'auto', s.id, d, true); }
        }
      });
      scheduleSave();
      render();
      const errors = bestA.issues.filter(i => i.sev === 'error').length;
      showToast(errors ? `作成しました。要確認が${errors}件あります（下の一覧を確認してください）` : '作成しました。問題は見つかりませんでした', errors ? 'error' : 'success');
    } catch (e) {
      console.error(e);
      showToast('作成に失敗しました: ' + e.message, 'error');
    } finally {
      showLoading(false);
    }
  }, 30);
}

function applyCode(id, d, code) {
  const { y, m } = view;
  const n = daysInMonth(y, m);
  const md = monthData(y, m);
  if ((code === 'PTO公' || code === 'PTO有') && !mdGet(md, 'pto', id, d)) {
    const used = Object.keys(md.pto[id] || {}).length;
    if (used >= DB.settings.maxPtoRequests) {
      showToast(`休み希望は1人${DB.settings.maxPtoRequests}日までです（${staffById(id).name}さんはすでに${used}日）`, 'error');
      return false;
    }
  }
  const before = new Set(issuesNear(id, d).map(i => i.msg));
  const old = mdGet(md, 'cells', id, d);
  const nextIsAke = d < n && mdGet(md, 'cells', id, d + 1) === '明' && !mdGet(md, 'pto', id, d + 1);
  if (code === 'PTO公' || code === 'PTO有') {
    mdSet(md, 'pto', id, d, code.slice(3));
    mdSet(md, 'cells', id, d, '');
  } else if (code === 'ERASE') {
    mdSet(md, 'pto', id, d, '');
    mdSet(md, 'cells', id, d, '');
  } else {
    mdSet(md, 'pto', id, d, '');
    mdSet(md, 'cells', id, d, code);
    if (code === '夜' && d < n && !mdGet(md, 'cells', id, d + 1) && !mdGet(md, 'pto', id, d + 1)) {
      mdSet(md, 'cells', id, d + 1, '明');
    }
  }
  mdSet(md, 'auto', id, d, false);
  if (old === '夜' && code !== '夜' && nextIsAke) {
    mdSet(md, 'cells', id, d + 1, '');
    mdSet(md, 'auto', id, d + 1, false);
  }
  scheduleSave();
  // 手で入れた勤務が約束ごとに反したら、その場で知らせる（入力は止めない）
  const added = issuesNear(id, d).filter(i => !before.has(i.msg));
  if (added.length) showToast('⚠ ' + added[0].msg, 'error');
  return true;
}

  const a = analyze(buildPlan(view.y, view.m, false));
  return a.issues.filter(i => i.id === id && i.d && Math.abs(i.d - d) <= 1 && i.sev === 'error');

// ============================================================
// 急な休みの代わりを探す
// 代わりに入った場合の勤務表をまるごとチェックし、問題が増えない人を上に出す。
// ============================================================
function replacementCandidates(id, d) {
  const { y, m } = view;
  const S = DB.settings;
  const plan = buildPlan(y, m, false);
  const n = plan.n;
  const code = plan.get(id, d);
  const errCount = a => a.issues.filter(i => i.sev === 'error').length;
  const base = errCount(analyze(plan));
  const out = [];
  DB.staff.forEach(s => {
    if (s.id === id) return;
    const allowed = allowedCodes(s);
    const give = allowed.includes(code) ? code
      : (code === '短' && allowed.includes('日')) ? '日'
      : (code === '日' && allowed.includes('短')) ? '短' : null;
    if (!give) return;
    const cur = plan.get(s.id, d);
    if (plan.isPto(s.id, d) || (cur && cur !== '公')) return;
    if (isNight(give) && (!s.nightOK || nightNgOn(s, y, m, d, give))) return;
    const p = plan.get(s.id, d - 1), nx = plan.get(s.id, d + 1);
    if (!followOk(p, give)) return;
    if (give !== '夜' && !followOk(give, nx)) return;
    if (give === '深' && plan.isPto(s.id, d - 1)) return;
    if ((give === '準' || give === '夜') && plan.isPto(s.id, d + 1)) return;
    if (give === '夜' && d < n && nx && nx !== '公') return;

    // 仮に入れ替えてチェックする
    const keep = [plan.cells[s.id][d], plan.cells[s.id][d + 1], plan.cells[id][d], plan.cells[id][d + 1]];
    plan.cells[s.id][d] = give;
    if (give === '夜' && d < n) plan.cells[s.id][d + 1] = '明';
    plan.cells[id][d] = '有';
    if (code === '夜' && d < n && plan.cells[id][d + 1] === '明') plan.cells[id][d + 1] = '';
    const a = analyze(plan);
    [plan.cells[s.id][d], plan.cells[s.id][d + 1], plan.cells[id][d], plan.cells[id][d + 1]] = keep;

    const stt = a.staffStats[s.id];
    out.push({
      s, give, lostOff: cur === '公' || (give === '夜' && nx === '公'),
      added: Math.max(0, errCount(a) - base),
      nightRatio: stt.nightUnits / Math.max(1, s.nightMax),
      workDays: n - stt.off - stt.paid - stt.empty,
    });
  });
  out.sort((a, b) => (a.added - b.added)
    || (isNight(code) ? a.nightRatio - b.nightRatio : a.workDays - b.workDays)
    || (a.lostOff - b.lostOff));
  return out;
}

// ============================================================
// 入れ替え：2つのマスの勤務を交換する（2交代の夜勤は明けと一緒に動かす）
// ============================================================
function handleSwap(id, d) {
  const sel = view.swapSel;
  if (!sel) { view.swapSel = { id, d }; renderGrid(); return; }
  view.swapSel = null;
  if (sel.id === id && sel.d === d) { renderGrid(); return; }
  const md = monthData(view.y, view.m);
  const n = daysInMonth(view.y, view.m);
  const take = (i, k) => ({ c: mdGet(md, 'cells', i, k), p: mdGet(md, 'pto', i, k) });
  const put = (i, k, v) => { mdSet(md, 'cells', i, k, v.c); mdSet(md, 'pto', i, k, v.p); mdSet(md, 'auto', i, k, false); };
  const A = take(sel.id, sel.d), B = take(id, d);
  const pairs = [[sel.d, d]];
  if (['夜', '明'].includes(A.c) || ['夜', '明'].includes(B.c)) {
    if (sel.d !== d || A.c === '明' || B.c === '明') {
      showToast('2交代の夜勤は明けと組なので、同じ日の「夜」のマスどうしで入れ替えてください', 'error');
      renderGrid();
      return;
    }
    if (d < n) pairs.push([d + 1, d + 1]);
  }
  const errCount = () => analyze(buildPlan(view.y, view.m, false)).issues.filter(i => i.sev === 'error').length;
  const before = errCount();
  pushHistory();
  pairs.forEach(([da, db]) => {
    const x = take(sel.id, da), y2 = take(id, db);
    put(sel.id, da, y2);
    put(id, db, x);
  });
  scheduleSave();
  renderGrid();
  const added = errCount() - before;
  if (added > 0) showToast(`入れ替えました。要修正が${added}件増えています（「↶ 元に戻す」で取り消せます）`, 'error');
  else showToast(`${staffById(sel.id).name}さんの${sel.d}日と${staffById(id).name}さんの${d}日を入れ替えました`);
}
