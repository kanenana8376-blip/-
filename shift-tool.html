<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>シフト入力ツール</title>
<style>
  :root {
    --navy: #1F4E79;
    --navy-dark: #163a59;
    --ink: #2c2c2a;
    --muted: #6b6b68;
    --line: #d8d6cd;
    --bg: #f7f5f0;
    --panel: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  header {
    background: var(--navy);
    color: #fff;
    padding: 18px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  header h1 {
    font-size: 18px;
    font-weight: 700;
    margin: 0;
    letter-spacing: 0.02em;
  }
  header .sub {
    font-size: 12px;
    color: #cfe0ee;
    margin-top: 2px;
  }
  .month-input {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
  }
  .month-input input {
    border: none;
    border-radius: 4px;
    padding: 6px 8px;
    font-size: 13px;
    width: 90px;
  }
  .layout {
    display: flex;
    min-height: calc(100vh - 64px);
  }
  .sidebar {
    width: 280px;
    background: var(--panel);
    border-right: 1px solid var(--line);
    padding: 16px;
    overflow-y: auto;
    max-height: calc(100vh - 64px);
  }
  .sidebar h2 {
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin: 4px 0 10px;
  }
  .search {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    font-size: 13px;
    margin-bottom: 10px;
  }
  .staff-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .staff-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 9px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    border: 1px solid transparent;
  }
  .staff-item:hover { background: #f0eee7; }
  .staff-item.active {
    background: #e8f0f8;
    border-color: var(--navy);
    font-weight: 700;
  }
  .staff-item .cat {
    font-size: 11px;
    color: var(--muted);
    font-weight: 400;
  }
  .staff-item .filled-badge {
    font-size: 10px;
    background: #e0e8f0;
    color: #1F4E79;
    padding: 1px 6px;
    border-radius: 10px;
    font-weight: 700;
    white-space: nowrap;
  }
  .main {
    flex: 1;
    padding: 24px 28px;
    overflow-x: auto;
  }
  .empty-state {
    color: var(--muted);
    font-size: 14px;
    padding: 60px 0;
    text-align: center;
  }
  .person-header {
    display: flex;
    align-items: baseline;
    gap: 14px;
    margin-bottom: 4px;
    flex-wrap: wrap;
  }
  .person-header h2 {
    font-size: 20px;
    margin: 0;
  }
  .person-header .tag {
    font-size: 12px;
    background: #eee;
    color: var(--muted);
    padding: 3px 9px;
    border-radius: 12px;
  }
  .person-meta {
    font-size: 12.5px;
    color: var(--muted);
    margin-bottom: 18px;
  }
  .person-meta b { color: var(--ink); font-weight: 700; }
  .summary-row {
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .summary-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 14px;
    min-width: 64px;
    text-align: center;
  }
  .summary-card .num { font-size: 18px; font-weight: 700; }
  .summary-card .lbl { font-size: 10.5px; color: var(--muted); margin-top: 1px; }
  .weekday-header {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
    margin-bottom: 6px;
  }
  .weekday-header div {
    text-align: center;
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    padding: 2px 0;
  }
  .weekday-header div.sun { color: #c0392b; }
  .weekday-header div.sat { color: #2566a8; }
  .day-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
  }
  .day-cell {
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
    padding: 7px 6px 8px;
    cursor: pointer;
    transition: box-shadow .12s, border-color .12s;
    position: relative;
    min-height: 64px;
  }
  .day-cell.empty {
    background: transparent;
    border-color: transparent;
    cursor: default;
  }
  .day-cell:hover { border-color: var(--navy); box-shadow: 0 0 0 1px var(--navy) inset; }
  .day-cell .d-num {
    font-size: 12px;
    color: var(--muted);
    font-weight: 700;
  }
  .day-cell .d-wd { font-size: 10px; color: var(--muted); margin-left: 3px; }
  .day-cell.weekend .d-num, .day-cell.weekend .d-wd { color: #c0392b; }
  .day-cell .d-val {
    margin-top: 5px;
    font-size: 14px;
    font-weight: 700;
    min-height: 18px;
  }
  .day-cell.has-warn { outline: 2px solid #e24b4a; outline-offset: -1px; }
  .day-cell .warn-icon {
    position: absolute;
    top: 4px;
    right: 5px;
    font-size: 11px;
    color: #c0392b;
  }
  .picker-overlay {
    position: fixed;
    inset: 0;
    background: rgba(20,20,18,0.35);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
  }
  .picker-overlay.open { display: flex; }
  .picker-box {
    background: #fff;
    border-radius: 12px;
    padding: 18px;
    width: 320px;
    max-width: 92vw;
  }
  .picker-box h3 {
    font-size: 14px;
    margin: 0 0 4px;
  }
  .picker-box .picker-sub {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 14px;
  }
  .picker-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .picker-opt {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 4px;
    text-align: center;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    background: #fafafa;
  }
  .picker-opt:hover { border-color: var(--navy); }
  .picker-opt.out-of-scope::after {
    content: "△";
    display: block;
    font-size: 9px;
    color: #c0392b;
    margin-top: 2px;
  }
  .picker-clear {
    margin-top: 12px;
    width: 100%;
    padding: 9px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    font-size: 13px;
    cursor: pointer;
    color: var(--muted);
  }
  .picker-close {
    margin-top: 8px;
    width: 100%;
    padding: 9px;
    border: none;
    border-radius: 8px;
    background: #f0eee7;
    font-size: 13px;
    cursor: pointer;
    color: var(--muted);
  }
  .toolbar {
    display: flex;
    gap: 10px;
    margin-top: 20px;
    flex-wrap: wrap;
  }
  .btn {
    border: 1px solid var(--line);
    background: #fff;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 13px;
    cursor: pointer;
    font-weight: 700;
  }
  .btn.primary {
    background: var(--navy);
    color: #fff;
    border-color: var(--navy);
  }
  .btn.primary:hover { background: var(--navy-dark); }
  .btn:hover { border-color: var(--navy); }
  .legend {
    margin-top: 22px;
    font-size: 11.5px;
    color: var(--muted);
    line-height: 1.7;
  }
  .legend b { color: var(--ink); }
  .toast {
    position: fixed;
    bottom: 22px;
    right: 22px;
    background: var(--navy);
    color: #fff;
    padding: 12px 18px;
    border-radius: 8px;
    font-size: 13px;
    box-shadow: 0 4px 14px rgba(0,0,0,.18);
    opacity: 0;
    transform: translateY(8px);
    transition: opacity .2s, transform .2s;
    pointer-events: none;
    z-index: 80;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .btn-load {
    background: #fff;
    border: 1px solid #cfe0ee;
    color: #fff;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    background: rgba(255,255,255,0.12);
  }
  .btn-load:hover { background: rgba(255,255,255,0.22); }
  .picker-tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 12px;
    border-bottom: 1px solid var(--line);
  }
  .picker-tab {
    flex: 1;
    border: none;
    background: none;
    padding: 8px 0;
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  .picker-tab.active { color: var(--navy); border-bottom-color: var(--navy); }
  .picker-pto-desc {
    font-size: 12.5px;
    color: var(--muted);
    margin: 0 0 12px;
    line-height: 1.5;
  }
  .loading-overlay {
    position: fixed;
    inset: 0;
    background: rgba(255,255,255,0.85);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .loading-overlay.show { display: flex; }
  .loading-box {
    background: var(--navy);
    color: #fff;
    padding: 16px 28px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
  }
  .pto-badge {
    position: absolute;
    top: 4px;
    left: 5px;
    font-size: 9px;
    background: #1f4e79;
    color: #fff;
    padding: 1px 5px;
    border-radius: 6px;
    font-weight: 700;
  }
  .holiday-dot {
    display: inline-block;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #c0392b;
    margin-left: 3px;
    vertical-align: middle;
  }
  .night-req-box {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px;
    background: #fff;
    margin-bottom: 10px;
  }
  .night-req-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .night-req-row label { font-size: 12.5px; font-weight: 700; }
  .night-req-row input {
    width: 64px;
    padding: 5px 8px;
    border: 1px solid var(--line);
    border-radius: 6px;
    font-size: 13px;
    text-align: center;
  }
  .night-req-note {
    font-size: 10.5px;
    color: var(--muted);
    line-height: 1.5;
    margin: 4px 0 10px;
  }
  .night-req-divider {
    font-size: 10.5px;
    font-weight: 700;
    color: #c0392b;
    border-top: 1px solid var(--line);
    padding-top: 7px;
    margin-top: 3px;
  }
  .mode-tabs {
    display: flex;
    border-bottom: 1px solid var(--line);
    margin-bottom: 14px;
  }
  .mode-tab {
    flex: 1;
    border: none;
    background: none;
    padding: 10px 2px;
    font-size: 11.5px;
    font-weight: 700;
    color: var(--muted);
    cursor: pointer;
    white-space: nowrap;
    border-bottom: 2px solid transparent;
  }
  .mode-tab.active { color: var(--navy); border-bottom-color: var(--navy); }
  .mgmt-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .mgmt-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
  }
  .mgmt-item .mgmt-main { font-size: 13px; font-weight: 700; }
  .mgmt-item .mgmt-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .mgmt-item .mgmt-actions { display: flex; gap: 6px; }
  .mgmt-item .mgmt-actions button {
    border: 1px solid var(--line);
    background: #fff;
    border-radius: 6px;
    padding: 4px 9px;
    font-size: 11.5px;
    cursor: pointer;
  }
  .mgmt-item .mgmt-actions button.danger { color: #c0392b; border-color: #f0c4c0; }
  .mgmt-add-btn {
    width: 100%;
    padding: 10px;
    border: 1px dashed var(--navy);
    background: #fff;
    color: var(--navy);
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 10px;
  }
  .dept-swatch {
    display: inline-block;
    width: 12px;
    height: 12px;
    border-radius: 3px;
    margin-right: 6px;
    vertical-align: middle;
    border: 1px solid rgba(0,0,0,0.1);
  }
  .form-row { margin-bottom: 12px; }
  .form-row label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .form-row input[type="text"], .form-row input[type="number"], .form-row select {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    font-size: 13px;
    font-family: inherit;
  }
  .form-row input[type="color"] {
    width: 60px;
    height: 34px;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 2px;
  }
  .committee-checks {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 140px;
    overflow-y: auto;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 8px 10px;
  }
  .committee-checks label {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12.5px;
    font-weight: 400;
    color: var(--ink);
    margin-bottom: 0;
    cursor: pointer;
  }
  .committee-checks .empty-hint { font-size: 12px; color: var(--muted); }
  .committee-tag {
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 12px;
    color: #fff;
    font-weight: 700;
  }
  :focus-visible {
    outline: 2px solid var(--navy);
    outline-offset: 2px;
  }
  .month-nav-btn {
    border: none;
    background: rgba(255,255,255,0.14);
    color: #fff;
    width: 26px;
    height: 26px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    line-height: 1;
  }
  .month-nav-btn:hover { background: rgba(255,255,255,0.26); }
  .month-input .current-month {
    font-weight: 700;
    min-width: 74px;
    text-align: center;
  }
  .toast.success { background: var(--navy); }
  .toast.error { background: #a83232; }
  .filter-tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 10px;
  }
  .filter-tabs button {
    flex: 1;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--muted);
    border-radius: 6px;
    padding: 6px 2px;
    font-size: 11.5px;
    font-weight: 700;
    cursor: pointer;
  }
  .filter-tabs button.active {
    background: var(--navy);
    color: #fff;
    border-color: var(--navy);
  }
  .staff-item.zero-filled .cat { color: #a83232; }
  .filled-badge.badge-zero { background: #f6d4d0; color: #a83232; }
  .filled-badge.badge-full { background: #dcedc8; color: #33691e; }
  .sidebar-actions {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 14px;
  }
  .sidebar-actions .btn-export {
    width: 100%;
    padding: 10px;
    border: 1px solid var(--navy);
    background: var(--navy);
    color: #fff;
    border-radius: 8px;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
  }
  .sidebar-actions .btn-export:hover { background: var(--navy-dark); }
  .dashboard-cards {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin: 18px 0 24px;
  }
  .dashboard-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 20px;
    min-width: 120px;
    text-align: center;
  }
  .dashboard-card .num { font-size: 26px; font-weight: 700; }
  .dashboard-card .lbl { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .dashboard-card.warn .num { color: #a83232; }
  .dashboard-section {
    margin-bottom: 26px;
  }
  .dashboard-section h3 {
    font-size: 13.5px;
    margin: 0 0 10px;
    color: var(--ink);
  }
  .dashboard-section .hint {
    font-size: 12px;
    color: var(--muted);
    margin: -6px 0 12px;
  }
  .dashboard-chip-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .dashboard-chip {
    border: 1px solid var(--line);
    background: #fff;
    border-radius: 20px;
    padding: 7px 14px;
    font-size: 12.5px;
    cursor: pointer;
    font-weight: 700;
  }
  .dashboard-chip:hover { border-color: var(--navy); }
  .dashboard-chip.chip-warn { border-color: #e7b3ae; color: #a83232; background: #fdf3f2; }
  .dashboard-empty {
    color: var(--muted);
    font-size: 13px;
  }
  .view-toggle {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
  }
  .view-toggle button {
    border: 1px solid var(--line);
    background: #fff;
    color: var(--muted);
    padding: 9px 16px;
    border-radius: 8px;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
  }
  .view-toggle button.active {
    background: var(--navy);
    color: #fff;
    border-color: var(--navy);
  }
  .print-only-title { display: none; }
  .grid-view-wrap {
    overflow: auto;
    max-height: calc(100vh - 260px);
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
  }
  .grid-table {
    border-collapse: collapse;
    font-size: 11px;
    white-space: nowrap;
  }
  .grid-table th, .grid-table td {
    border: 1px solid var(--line);
    padding: 3px 4px;
    text-align: center;
  }
  .grid-table thead th {
    background: var(--navy);
    color: #fff;
    position: sticky;
    top: 0;
    z-index: 2;
    font-weight: 700;
    font-size: 10.5px;
  }
  .grid-table td.weekend-col, .grid-table th.weekend-col { background: #fdf1f0; }
  .grid-table th.weekend-col { background: var(--navy-dark); }
  .grid-table th.name-col, .grid-table td.name-col {
    position: sticky;
    left: 0;
    background: var(--panel);
    z-index: 1;
    text-align: left;
    min-width: 90px;
    max-width: 90px;
  }
  .grid-table th.cat-col, .grid-table td.cat-col {
    position: sticky;
    left: 90px;
    background: var(--panel);
    z-index: 1;
    text-align: left;
    color: var(--muted);
    min-width: 76px;
    max-width: 76px;
    font-size: 10.5px;
  }
  .grid-table thead th.name-col, .grid-table thead th.cat-col { background: var(--navy); z-index: 3; }
  .grid-table td.name-col { font-weight: 700; }
  .grid-table td.shift-cell {
    cursor: pointer;
    min-width: 30px;
    font-weight: 700;
  }
  .grid-table td.shift-cell:hover { outline: 2px solid var(--navy); outline-offset: -2px; }
  .grid-table td.warn-cell { outline: 2px solid #e24b4a; outline-offset: -2px; color: #a83232; }
  .grid-table tr.grid-summary-row td { background: #f2f2f2; font-weight: 700; }
  .grid-table tr.grid-summary-row td.name-col, .grid-table tr.grid-summary-row td.cat-col { background: #f2f2f2; font-size: 10px; font-weight: 700; }
  .grid-table td.shortage-neg { background: #f6d4d0; color: #a83232; }
  .grid-table td.shortage-pos { background: #fdf0c8; color: #8a6d1f; }
  .grid-table td.shortage-ok { color: var(--muted); font-weight: 400; }
  @media print {
    header, .sidebar, .view-toggle, .toolbar, .toast, .loading-overlay { display: none !important; }
    body { background: #fff; }
    .layout { display: block; min-height: 0; }
    .main { padding: 6px; overflow: visible; }
    .print-only-title { display: block; font-size: 16px; font-weight: 700; margin-bottom: 10px; }
    .grid-view-wrap { max-height: none; overflow: visible; border: none; }
    .grid-table { font-size: 8.5px; }
    .grid-table th, .grid-table td { padding: 2px 3px; position: static !important; }
    @page { size: landscape; margin: 8mm; }
  }
  .d-event {
    margin-top: 3px;
    font-size: 9px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .grid-table tr.grid-event-row td { background: #eef4fa; font-weight: 700; font-size: 10px; }

<script>
/*
  Expanded dependency-free XLSX writer (v2).
  Supports multiple sheets, formulas, fills, merged cells, column
  widths/hidden columns, conditional formatting rules, and basic
  data validation lists. Builds a valid OOXML package using an
  uncompressed ("STORE") ZIP container by hand, so it needs zero
  external libraries and works fully offline.

  This is a small, purpose-built subset of OOXML -- not a general
  spreadsheet engine. It deliberately writes FORMULAS as formula
  strings (no cached value), which is valid OOXML; Excel/LibreOffice
  recalculate on open.
*/

// ---------- CRC32 ----------
const CRC_TABLE = (() => {
  const table = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    table[n] = c >>> 0;
  }
  return table;
})();
function crc32(bytes) {
  let crc = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) crc = CRC_TABLE[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
  return (crc ^ 0xFFFFFFFF) >>> 0;
}
function strToBytes(str) { return new TextEncoder().encode(str); }

// ---------- minimal ZIP (store, no compression) ----------
function buildZip(files) {
  const localParts = [];
  const centralParts = [];
  let offset = 0;
  files.forEach(file => {
    const nameBytes = strToBytes(file.name);
    const data = file.data;
    const crc = crc32(data);
    const size = data.length;

    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true);
    lh.setUint16(4, 20, true);
    lh.setUint32(14, crc, true);
    lh.setUint32(18, size, true);
    lh.setUint32(22, size, true);
    lh.setUint16(26, nameBytes.length, true);
    const localChunk = new Uint8Array(30 + nameBytes.length + size);
    localChunk.set(new Uint8Array(lh.buffer), 0);
    localChunk.set(nameBytes, 30);
    localChunk.set(data, 30 + nameBytes.length);
    localParts.push(localChunk);

    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true);
    ch.setUint16(4, 20, true);
    ch.setUint16(6, 20, true);
    ch.setUint32(16, crc, true);
    ch.setUint32(20, size, true);
    ch.setUint32(24, size, true);
    ch.setUint16(28, nameBytes.length, true);
    ch.setUint32(42, offset, true);
    const centralChunk = new Uint8Array(46 + nameBytes.length);
    centralChunk.set(new Uint8Array(ch.buffer), 0);
    centralChunk.set(nameBytes, 46);
    centralParts.push(centralChunk);

    offset += localChunk.length;
  });
  const centralStart = offset;
  let centralSize = 0;
  centralParts.forEach(p => centralSize += p.length);
  const eocd = new DataView(new ArrayBuffer(22));
  eocd.setUint32(0, 0x06054b50, true);
  eocd.setUint16(8, files.length, true);
  eocd.setUint16(10, files.length, true);
  eocd.setUint32(12, centralSize, true);
  eocd.setUint32(16, centralStart, true);
  const out = new Uint8Array(offset + centralSize + 22);
  let pos = 0;
  localParts.forEach(p => { out.set(p, pos); pos += p.length; });
  centralParts.forEach(p => { out.set(p, pos); pos += p.length; });
  out.set(new Uint8Array(eocd.buffer), pos);
  return out;
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
}
function colLetter(n) {
  let s = '';
  while (n > 0) { const rem = (n - 1) % 26; s = String.fromCharCode(65 + rem) + s; n = Math.floor((n - 1) / 26); }
  return s;
}

// ============================================================
// Sheet builder: a thin object model so calling code can describe
// a sheet declaratively, then renderWorkbook() turns N of these
// into a complete xlsx.
// ============================================================
class SheetBuilder {
  constructor(name) {
    this.name = name;
    this.cells = {};       // 'A1' -> {v, f, s (style key), t}
    this.merges = [];      // 'A1:B1'
    this.colWidths = {};   // 'A' -> width
    this.colHidden = {};   // 'A' -> true
    this.rowHeights = {};  // 1 -> height
    this.condFormats = []; // {ref, type, formula, dxfId}
    this.dataValidations = []; // {ref, formula1}
    this.freezeRow = 0;
    this.freezeCol = 0;
    this.showGridLines = true;
    this.tabColor = null;
  }
  set(ref, value, opts) {
    opts = opts || {};
    this.cells[ref] = { v: value, s: opts.style || null, formula: !!opts.formula };
    return this;
  }
  formula(ref, formulaStr, opts) {
    opts = opts || {};
    this.cells[ref] = { f: formulaStr, s: opts.style || null };
    return this;
  }
  merge(ref) { this.merges.push(ref); return this; }
  colWidth(letterOrRange, width) {
    if (letterOrRange.includes(':')) {
      const [a, b] = letterOrRange.split(':');
      const start = colNum(a), end = colNum(b);
      for (let i = start; i <= end; i++) this.colWidths[colLetter(i)] = width;
    } else this.colWidths[letterOrRange] = width;
    return this;
  }
  hideCol(letter) { this.colHidden[letter] = true; return this; }
  rowHeight(row, h) { this.rowHeights[row] = h; return this; }
  freeze(row, col) { this.freezeRow = row; this.freezeCol = col; return this; }
  noGrid() { this.showGridLines = false; return this; }
  condFormat(ref, type, params) {
    this.condFormats.push({ ref, type, params });
    return this;
  }
  dataValidation(ref, listFormula) {
    this.dataValidations.push({ ref, formula: listFormula });
    return this;
  }
}

function colNum(letter) {
  let n = 0;
  for (let i = 0; i < letter.length; i++) n = n * 26 + (letter.charCodeAt(i) - 64);
  return n;
}

// ============================================================
// Style registry: collects fonts/fills/borders/numFmts used across
// ALL sheets and assigns shared cellXfs indices.
// ============================================================
class StyleRegistry {
  constructor() {
    this.fonts = [{ name: 'Yu Gothic', sz: 10, bold: false, color: null }];
    this.fills = [null, null]; // 0=none,1=gray125 reserved by spec
    this.numFmts = {}; // code -> id (custom only, 164+)
    this.xfs = [{ fontId: 0, fillId: 0, numFmtId: 0, align: null, border: false }];
    this.xfKey = new Map();
    this._nextNumFmtId = 164;
  }
  font(opts) {
    opts = opts || {};
    const key = JSON.stringify(opts);
    let idx = this.fonts.findIndex(f => JSON.stringify(f) === key);
    if (idx === -1) { idx = this.fonts.length; this.fonts.push(Object.assign({ name: 'Yu Gothic', sz: 10, bold: false, color: null }, opts)); }
    return idx;
  }
  fill(hex) {
    if (!hex) return 0;
    const key = hex.toUpperCase();
    let idx = this.fills.indexOf(key);
    if (idx === -1) { idx = this.fills.length; this.fills.push(key); }
    return idx;
  }
  numFmt(code) {
    if (!code) return 0;
    if (this.numFmts[code] !== undefined) return this.numFmts[code];
    const id = this._nextNumFmtId++;
    this.numFmts[code] = id;
    return id;
  }
  xf(opts) {
    // opts: {fontId, fillId, numFmtId, align: {h,v,wrap}, border}
    const key = JSON.stringify(opts);
    if (this.xfKey.has(key)) return this.xfKey.get(key);
    const idx = this.xfs.length;
    this.xfs.push(opts);
    this.xfKey.set(key, idx);
    return idx;
  }
  // convenience: build a style and return its xf index in one call
  style({ bold, size, color, fill, halign, valign, wrap, border, numFmt }) {
    const fontId = this.font({ name: 'Yu Gothic', sz: size || 10, bold: !!bold, color: color || null });
    const fillId = this.fill(fill);
    const numFmtId = this.numFmt(numFmt);
    return this.xf({
      fontId, fillId, numFmtId,
      align: (halign || valign || wrap) ? { h: halign, v: valign, wrap: !!wrap } : null,
      border: !!border,
    });
  }
}

// ============================================================
// XML rendering
// ============================================================
function renderStylesXml(reg) {
  let fontsXml = reg.fonts.map(f => {
    let s = '<font>';
    if (f.bold) s += '<b/>';
    s += `<sz val="${f.sz}"/>`;
    if (f.color) s += `<color rgb="FF${f.color}"/>`;
    s += `<name val="${esc(f.name)}"/></font>`;
    return s;
  }).join('');

  let fillsXml = '<fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill>';
  reg.fills.slice(2).forEach(hex => {
    fillsXml += `<fill><patternFill patternType="solid"><fgColor rgb="FF${hex}"/><bgColor indexed="64"/></patternFill></fill>`;
  });

  let numFmtsXml = '';
  const numFmtEntries = Object.entries(reg.numFmts);
  if (numFmtEntries.length) {
    numFmtsXml = `<numFmts count="${numFmtEntries.length}">` +
      numFmtEntries.map(([code, id]) => `<numFmt numFmtId="${id}" formatCode="${esc(code)}"/>`).join('') +
      '</numFmts>';
  }

  let borderXml = '<border><left/><right/><top/><bottom/><diagonal/></border>' +
    '<border><left style="thin"><color rgb="FFBFBFBF"/></left><right style="thin"><color rgb="FFBFBFBF"/></right>' +
    '<top style="thin"><color rgb="FFBFBFBF"/></top><bottom style="thin"><color rgb="FFBFBFBF"/></bottom><diagonal/></border>';

  let cellXfsXml = reg.xfs.map(xf => {
    const align = xf.align;
    let alignXml = '';
    if (align && (align.h || align.v || align.wrap)) {
      alignXml = `<alignment${align.h ? ` horizontal="${align.h}"` : ''}${align.v ? ` vertical="${align.v}"` : ''}${align.wrap ? ' wrapText="1"' : ''}/>`;
    }
    const borderId = xf.border ? 1 : 0;
    return `<xf numFmtId="${xf.numFmtId || 0}" fontId="${xf.fontId || 0}" fillId="${xf.fillId || 0}" borderId="${borderId}" applyFont="1" applyFill="1" applyBorder="${borderId ? 1 : 0}" applyAlignment="${alignXml ? 1 : 0}" applyNumberFormat="${xf.numFmtId ? 1 : 0}">${alignXml}</xf>`;
  }).join('');

  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
    numFmtsXml +
    `<fonts count="${reg.fonts.length}">${fontsXml}</fonts>` +
    `<fills count="${reg.fills.length}">${fillsXml}</fills>` +
    `<borders count="2">${borderXml}</borders>` +
    '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
    `<cellXfs count="${reg.xfs.length}">${cellXfsXml}</cellXfs>` +
    '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>' +
    '</styleSheet>';
}

function renderSheetXml(sheet) {
  // figure out used range
  let maxRow = 0, maxCol = 0;
  Object.keys(sheet.cells).forEach(ref => {
    const m = ref.match(/^([A-Z]+)(\d+)$/);
    maxCol = Math.max(maxCol, colNum(m[1]));
    maxRow = Math.max(maxRow, parseInt(m[2]));
  });

  const rowsMap = {};
  Object.entries(sheet.cells).forEach(([ref, cell]) => {
    const m = ref.match(/^([A-Z]+)(\d+)$/);
    const r = parseInt(m[2]);
    if (!rowsMap[r]) rowsMap[r] = [];
    rowsMap[r].push({ ref, col: colNum(m[1]), cell });
  });

  let sheetData = '';
  for (let r = 1; r <= maxRow; r++) {
    const rowCells = (rowsMap[r] || []).sort((a, b) => a.col - b.col);
    if (rowCells.length === 0 && !sheet.rowHeights[r]) continue;
    const hAttr = sheet.rowHeights[r] ? ` ht="${sheet.rowHeights[r]}" customHeight="1"` : '';
    let cellsXml = '';
    rowCells.forEach(({ ref, cell }) => {
      const sAttr = cell.s !== null && cell.s !== undefined ? ` s="${cell.s}"` : '';
      if (cell.f !== undefined) {
        cellsXml += `<c r="${ref}"${sAttr}><f>${esc(cell.f)}</f></c>`;
      } else if (typeof cell.v === 'number') {
        cellsXml += `<c r="${ref}"${sAttr}><v>${cell.v}</v></c>`;
      } else if (cell.v === null || cell.v === undefined || cell.v === '') {
        cellsXml += `<c r="${ref}"${sAttr}/>`;
      } else {
        cellsXml += `<c r="${ref}" t="inlineStr"${sAttr}><is><t xml:space="preserve">${esc(cell.v)}</t></is></c>`;
      }
    });
    sheetData += `<row r="${r}"${hAttr}>${cellsXml}</row>`;
  }

  let colsXml = '';
  const colEntries = Object.keys(sheet.colWidths).map(l => colNum(l));
  if (colEntries.length || Object.keys(sheet.colHidden).length) {
    const allLetters = new Set([...Object.keys(sheet.colWidths), ...Object.keys(sheet.colHidden)]);
    const nums = [...allLetters].map(colNum).sort((a, b) => a - b);
    colsXml = '<cols>' + nums.map(n => {
      const letter = colLetter(n);
      const w = sheet.colWidths[letter] || 8.43;
      const hidden = sheet.colHidden[letter] ? ' hidden="1"' : '';
      return `<col min="${n}" max="${n}" width="${w}" customWidth="1"${hidden}/>`;
    }).join('') + '</cols>';
  }

  let mergeXml = '';
  if (sheet.merges.length) {
    mergeXml = `<mergeCells count="${sheet.merges.length}">` +
      sheet.merges.map(m => `<mergeCell ref="${m}"/>`).join('') + '</mergeCells>';
  }

  let cfXml = '';
  sheet.condFormats.forEach(cf => {
    if (cf.type === 'cellIs') {
      cfXml += `<conditionalFormatting sqref="${cf.ref}"><cfRule type="cellIs" dxfId="${cf.params.dxfId}" priority="${cfXml.length + 1}" operator="${cf.params.operator}"><formula>${esc(cf.params.formula)}</formula></cfRule></conditionalFormatting>`;
    } else if (cf.type === 'expression') {
      cfXml += `<conditionalFormatting sqref="${cf.ref}"><cfRule type="expression" dxfId="${cf.params.dxfId}" priority="${cfXml.length + 1}"><formula>${esc(cf.params.formula)}</formula></cfRule></conditionalFormatting>`;
    }
  });

  let dvXml = '';
  if (sheet.dataValidations.length) {
    dvXml = `<dataValidations count="${sheet.dataValidations.length}">` +
      sheet.dataValidations.map(dv =>
        `<dataValidation type="list" allowBlank="1" showInputMessage="1" showErrorMessage="1" sqref="${dv.ref}"><formula1>${esc(dv.formula)}</formula1></dataValidation>`
      ).join('') + '</dataValidations>';
  }

  let paneXml = '';
  if (sheet.freezeRow || sheet.freezeCol) {
    const topLeft = colLetter(sheet.freezeCol + 1) + (sheet.freezeRow + 1);
    paneXml = `<pane xSplit="${sheet.freezeCol}" ySplit="${sheet.freezeRow}" topLeftCell="${topLeft}" activePane="bottomRight" state="frozen"/>`;
  }
  const sheetViewXml = `<sheetViews><sheetView${sheet.showGridLines ? '' : ' showGridLines="0"'} workbookViewId="0">${paneXml}</sheetView></sheetViews>`;

  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
    sheetViewXml +
    colsXml +
    `<sheetData>${sheetData}</sheetData>` +
    mergeXml +
    dvXml +
    cfXml +
    '</worksheet>';
}

function renderDxfsXml(dxfs) {
  // dxfs: array of {fontColor, fill}
  const items = dxfs.map(d => {
    let s = '<dxf>';
    if (d.fontColor || d.bold) {
      s += '<font>';
      if (d.fontColor) s += `<color rgb="FF${d.fontColor}"/>`;
      if (d.bold) s += '<b/>';
      s += '</font>';
    }
    if (d.fill) s += `<fill><patternFill><bgColor rgb="FF${d.fill}"/></patternFill></fill>`;
    s += '</dxf>';
    return s;
  }).join('');
  return { count: dxfs.length, xml: items };
}

// ============================================================
// Public API: build a full multi-sheet workbook
// ============================================================
function renderWorkbook(sheets, styleRegistry, dxfs) {
  const dxfData = renderDxfsXml(dxfs || []);

  let stylesXml = renderStylesXml(styleRegistry);
  if (dxfData.count) {
    stylesXml = stylesXml.replace('</styleSheet>', `<dxfs count="${dxfData.count}">${dxfData.xml}</dxfs></styleSheet>`);
  }

  const sheetEntries = sheets.map((s, i) => ({ sheet: s, idx: i + 1 }));

  const workbookXml =
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
    '<sheets>' + sheetEntries.map(e => `<sheet name="${esc(e.sheet.name)}" sheetId="${e.idx}" r:id="rId${e.idx}"/>`).join('') + '</sheets>' +
    '</workbook>';

  const workbookRels =
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    sheetEntries.map(e => `<Relationship Id="rId${e.idx}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${e.idx}.xml"/>`).join('') +
    `<Relationship Id="rId${sheetEntries.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>` +
    '</Relationships>';

  const rootRels =
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
    '</Relationships>';

  const contentTypes =
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
    '<Default Extension="xml" ContentType="application/xml"/>' +
    '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
    sheetEntries.map(e => `<Override PartName="/xl/worksheets/sheet${e.idx}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('') +
    '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
    '</Types>';

  const files = [
    { name: '[Content_Types].xml', data: strToBytes(contentTypes) },
    { name: '_rels/.rels', data: strToBytes(rootRels) },
    { name: 'xl/workbook.xml', data: strToBytes(workbookXml) },
    { name: 'xl/_rels/workbook.xml.rels', data: strToBytes(workbookRels) },
    { name: 'xl/styles.xml', data: strToBytes(stylesXml) },
  ];
  sheetEntries.forEach(e => {
    files.push({ name: `xl/worksheets/sheet${e.idx}.xml`, data: strToBytes(renderSheetXml(e.sheet)) });
  });

  return buildZip(files);
}

/*
  Replicates enhance.py's workbook construction entirely in JS, using
  xlsx-writer-v2.js as the low-level OOXML writer. Given the current
  `shifts` state (staffNo -> {day -> code}) and `STAFF` roster array,
  produces a workbook with: 使い方ガイド / ①担当一覧 / ②シフト表(oplus風) /
  ③科別勤務者一覧 / ④科別メンバー / ⑤夜勤バランス / ⑥休み希望 /
  ⑦時間帯別集計 / ⑧委員会一覧 / ⑨予定.
*/

const NAVY = '1F4E79';
const WHITE = 'FFFFFF';
const WARN_RED = 'FFC7CE';
const WARN_RED_FONT = '9C0006';
const WARN_YEL = 'FFEB9C';
const WARN_YEL_FONT = '9C6500';
const OK_GREEN = 'C6EFCE';
const OK_GREEN_FONT = '006100';

function lastDayOfMonth(year, month) { return new Date(year, month, 0).getDate(); }
function weekdayLetterJP(year, month, day) {
  return ['日','月','火','水','木','金','土'][new Date(year, month - 1, day).getDay()];
}
function capableCodesOf(staff) {
  return [staff.main, staff.sub1, staff.sub2].map(s => {
    const m = s.match(/\(([^)]+)\)/);
    return m ? m[1] : null;
  }).filter(Boolean);
}
// Effective shift value for a given staff/day: a PTO request always wins,
// forcing the day to 公 regardless of whatever was typed into the shift
// grid for that cell (matches the agreed workflow: PTO is entered first
// and takes priority over any existing shift).
function effectiveShiftValue(shifts, staffNo, day) {
  if (shifts.__pto && shifts.__pto[staffNo] && shifts.__pto[staffNo][day]) return '公';
  return (shifts[staffNo] && shifts[staffNo][day]) || '';
}

// ============================================================
// Build the complete workbook. Returns Uint8Array bytes ready to
// save as .xlsx. DEPARTMENTS is the live, user-editable department
// master list: [{code, name, color, required}, ...]. All the lookups
// that used to be hardcoded (REQUIRED_HEADCOUNT, DEPT_FULL_NAME,
// CODE_COLORS-for-departments) are derived from it here so the
// workbook always reflects whatever departments the user has defined.
// ============================================================
function buildFullWorkbook(STAFF, shifts, year, month, CODE_COLORS, DEPARTMENTS, COMMITTEES, EVENTS) {
  const REQUIRED_HEADCOUNT = {};
  const DEPT_FULL_NAME = {};
  DEPARTMENTS.forEach(d => { REQUIRED_HEADCOUNT[d.code] = d.required; DEPT_FULL_NAME[d.code] = d.name; });

  const reg = new StyleRegistry();
  const dxfs = [];
  const nDays = lastDayOfMonth(year, month);
  const FIRST_DAY_COL_NUM = 3; // C
  const dayColLetters = [];
  for (let d = 0; d < nDays; d++) dayColLetters.push(colLetterFromIndex(FIRST_DAY_COL_NUM + d));
  const lastDayColLetter = dayColLetters[dayColLetters.length - 1];

  function colLetterFromIndex(n) { return colLetter(n); }

  // ---- shared styles ----
  const sHeaderNavy = reg.style({ bold: true, color: WHITE, fill: NAVY, halign: 'center', valign: 'center' });
  const sHeaderNavySm = reg.style({ bold: true, color: WHITE, fill: NAVY, halign: 'center', valign: 'center', size: 8 });
  const sTitle = reg.style({ bold: true, color: WHITE, fill: NAVY, valign: 'center', size: 14 });
  const sSubtitle = reg.style({ color: '595959', size: 8 });
  const sNormal = reg.style({ size: 9 });
  const sNormalCenter = reg.style({ size: 9, halign: 'center' });
  const sNormalBoldCenter = reg.style({ size: 9, bold: true, halign: 'center' });
  const sMuted = reg.style({ size: 9, color: '595959' });
  const sGuideHeading = reg.style({ size: 12, bold: true, color: NAVY });
  const sGuideBody = reg.style({ size: 10, color: '404040' });
  const sGuideNote = reg.style({ size: 9, color: '9C9C9C' });

  const okStyle = reg.style({ bold: true, color: OK_GREEN_FONT, fill: OK_GREEN, halign: 'center' });
  const warnRedStyle = reg.style({ bold: true, color: WARN_RED_FONT, fill: WARN_RED, halign: 'center' });
  const warnYelStyle = reg.style({ bold: true, color: WARN_YEL_FONT, fill: WARN_YEL, halign: 'center' });

  const fillStyleCache = {};
  function fillStyle(hex, opts) {
    opts = opts || {};
    const key = (hex || 'none') + JSON.stringify(opts);
    if (fillStyleCache[key] !== undefined) return fillStyleCache[key];
    const s = reg.style(Object.assign({ fill: hex, halign: 'center', size: 9 }, opts));
    fillStyleCache[key] = s;
    return s;
  }

  const sheets = [];

  // ================================================================
  // Sheet: 使い方ガイド
  // ================================================================
  const guide = new SheetBuilder('使い方ガイド');
  guide.noGrid();
  guide.colWidth('A', 100);
  guide.set('A1', `  勤務表の使い方ガイド（${year}年${month}月）`, { style: sTitle });
  guide.rowHeight(1, 28);
  const guideSections = [
    ['① シフト入力の基本', [
      'このツールでスタッフを選び、日付をクリックして記号を入れていきます。',
      '記号は内/化/循/小/皮/泌/耳/健/膠/日/代/当/明/直/救/准/深/公/有 の19種類です。',
      '「日」は日勤（科のブースに入らない日中の勤務）で、師長など担当科を持たない方に使います。',
      '「代」は師長代行です。師長が平日に不在の日は、副師長2人が交代で代行に入ります。',
      '「当」は管理当直（師長）で、その翌日は自動的に「明」（当直明け）になります。',
      '当直の日と明けの日はどちらも師長が日勤に入らないため、平日なら副師長が「代」に入ります。',
      '「直」は管理日直です。土日祝の副師長は救急外来(救)には入りません。',
      '当直(当)・明け(明)・日直(直)は自動では入りません。日付のセルをクリックして手入力してください。',
      'パートのスタッフは、その人の退勤時刻（13/14/15/16/17時）付きの記号のみ選べます。',
    ]],
    ['② 担当外の科は赤く警告されます', [
      '①担当一覧の主担当・サブ担当2科に入っていない科を選ぶと、',
      'ツール上のセルと、Excelに出力した際のセルの両方で赤く警告されます。',
    ]],
    ['③ 人数不足は②シフト表の下で確認できます', [
      '【不足チェック】の欄で、各科の必要人数に対する不足（赤）・過剰（黄）がわかります。',
    ]],
    ['④ ⑥休み希望シートで希望休を管理', [
      '希望日に「○」を入れた分は、②シフト表の該当日が自動的に「公」になります。',
      '月6回以上の希望は赤く警告されます。',
    ]],
    ['⑤ ⑤夜勤バランスシートで偏り・ルール違反をチェック', [
      '・最大連続夜勤が3日以上 → ⚠連続夜勤（赤）',
      '・最大連続出勤が5日以上 → ⚠連続出勤過多（赤）※師長は平日日勤のため対象外',
      '・夜勤の翌日に出勤 → ⚠夜勤明け勤務（赤）',
      '・休み希望が月6回以上 → ⚠休み希望超過（赤）',
      '・夜勤合計が他の常勤者平均より3回以上多い/少ない → ⚠偏りあり（黄）',
    ]],
    ['⑥ ⑧委員会一覧・⑨予定シートについて', [
      '⑧委員会一覧は、各委員会の所属メンバーを一覧できます（①担当一覧にも所属委員会の列があります）。',
      '⑨予定は、ツールの「予定」タブで登録した院内研修・会議などの日程一覧です。',
    ]],
  ];
  let gRow = 3;
  guideSections.forEach(([title, lines]) => {
    guide.set(`A${gRow}`, '  ' + title, { style: sGuideHeading });
    gRow++;
    lines.forEach(line => {
      guide.set(`A${gRow}`, '　　' + line, { style: sGuideBody });
      gRow++;
    });
    gRow++;
  });
  guide.set(`A${gRow + 1}`, '  ※ このシートはシフト入力ツールから自動生成されています。', { style: sGuideNote });
  sheets.push(guide);

  // ================================================================
  // Sheet: ①担当一覧
  // ================================================================
  const roster = new SheetBuilder('①担当一覧');
  roster.set('A1', '担当科一覧 (主担当＋サブ担当2科)', { style: reg.style({ bold: true, size: 14 }) });
  const rHeaders = ['No', '氏名', '区分', '主担当', 'サブ担当1', 'サブ担当2', '退勤時刻', '所属委員会'];
  rHeaders.forEach((h, i) => roster.set(`${colLetter(i + 1)}3`, h, { style: sHeaderNavy }));
  roster.colWidth('A', 5); roster.colWidth('B', 14); roster.colWidth('C', 12);
  roster.colWidth('D', 18); roster.colWidth('E', 18); roster.colWidth('F', 18);
  roster.colWidth('G', 9); roster.colWidth('H', 24);
  roster.freeze(3, 0);

  const deptColorByJpName = {};
  Object.entries(DEPT_FULL_NAME).forEach(([code, name]) => { deptColorByJpName[name] = CODE_COLORS[code]; });

  STAFF.forEach((staff, i) => {
    const r = 4 + i;
    roster.set(`A${r}`, staff.no);
    roster.set(`B${r}`, staff.name, { style: reg.style({ size: 9, bold: i < 3 }) });
    roster.set(`C${r}`, staff.cat, { style: sMuted });
    [staff.main, staff.sub1, staff.sub2].forEach((val, j) => {
      const deptName = val.split(' ')[0];
      const hex = deptColorByJpName[deptName];
      roster.set(`${colLetter(4 + j)}${r}`, val, { style: fillStyle(hex ? hex.replace('#', '') : null) });
    });
    roster.set(`G${r}`, staff.depTime ? `${staff.depTime}時` : '', { style: reg.style({ size: 9, bold: !!staff.depTime, color: staff.depTime ? '1F4E79' : 'BFBFBF', halign: 'center' }) });
    const committeeNames = (COMMITTEES || []).filter(c => (staff.committees || []).includes(c.id)).map(c => c.name).join('・');
    roster.set(`H${r}`, committeeNames, { style: sMuted });
  });
  sheets.push(roster);

  // ================================================================
  // Sheet: ②シフト表(oplus風)
  // ================================================================
  const shift = new SheetBuilder('②シフト表(oplus風)');
  shift.set('A1', `  ${year}年${month}月 外来シフト表`, { style: sTitle });
  shift.merge(`A1:${lastDayColLetter}1`);
  shift.rowHeight(1, 22);
  const deptLegendParts = DEPARTMENTS.map(d => `${d.code}=${d.name}`);
  const legend = `【凡例】${deptLegendParts.join(' / ')} / 救=救急外来 / 准=準夜 / 深=深夜 / 公=公休 / 有=有給 / 代=師長代行`;
  shift.set('A2', legend, { style: sSubtitle });
  shift.merge(`A2:${lastDayColLetter}2`);

  shift.set('A3', '氏名', { style: sHeaderNavy }); shift.merge('A3:A4');
  shift.set('B3', '区分', { style: sHeaderNavy }); shift.merge('B3:B4');
  for (let d = 1; d <= nDays; d++) {
    const col = dayColLetters[d - 1];
    shift.set(`${col}3`, d, { style: sHeaderNavy });
    shift.set(`${col}4`, weekdayLetterJP(year, month, d), { style: sHeaderNavy });
  }
  shift.colWidth('A', 12); shift.colWidth('B', 9);
  dayColLetters.forEach(c => shift.colWidth(c, 3.4));
  shift.freeze(4, 2);

  const FIRST_DATA_ROW = 5;
  const LAST_DATA_ROW = FIRST_DATA_ROW + STAFF.length - 1;

  STAFF.forEach((staff, i) => {
    const r = FIRST_DATA_ROW + i;
    shift.set(`A${r}`, staff.name, { style: i < 3 ? reg.style({ size: 9, bold: true }) : sNormal });
    shift.set(`B${r}`, staff.cat, { style: sMuted });
    const capable = capableCodesOf(staff);
    for (let d = 1; d <= nDays; d++) {
      const col = dayColLetters[d - 1];
      const val = effectiveShiftValue(shifts, staff.no, d);
      if (!val) { shift.set(`${col}${r}`, ''); continue; }
      const base = val[0];
      const isDept = Object.keys(REQUIRED_HEADCOUNT).includes(base);
      const outOfScope = isDept && !capable.includes(base);
      const hex = CODE_COLORS[base];
      const styleIdx = outOfScope
        ? reg.style({ size: 9, bold: true, color: WARN_RED_FONT, fill: WARN_RED, halign: 'center' })
        : fillStyle(hex ? hex.replace('#', '') : null);
      shift.set(`${col}${r}`, val, { style: styleIdx });
    }
  });

  // department count rows (wildcard logic done at write-time since this is
  // a snapshot export, not a live formula -- but we still WRITE the formula
  // so Excel keeps it live/editable after download)
  let countRow = LAST_DATA_ROW + 1;
  const deptCountRowOf = {};
  Object.entries(DEPT_FULL_NAME).forEach(([code, name]) => {
    shift.set(`A${countRow}`, name, { style: reg.style({ size: 9, bold: true, fill: (CODE_COLORS[code] || '').replace('#','') }) });
    dayColLetters.forEach(col => {
      shift.formula(`${col}${countRow}`, `COUNTIF(${col}${FIRST_DATA_ROW}:${col}${LAST_DATA_ROW},"${code}*")`, { style: sNormalBoldCenter });
    });
    deptCountRowOf[code] = countRow;
    countRow++;
  });
  ['日','代','当','明','直','救','准','深','公','有'].forEach(code => {
    const label = { '日': '日勤', '代': '師長代行', '当': '管理当直', '明': '当直明け', '直': '管理日直', '救': '救急', '准': '准夜', '深': '深夜', '公': '公休', '有': '有給' }[code];
    shift.set(`A${countRow}`, label, { style: reg.style({ size: 9, bold: true, fill: (CODE_COLORS[code] || '').replace('#','') }) });
    dayColLetters.forEach(col => {
      shift.formula(`${col}${countRow}`, `COUNTIF(${col}${FIRST_DATA_ROW}:${col}${LAST_DATA_ROW},"${code}")`, { style: sNormalBoldCenter });
    });
    countRow++;
  });
  const reqRow = countRow;
  shift.set(`A${reqRow}`, '必要人数(平日/土日祝)', { style: reg.style({ size: 9, bold: true }) });
  for (let d = 1; d <= nDays; d++) {
    const col = dayColLetters[d - 1];
    const wd = weekdayLetterJP(year, month, d);
    const isOffDay = wd === '土' || wd === '日' || isJapaneseHoliday(year, month, d);
    const text = isOffDay
      ? `日勤(救)${NIGHT_REQUIREMENTS.weekendDay}/准${NIGHT_REQUIREMENTS.weekendEvening}/深${NIGHT_REQUIREMENTS.weekendLate}`
      : `計18/准${NIGHT_REQUIREMENTS.weekdayEvening}/深${NIGHT_REQUIREMENTS.weekdayLate}`;
    shift.set(`${col}${reqRow}`, text, { style: reg.style({ size: 8, halign: 'center' }) });
  }
  countRow = reqRow + 2;

  // shortage check rows
  shift.set(`A${countRow}`, '【不足チェック】(平日のみ／必要人数との差)', { style: reg.style({ size: 9, bold: true, italic: true, color: WARN_RED_FONT }) });
  countRow++;
  const shortageRows = [];
  Object.entries(REQUIRED_HEADCOUNT).forEach(([code, need]) => {
    const name = DEPT_FULL_NAME[code];
    shift.set(`A${countRow}`, name, { style: reg.style({ size: 9, bold: true, fill: 'F2F2F2' }) });
    for (let d = 1; d <= nDays; d++) {
      const col = dayColLetters[d - 1];
      const wd = weekdayLetterJP(year, month, d);
      const isOffDay = wd === '土' || wd === '日' || isJapaneseHoliday(year, month, d);
      if (isOffDay) { shift.set(`${col}${countRow}`, ''); continue; }
      shift.formula(`${col}${countRow}`, `${col}${deptCountRowOf[code]}-${need}`, { style: reg.style({ size: 8, halign: 'center' }) });
    }
    shortageRows.push(countRow);
    countRow++;
  });
  shortageRows.forEach(r => {
    const ref = `${dayColLetters[0]}${r}:${lastDayColLetter}${r}`;
    dxfs.push({ fill: WARN_RED, fontColor: WARN_RED_FONT });
    shift.condFormat(ref, 'cellIs', { operator: 'lessThan', formula: '0', dxfId: dxfs.length - 1 });
    dxfs.push({ fill: WARN_YEL, fontColor: WARN_YEL_FONT });
    shift.condFormat(ref, 'cellIs', { operator: 'greaterThan', formula: '0', dxfId: dxfs.length - 1 });
  });

  // out-of-scope conditional formatting (kept live for any future manual edits in Excel)
  dxfs.push({ fill: WARN_RED, fontColor: WARN_RED_FONT, bold: true });
  const oosDxfId = dxfs.length - 1;
  dayColLetters.forEach(col => {
    const ref = `${col}${FIRST_DATA_ROW}:${col}${LAST_DATA_ROW}`;
    const formula = `AND(${col}${FIRST_DATA_ROW}<>"",ISERROR(MATCH(${col}${FIRST_DATA_ROW},{"救";"准";"深";"公";"有";"代"},0)),ISERROR(FIND(LEFT(${col}${FIRST_DATA_ROW},1),VLOOKUP($A${FIRST_DATA_ROW},①担当一覧!$B:$F,3,FALSE)&VLOOKUP($A${FIRST_DATA_ROW},①担当一覧!$B:$F,4,FALSE)&VLOOKUP($A${FIRST_DATA_ROW},①担当一覧!$B:$F,5,FALSE))))`;
    shift.condFormat(ref, 'expression', { formula, dxfId: oosDxfId });
  });

  sheets.push(shift);

  // ================================================================
  // Sheet: ③科別勤務者一覧 (dynamically derived from shifts, per user request)
  // ================================================================
  const deptList = new SheetBuilder('③科別勤務者一覧');
  deptList.set('A1', `  ${year}年${month}月 科別 勤務者一覧`, { style: sTitle });
  deptList.merge(`A1:${lastDayColLetter}1`);
  deptList.set('A2', '科', { style: sHeaderNavySm }); deptList.merge('A2:A3');
  deptList.set('B2', '#', { style: sHeaderNavySm }); deptList.merge('B2:B3');
  for (let d = 1; d <= nDays; d++) {
    const col = dayColLetters[d - 1];
    deptList.set(`${col}2`, d, { style: sHeaderNavySm });
    deptList.set(`${col}3`, weekdayLetterJP(year, month, d), { style: sHeaderNavySm });
  }
  deptList.colWidth('A', 12); deptList.colWidth('B', 3.5);
  dayColLetters.forEach(c => deptList.colWidth(c, 6.5));

  let dRow = 4;
  const allCodesForList = Object.keys(DEPT_FULL_NAME).concat(['准', '深']);
  const labelForList = Object.assign({}, DEPT_FULL_NAME, { '准': '準夜', '深': '深夜' });
  allCodesForList.forEach(code => {
    const need = REQUIRED_HEADCOUNT[code];
    const headerText = need ? `  ${labelForList[code]} (${code})  必要 ${need}名/平日` : `  ${labelForList[code]}`;
    deptList.set(`A${dRow}`, headerText, { style: reg.style({ bold: true, fill: 'F2F2F2' }) });
    dRow++;
    // for each day, list the staff working this code (any time-suffix variant)
    const perDayNames = [];
    let maxCount = 0;
    for (let d = 1; d <= nDays; d++) {
      const names = [];
      STAFF.forEach(staff => {
        const val = effectiveShiftValue(shifts, staff.no, d);
        if (val && val[0] === code) names.push(staff.name);
      });
      perDayNames.push(names);
      maxCount = Math.max(maxCount, names.length);
    }
    for (let i = 0; i < Math.max(maxCount, 1); i++) {
      deptList.set(`B${dRow}`, i + 1, { style: sNormalCenter });
      for (let d = 1; d <= nDays; d++) {
        const col = dayColLetters[d - 1];
        const name = perDayNames[d - 1][i] || '';
        deptList.set(`${col}${dRow}`, name, { style: reg.style({ size: 8, halign: 'center' }) });
      }
      dRow++;
    }
  });
  sheets.push(deptList);

  // ================================================================
  // Sheet: ④科別メンバー
  // ================================================================
  const members = new SheetBuilder('④科別メンバー');
  members.set('A1', '  科別メンバー一覧 (担当できるスタッフ)', { style: sTitle });
  members.merge('A1:D1');
  members.set('A2', '各科を担当できるスタッフの名簿。必要人数に対する配属余裕度を確認できます。', { style: sSubtitle });
  members.merge('A2:D2');
  members.set('A4', '  ◆ 表1: 科別の担当者リスト', { style: reg.style({ bold: true, size: 11 }) });
  ['科', '必要/日', '主担当人数', 'サブ担当人数'].forEach((h, i) => members.set(`${colLetter(i + 1)}5`, h, { style: sHeaderNavySm }));
  let mRow = 6;
  Object.entries(REQUIRED_HEADCOUNT).forEach(([code, need]) => {
    const mainCount = STAFF.filter(s => s.main.includes(`(${code})`)).length;
    const subCount = STAFF.filter(s => s.sub1.includes(`(${code})`) || s.sub2.includes(`(${code})`)).length;
    members.set(`A${mRow}`, `${DEPT_FULL_NAME[code]} (${code})`, { style: sNormal });
    members.set(`B${mRow}`, `${need}名`, { style: sNormalCenter });
    members.set(`C${mRow}`, `${mainCount}名`, { style: sNormalCenter });
    members.set(`D${mRow}`, `${subCount}名`, { style: sNormalCenter });
    mRow++;
  });
  mRow += 1;
  members.set(`A${mRow}`, '  ◆ 表2: 対応可能マトリックス (◎=主担当・○=サブ担当)', { style: reg.style({ bold: true, size: 11 }) });
  mRow++;
  const matrixHeaderRow = mRow;
  members.set(`A${mRow}`, '氏名', { style: sHeaderNavySm });
  members.set(`B${mRow}`, '区分', { style: sHeaderNavySm });
  Object.keys(DEPT_FULL_NAME).forEach((code, i) => members.set(`${colLetter(3 + i)}${mRow}`, code, { style: sHeaderNavySm }));
  mRow++;
  STAFF.forEach(staff => {
    members.set(`A${mRow}`, staff.name, { style: sNormal });
    members.set(`B${mRow}`, staff.cat, { style: sMuted });
    Object.keys(DEPT_FULL_NAME).forEach((code, i) => {
      let mark = '';
      if (staff.main.includes(`(${code})`)) mark = '◎';
      else if (staff.sub1.includes(`(${code})`) || staff.sub2.includes(`(${code})`)) mark = '○';
      members.set(`${colLetter(3 + i)}${mRow}`, mark, { style: sNormalCenter });
    });
    mRow++;
  });
  members.colWidth('A', 16); members.colWidth('B', 8);
  Object.keys(DEPT_FULL_NAME).forEach((_, i) => members.colWidth(colLetter(3 + i), 4));
  sheets.push(members);

  // ================================================================
  // Sheet: ⑤夜勤バランス
  // ================================================================
  const NB = new SheetBuilder('⑤夜勤バランス');
  NB.noGrid();
  NB.set('A1', '  夜勤バランスチェック（准夜・深夜の偏り検出）', { style: sTitle });
  NB.merge('A1:L1');
  NB.set('A2', '准夜=准 / 深夜=深 を対象。最大連続夜勤・最終夜勤からの間隔・平均との差で偏りを確認できます。', { style: sSubtitle });
  NB.merge('A2:L2');
  const nbHeaders = ['氏名', '区分', '准夜回数', '深夜回数', '夜勤合計', '最大連続夜勤(日)',
    '最終夜勤からの間隔(日)', '月平均との差', '最大連続出勤(日)', '夜勤明け勤務', '休み希望(月)', '判定'];
  nbHeaders.forEach((h, i) => NB.set(`${colLetter(i + 1)}4`, h, { style: reg.style({ bold: true, color: WHITE, fill: NAVY, halign: 'center', valign: 'center', wrap: true, size: 9 }) }));
  NB.rowHeight(4, 30);
  const nbWidths = { A: 12, B: 10, C: 9, D: 9, E: 9, F: 13, G: 16, H: 12, I: 13, J: 11, K: 11, L: 10 };
  Object.entries(nbWidths).forEach(([c, w]) => NB.colWidth(c, w));

  const SHIFT_REF = "'②シフト表(oplus風)'";
  const totals = [];
  STAFF.forEach((staff, i) => {
    const r = 5 + i;
    NB.set(`A${r}`, staff.name, { style: sNormal });
    NB.set(`B${r}`, staff.cat, { style: sMuted });

    let cCount = 0, dCount = 0, workFlags = [], nightFlags = [];
    let maxNightStreak = 0, curNightStreak = 0, lastNightDay = 0;
    let maxWorkStreak = 0, curWorkStreak = 0;
    let nightFollowedByWork = 0;
    for (let d = 1; d <= nDays; d++) {
      const val = effectiveShiftValue(shifts, staff.no, d);
      const isNight = val === '准' || val === '深';
      const isWork = val !== '' && val !== '公' && val !== '有';
      if (val === '准') cCount++;
      if (val === '深') dCount++;
      nightFlags.push(isNight ? 1 : 0);
      workFlags.push(isWork ? 1 : 0);
      curNightStreak = isNight ? curNightStreak + 1 : 0;
      maxNightStreak = Math.max(maxNightStreak, curNightStreak);
      curWorkStreak = isWork ? curWorkStreak + 1 : 0;
      maxWorkStreak = Math.max(maxWorkStreak, curWorkStreak);
      if (isNight) lastNightDay = d;
    }
    for (let d = 1; d < nDays; d++) {
      if (nightFlags[d - 1] === 1 && workFlags[d] === 1) nightFollowedByWork++;
    }
    const total = cCount + dCount;
    const gap = total === 0 ? '-' : (nDays - lastNightDay);
    const ptoCount = Object.values((shifts[staff.no] || {})).filter(() => false).length; // placeholder, replaced below
    totals.push(total);

    NB.set(`C${r}`, cCount, { style: sNormalCenter });
    NB.set(`D${r}`, dCount, { style: sNormalCenter });
    NB.set(`E${r}`, total, { style: sNormalCenter });
    NB.set(`F${r}`, maxNightStreak, { style: sNormalBoldCenter });
    NB.set(`G${r}`, gap, { style: sNormalCenter });
    NB.set(`I${r}`, maxWorkStreak, { style: sNormalBoldCenter });
    NB.set(`J${r}`, nightFollowedByWork, { style: sNormalBoldCenter });
  });

  const eligibleTotals = STAFF.map((s, i) => totals[i]).filter(t => t > 0);
  const avgTotal = eligibleTotals.length ? eligibleTotals.reduce((a, b) => a + b, 0) / eligibleTotals.length : 0;

  STAFF.forEach((staff, i) => {
    const r = 5 + i;
    const total = totals[i];
    const diff = total === 0 ? '-' : Math.round((total - avgTotal) * 10) / 10;
    NB.set(`H${r}`, diff, { style: reg.style({ size: 9, halign: 'center' }) });

    // PTO count from the dedicated PTO tracking (passed in via shifts metadata is not separate;
    // we approximate using the explicit pto set captured at fill-time, see below)
    const ptoDays = (shifts.__pto && shifts.__pto[staff.no]) ? Object.keys(shifts.__pto[staff.no]).length : 0;
    NB.set(`K${r}`, ptoDays, { style: sNormalCenter });

    const maxNightStreak = parseInt(NB.cells[`F${r}`].v, 10) || 0;
    const maxWorkStreak = parseInt(NB.cells[`I${r}`].v, 10) || 0;
    const nightFollowedByWork = parseInt(NB.cells[`J${r}`].v, 10) || 0;
    // 師長は原則、平日日勤・土日祝休みのため月〜金の連続5日が通常の形に
    // なる。連続出勤の警告は夜勤を回るスタッフ向けの基準なので対象外にする。
    const isDayShiftOnly = staff.cat === '師長';
    let verdict = 'OK', style = okStyle;
    if (maxNightStreak >= 3) { verdict = '⚠連続夜勤'; style = warnRedStyle; }
    else if (maxWorkStreak >= 5 && !isDayShiftOnly) { verdict = '⚠連続出勤過多'; style = warnRedStyle; }
    else if (nightFollowedByWork > 0) { verdict = '⚠夜勤明け勤務'; style = warnRedStyle; }
    else if (ptoDays > 5) { verdict = '⚠休み希望超過'; style = warnRedStyle; }
    else if (total > 0 && typeof diff === 'number' && Math.abs(diff) >= 3) { verdict = '⚠偏りあり'; style = warnYelStyle; }
    NB.set(`L${r}`, verdict, { style });
  });
  NB.freeze(4, 2);
  sheets.push(NB);

  // ================================================================
  // Sheet: ⑥休み希望
  // ================================================================
  const pto = new SheetBuilder('⑥休み希望');
  pto.noGrid();
  pto.set('A1', '  休み希望入力シート（月5回まで／希望日に「○」を入力）', { style: sTitle });
  pto.merge(`A1:${colLetter(2 + nDays + 1)}1`);
  pto.set('A2', '希望日に「○」を入力してください（最大5個）。入力した日は②シフト表の該当日が公休として反映されます。', { style: sSubtitle });
  pto.merge(`A2:${colLetter(2 + nDays + 1)}2`);
  pto.set('A3', '氏名', { style: sHeaderNavySm }); pto.merge('A3:A4');
  pto.set('B3', '区分', { style: sHeaderNavySm }); pto.merge('B3:B4');
  for (let d = 1; d <= nDays; d++) {
    const col = colLetter(2 + d);
    pto.set(`${col}3`, d, { style: sHeaderNavySm });
    pto.set(`${col}4`, weekdayLetterJP(year, month, d), { style: sHeaderNavySm });
  }
  const reqColLetter = colLetter(2 + nDays + 1);
  pto.set(`${reqColLetter}3`, '希望数', { style: sHeaderNavySm }); pto.merge(`${reqColLetter}3:${reqColLetter}4`);
  pto.colWidth('A', 12); pto.colWidth('B', 10);
  for (let d = 1; d <= nDays; d++) pto.colWidth(colLetter(2 + d), 3.4);
  pto.colWidth(reqColLetter, 8);

  STAFF.forEach((staff, i) => {
    const r = 5 + i;
    pto.set(`A${r}`, staff.name, { style: sNormal });
    pto.set(`B${r}`, staff.cat, { style: sMuted });
    const ptoSet = (shifts.__pto && shifts.__pto[staff.no]) || {};
    let count = 0;
    for (let d = 1; d <= nDays; d++) {
      const col = colLetter(2 + d);
      const marked = !!ptoSet[d];
      if (marked) count++;
      pto.set(`${col}${r}`, marked ? '○' : '', { style: reg.style({ size: 9, bold: true, color: '1F4E79', halign: 'center', border: true }) });
    }
    const style = count > 5 ? warnRedStyle : okStyle;
    pto.set(`${reqColLetter}${r}`, count, { style });
  });
  pto.freeze(4, 2);
  sheets.push(pto);

  // ================================================================
  // Sheet: ⑦時間帯別集計
  // ================================================================
  const tb = new SheetBuilder('⑦時間帯別集計');
  tb.noGrid();
  tb.set('A1', '  時間帯別集計（科ごとの退勤時刻パターン別の人数）', { style: sTitle });
  tb.merge(`A1:${lastDayColLetter}1`);
  tb.set('A2', '②シフト表の「科(時刻)」表記を時刻ごとに分けて集計します。常勤等の時刻なし入力は対象外です。', { style: sSubtitle });
  tb.merge(`A2:${lastDayColLetter}2`);
  tb.set('A3', '科', { style: sHeaderNavySm }); tb.merge('A3:A4');
  tb.set('B3', '時刻', { style: sHeaderNavySm }); tb.merge('B3:B4');
  for (let d = 1; d <= nDays; d++) {
    const col = dayColLetters[d - 1];
    tb.set(`${col}3`, d, { style: sHeaderNavySm });
    tb.set(`${col}4`, weekdayLetterJP(year, month, d), { style: sHeaderNavySm });
  }
  const tbTotalCol = colLetter(colNum(lastDayColLetter) + 1);
  tb.set(`${tbTotalCol}3`, '月合計', { style: sHeaderNavySm }); tb.merge(`${tbTotalCol}3:${tbTotalCol}4`);
  tb.colWidth('A', 11); tb.colWidth('B', 7);
  dayColLetters.forEach(c => tb.colWidth(c, 3.4));
  tb.colWidth(tbTotalCol, 9);

  let tRow = 5;
  Object.entries(DEPT_FULL_NAME).forEach(([code, name]) => {
    const startRow = tRow;
    [13, 14, 15, 16, 17].forEach(time => {
      tb.set(`A${tRow}`, name, { style: reg.style({ size: 9, color: '595959', valign: 'center' }) });
      tb.set(`B${tRow}`, `${time}時`, { style: sNormalBoldCenter });
      let monthTotal = 0;
      for (let d = 1; d <= nDays; d++) {
        const col = dayColLetters[d - 1];
        let count = 0;
        STAFF.forEach(staff => {
          const val = effectiveShiftValue(shifts, staff.no, d);
          if (val === `${code}(${time})`) count++;
        });
        monthTotal += count;
        tb.set(`${col}${tRow}`, count, { style: reg.style({ size: 8, halign: 'center' }) });
      }
      tb.set(`${tbTotalCol}${tRow}`, monthTotal, { style: sNormalBoldCenter });
      tRow++;
    });
    tb.merge(`A${startRow}:A${tRow - 1}`);
  });
  tb.freeze(4, 2);
  sheets.push(tb);

  // ================================================================
  // Sheet: ⑧委員会一覧
  // ================================================================
  const committeeSheet = new SheetBuilder('⑧委員会一覧');
  committeeSheet.set('A1', '  委員会一覧・所属メンバー', { style: sTitle });
  committeeSheet.merge('A1:C1');
  committeeSheet.colWidth('A', 24); committeeSheet.colWidth('B', 16); committeeSheet.colWidth('C', 12);
  let cmRow = 3;
  if (!COMMITTEES || !COMMITTEES.length) {
    committeeSheet.set(`A${cmRow}`, '委員会は登録されていません。', { style: sMuted });
  } else {
    COMMITTEES.forEach(committee => {
      const members = STAFF.filter(s => (s.committees || []).includes(committee.id));
      committeeSheet.set(`A${cmRow}`, `  ${committee.name}（${members.length}名）`, {
        style: reg.style({ bold: true, color: WHITE, fill: (committee.color || '607D8B').replace('#', ''), valign: 'center' }),
      });
      committeeSheet.merge(`A${cmRow}:C${cmRow}`);
      cmRow++;
      if (!members.length) {
        committeeSheet.set(`B${cmRow}`, '（所属者なし）', { style: sMuted });
        cmRow++;
      } else {
        members.forEach(m => {
          committeeSheet.set(`B${cmRow}`, m.name, { style: sNormal });
          committeeSheet.set(`C${cmRow}`, m.cat, { style: sMuted });
          cmRow++;
        });
      }
      cmRow++; // spacer row between committees
    });
  }
  sheets.push(committeeSheet);

  // ================================================================
  // Sheet: ⑨予定
  // ================================================================
  const eventSheet = new SheetBuilder('⑨予定');
  eventSheet.set('A1', `  ${year}年${month}月 の予定`, { style: sTitle });
  eventSheet.merge('A1:C1');
  const evHeaders = ['日付', '曜日', '内容'];
  evHeaders.forEach((h, i) => eventSheet.set(`${colLetter(i + 1)}3`, h, { style: sHeaderNavy }));
  eventSheet.colWidth('A', 10); eventSheet.colWidth('B', 8); eventSheet.colWidth('C', 32);
  eventSheet.freeze(3, 0);
  if (!EVENTS || !EVENTS.length) {
    eventSheet.set('A4', '登録されている予定はありません。', { style: sMuted });
  } else {
    const sortedEvents = [...EVENTS].sort((a, b) => a.day - b.day);
    sortedEvents.forEach((ev, i) => {
      const r = 4 + i;
      eventSheet.set(`A${r}`, `${month}/${ev.day}`, { style: sNormalCenter });
      eventSheet.set(`B${r}`, weekdayLetterJP(year, month, ev.day), { style: sNormalCenter });
      eventSheet.set(`C${r}`, ev.title, { style: fillStyle((ev.color || '607D8B').replace('#', ''), { halign: 'left' }) });
    });
  }
  sheets.push(eventSheet);

  return renderWorkbook(sheets, reg, dxfs);
}

/*
  Minimal, dependency-free XLSX reader.
  Reads a .xlsx File/ArrayBuffer and returns a map of
  sheetName -> { cells: {ref: value}, merges: [...] }

  Handles both the uncompressed ("STORE") ZIP entries our own writer
  produces AND the standard DEFLATE-compressed entries that real Excel
  / LibreOffice produce, using the browser's built-in
  DecompressionStream('deflate-raw') for inflate (widely supported in
  modern Chrome/Edge/Firefox/Safari -- no external library needed).

  Supports shared strings (sharedStrings.xml) and inline strings
  (t="inlineStr"), which covers files written by Excel, LibreOffice,
  and our own writer.
*/

// ---------- ZIP reading (handles both STORE and DEFLATE) ----------
async function readZipEntries(arrayBuffer) {
  const data = new Uint8Array(arrayBuffer);
  const view = new DataView(arrayBuffer);

  // find End Of Central Directory record by scanning from the end
  let eocdOffset = -1;
  for (let i = data.length - 22; i >= 0 && i >= data.length - 22 - 65536; i--) {
    if (view.getUint32(i, true) === 0x06054b50) { eocdOffset = i; break; }
  }
  if (eocdOffset === -1) throw new Error('ZIPの終端レコードが見つかりません（ファイルが壊れている可能性があります）');

  const entryCount = view.getUint16(eocdOffset + 10, true);
  const centralDirOffset = view.getUint32(eocdOffset + 16, true);

  const entries = {};
  let pos = centralDirOffset;
  for (let i = 0; i < entryCount; i++) {
    if (view.getUint32(pos, true) !== 0x02014b50) break;
    const compMethod = view.getUint16(pos + 10, true);
    const compSize = view.getUint32(pos + 20, true);
    const uncompSize = view.getUint32(pos + 24, true);
    const nameLen = view.getUint16(pos + 28, true);
    const extraLen = view.getUint16(pos + 30, true);
    const commentLen = view.getUint16(pos + 32, true);
    const localHeaderOffset = view.getUint32(pos + 42, true);
    const name = new TextDecoder().decode(data.slice(pos + 46, pos + 46 + nameLen));

    // local header: read actual compressed data location (name/extra length can differ from central dir, so re-read)
    const lhNameLen = view.getUint16(localHeaderOffset + 26, true);
    const lhExtraLen = view.getUint16(localHeaderOffset + 28, true);
    const dataStart = localHeaderOffset + 30 + lhNameLen + lhExtraLen;
    const compData = data.slice(dataStart, dataStart + compSize);

    entries[name] = { compMethod, compData, uncompSize };
    pos += 46 + nameLen + extraLen + commentLen;
  }

  // inflate any DEFLATE entries
  const result = {};
  for (const [name, entry] of Object.entries(entries)) {
    if (entry.compMethod === 0) {
      result[name] = entry.compData;
    } else if (entry.compMethod === 8) {
      result[name] = await inflateRaw(entry.compData);
    } else {
      throw new Error(`未対応の圧縮方式です (${name})`);
    }
  }
  return result;
}

async function inflateRaw(compressedBytes) {
  if (typeof DecompressionStream === 'undefined') {
    throw new Error('このブラウザはZIP解凍に対応していません。Chrome/Edge/Firefoxの最新版をお使いください。');
  }
  const ds = new DecompressionStream('deflate-raw');
  const stream = new Blob([compressedBytes]).stream().pipeThrough(ds);
  const buf = await new Response(stream).arrayBuffer();
  return new Uint8Array(buf);
}

function bytesToStr(bytes) { return new TextDecoder('utf-8').decode(bytes); }

// ---------- minimal XML helpers (regex-based, sufficient for OOXML's predictable structure) ----------
function extractAttr(tag, attr) {
  const m = tag.match(new RegExp(attr + '="([^"]*)"'));
  return m ? m[1] : null;
}

function decodeXmlEntities(s) {
  return s.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"')
    .replace(/&apos;/g, "'").replace(/&#(\d+);/g, (_, n) => String.fromCharCode(n))
    .replace(/&amp;/g, '&');
}

function parseSharedStrings(xml) {
  if (!xml) return [];
  const strings = [];
  const siBlocks = xml.match(/<si>[\s\S]*?<\/si>/g) || [];
  siBlocks.forEach(block => {
    const texts = (block.match(/<t[^>]*>([\s\S]*?)<\/t>/g) || [])
      .map(t => decodeXmlEntities(t.replace(/<t[^>]*>/, '').replace('</t>', '')));
    strings.push(texts.join(''));
  });
  return strings;
}

function parseSheetXml(xml, sharedStrings) {
  const cells = {};
  const rowBlocks = xml.match(/<row [^>]*>[\s\S]*?<\/row>|<row [^>]*\/>/g) || [];
  rowBlocks.forEach(rowBlock => {
    const cellTags = rowBlock.match(/<c [^>]*\/>|<c [^>]*>[\s\S]*?<\/c>/g) || [];
    cellTags.forEach(cTag => {
      const ref = extractAttr(cTag, 'r');
      if (!ref) return;
      const type = extractAttr(cTag, 't');
      let value = null;
      const vMatch = cTag.match(/<v>([\s\S]*?)<\/v>/);
      const isMatch = cTag.match(/<is>([\s\S]*?)<\/is>/);
      if (type === 's' && vMatch) {
        const idx = parseInt(vMatch[1], 10);
        value = sharedStrings[idx] !== undefined ? sharedStrings[idx] : '';
      } else if (type === 'inlineStr' && isMatch) {
        const tMatch = isMatch[1].match(/<t[^>]*>([\s\S]*?)<\/t>/);
        value = tMatch ? decodeXmlEntities(tMatch[1]) : '';
      } else if (vMatch) {
        const raw = vMatch[1];
        value = type === 'str' ? decodeXmlEntities(raw) : parseFloat(raw);
      }
      if (value !== null && value !== '') cells[ref] = value;
    });
  });
  return cells;
}

function parseWorkbookSheetNames(workbookXml, relsXml) {
  const sheetTags = workbookXml.match(/<sheet [^>]*\/>/g) || [];
  const relMap = {};
  (relsXml.match(/<Relationship [^>]*\/>/g) || []).forEach(r => {
    const id = extractAttr(r, 'Id');
    const target = extractAttr(r, 'Target');
    relMap[id] = target;
  });
  return sheetTags.map(tag => ({
    name: decodeXmlEntities(extractAttr(tag, 'name')),
    rId: extractAttr(tag, 'r:id'),
    target: relMap[extractAttr(tag, 'r:id')],
  }));
}

// ============================================================
// Public API
// ============================================================
async function readXlsxFile(arrayBuffer) {
  const files = await readZipEntries(arrayBuffer);
  const decoded = {};
  Object.entries(files).forEach(([name, bytes]) => { decoded[name] = bytesToStr(bytes); });

  const workbookXml = decoded['xl/workbook.xml'];
  const relsXml = decoded['xl/_rels/workbook.xml.rels'];
  if (!workbookXml || !relsXml) throw new Error('xlsxの構造を認識できませんでした（workbook.xmlが見つかりません）');

  const sheetMeta = parseWorkbookSheetNames(workbookXml, relsXml);
  const sharedStrings = parseSharedStrings(decoded['xl/sharedStrings.xml']);

  const sheets = {};
  sheetMeta.forEach(meta => {
    const path = 'xl/' + meta.target.replace(/^\/?xl\//, '').replace(/^\.?\//, '');
    const xml = decoded[path] || decoded[meta.target] || decoded['xl/' + meta.target];
    if (!xml) return;
    sheets[meta.name] = parseSheetXml(xml, sharedStrings);
  });
  return sheets;
}

function colNumFromRef(ref) {
  const m = ref.match(/^([A-Z]+)(\d+)$/);
  let n = 0;
  for (let i = 0; i < m[1].length; i++) n = n * 26 + (m[1].charCodeAt(i) - 64);
  return { col: n, row: parseInt(m[2], 10) };
}

STAFF.forEach(s => shifts.__locked[s.no] = {});

function isLocked(staffNo, day) {
  return !!(shifts.__locked && shifts.__locked[staffNo] && shifts.__locked[staffNo][day]);
}

// ============================================================
// 自動保存: このツールはサーバーを持たないため、入力内容はブラウザの
// localStorageに保存する。タブを閉じたりリロードしても、次に開いた
// ときに続きから再開できる（他社の看護師シフトアプリでも「バックアップ」
// 「自動保存」は評価の高い機能のため導入）。
// ============================================================
const AUTOSAVE_KEY = 'shiftTool_autosave_v1';
let autosaveTimer = null;

function saveState() {
  try {
    const [year, month] = getYearMonth();
    const payload = {
      STAFF, DEPARTMENTS, COMMITTEES, EVENTS, NIGHT_REQUIREMENTS, PTO_DEADLINE,
      shifts, nextEventId, nextCommitteeId, year, month,
      savedAt: new Date().toISOString(),
    };
    localStorage.setItem(AUTOSAVE_KEY, JSON.stringify(payload));
    showAutosaveIndicator(payload.savedAt);
  } catch (e) {
    console.error('autosave failed', e);
  }
}

// Debounced save so a burst of edits (autofill writes ~1500 cells) results
// in one localStorage write rather than one per cell.
function scheduleSave() {
  if (autosaveTimer) clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(() => { autosaveTimer = null; saveState(); }, 400);
}

function showAutosaveIndicator(isoTime) {
  const el = document.getElementById('autosaveIndicator');
  if (!el) return;
  const t = new Date(isoTime);
  const hh = String(t.getHours()).padStart(2, '0');
  const mm = String(t.getMinutes()).padStart(2, '0');
  el.textContent = `✓ 自動保存 ${hh}:${mm}`;
}

function loadState() {
  let raw;
  try {
    raw = localStorage.getItem(AUTOSAVE_KEY);
  } catch (e) {
    return false;
  }
  if (!raw) return false;
  try {
    const saved = JSON.parse(raw);
    if (saved.STAFF) STAFF = saved.STAFF;
    if (saved.DEPARTMENTS) DEPARTMENTS = saved.DEPARTMENTS;
    if (saved.COMMITTEES) COMMITTEES = saved.COMMITTEES;
    if (saved.EVENTS) EVENTS = saved.EVENTS;
    if (saved.NIGHT_REQUIREMENTS) Object.assign(NIGHT_REQUIREMENTS, saved.NIGHT_REQUIREMENTS);
    if (saved.PTO_DEADLINE !== undefined) PTO_DEADLINE = saved.PTO_DEADLINE;
    if (typeof saved.nextEventId === 'number') nextEventId = saved.nextEventId;
    if (typeof saved.nextCommitteeId === 'number') nextCommitteeId = saved.nextCommitteeId;
    if (saved.shifts) {
      Object.keys(shifts).forEach(k => delete shifts[k]);
      Object.assign(shifts, saved.shifts);
      if (!shifts.__pto) shifts.__pto = {};
      if (!shifts.__locked) shifts.__locked = {};
      STAFF.forEach(s => {
        if (!shifts[s.no]) shifts[s.no] = {};
        if (!shifts.__pto[s.no]) shifts.__pto[s.no] = {};
        if (!shifts.__locked[s.no]) shifts.__locked[s.no] = {};
      });
    }
    if (saved.year) document.getElementById('yearInput').value = saved.year;
    if (saved.month) document.getElementById('monthInput').value = saved.month;
    if (saved.savedAt) {
      // deferred until the header DOM (autosaveIndicator) exists
      setTimeout(() => showAutosaveIndicator(saved.savedAt), 0);
    }
    return true;
  } catch (e) {
    console.error('failed to restore autosave', e);
    return false;
  }
}

function resetAllData() {
  if (!confirm('保存されている入力内容（シフト・スタッフ・科・委員会・予定など）をすべて削除し、ページを再読み込みします。よろしいですか？')) return;
  try { localStorage.removeItem(AUTOSAVE_KEY); } catch (e) {}
  location.reload();
}

function capableCodes(staff) {

  return codes;
}
