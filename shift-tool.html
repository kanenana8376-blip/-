// ============================================================
// 日本の祝日（固定祝日＋春分・秋分の日＋振替休日）を自動計算する。
// ハッピーマンデー制度（成人の日・海の日・敬老の日・スポーツの日が
// 第2月曜/第3月曜になる）にも対応。2000年以降の運用を前提とする。
// ============================================================
function nthMonday(year, month, n) {
  const first = new Date(year, month - 1, 1);
  const firstMonday = 1 + ((8 - first.getDay()) % 7);
  return firstMonday + (n - 1) * 7;
}
function vernalEquinoxDay(year) {
  // 近似式（国立天文台の式に基づく、2000-2099年で有効）
  return Math.floor(20.8431 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4));
}
function autumnalEquinoxDay(year) {
  return Math.floor(23.2488 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4));
}
function japaneseHolidaysForYear(year) {
  // returns a Set of 'YYYY-MM-DD' strings for all holidays (including 振替休日)
  const holidays = new Map(); // 'YYYY-MM-DD' -> name

  function add(month, day, name) {
    const key = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    holidays.set(key, name);
  }

  add(1, 1, '元日');
  add(1, nthMonday(year, 1, 2), '成人の日');
  add(2, 11, '建国記念の日');
  if (year >= 2020) add(2, 23, '天皇誕生日');
  add(3, vernalEquinoxDay(year), '春分の日');
  add(4, 29, '昭和の日');
  add(5, 3, '憲法記念日');
  add(5, 4, 'みどりの日');
  add(5, 5, 'こどもの日');
  add(7, nthMonday(year, 7, 3), '海の日');
  if (year >= 2016) add(8, 11, '山の日');
  add(9, nthMonday(year, 9, 3), '敬老の日');
  add(9, autumnalEquinoxDay(year), '秋分の日');
  add(10, nthMonday(year, 10, 2), 'スポーツの日');
  add(11, 3, '文化の日');
  add(11, 23, '勤労感謝の日');

  // 振替休日: 祝日が日曜なら、その後の最初の平日（祝日でない日）を休日にする
  const sorted = [...holidays.keys()].sort();
  sorted.forEach(key => {
    const [y, m, d] = key.split('-').map(Number);
    const date = new Date(y, m - 1, d);
    if (date.getDay() === 0) {
      let next = new Date(y, m - 1, d + 1);
      let nextKey = `${next.getFullYear()}-${String(next.getMonth() + 1).padStart(2, '0')}-${String(next.getDate()).padStart(2, '0')}`;
      while (holidays.has(nextKey)) {
        next = new Date(next.getFullYear(), next.getMonth(), next.getDate() + 1);
        nextKey = `${next.getFullYear()}-${String(next.getMonth() + 1).padStart(2, '0')}-${String(next.getDate()).padStart(2, '0')}`;
      }
      holidays.set(nextKey, '振替休日');
    }
  });

  // 国民の休日: 祝日と祝日に挟まれた平日（祝日でなく、日曜でもない日）も休日とする
  const afterSubstitutes = [...holidays.keys()];
  afterSubstitutes.forEach(key => {
    const [y, m, d] = key.split('-').map(Number);
    const middle = new Date(y, m - 1, d + 1);
    const middleKey = `${middle.getFullYear()}-${String(middle.getMonth() + 1).padStart(2, '0')}-${String(middle.getDate()).padStart(2, '0')}`;
    if (holidays.has(middleKey) || middle.getDay() === 0 || middle.getDay() === 6) return;
    const after = new Date(y, m - 1, d + 2);
    const afterKey = `${after.getFullYear()}-${String(after.getMonth() + 1).padStart(2, '0')}-${String(after.getDate()).padStart(2, '0')}`;
    if (holidays.has(afterKey)) holidays.set(middleKey, '国民の休日');
  });

  return holidays;
}
const _holidayCache = {};
function isJapaneseHoliday(year, month, day) {
  if (!_holidayCache[year]) _holidayCache[year] = japaneseHolidaysForYear(year);
  const key = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
  return _holidayCache[year].has(key);
}
function holidayName(year, month, day) {
  if (!_holidayCache[year]) _holidayCache[year] = japaneseHolidaysForYear(year);
  const key = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
  return _holidayCache[year].get(key) || '';
}

function daysInMonth(year, month) {
  return new Date(year, month, 0).getDate();
}

let staffFilter = 'all'; // 'all' | 'zero' | 'incomplete'

    <div class="sidebar-actions">
      <button class="mgmt-add-btn" id="autoGenerateBtn" style="margin-bottom:0;">⚙ 残りの日を自動で埋める</button>

function renderStaffList() {
  const q = document.getElementById('searchBox').value.trim();
  const list = document.getElementById('staffList');
  const [year, month] = getYearMonth();
  const nDays = daysInMonth(year, month);
  document.querySelectorAll('#staffFilterTabs button').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.filter === staffFilter);
  });
  list.innerHTML = '';
  STAFF.filter(s => !q || s.name.includes(q)).filter(s => {
    const filledCount = Object.values(shifts[s.no]).filter(v => v).length;
    if (staffFilter === 'zero') return filledCount === 0;
    if (staffFilter === 'incomplete') return filledCount > 0 && filledCount < nDays;
    return true;
  }).forEach(s => {
    const div = document.createElement('div');
    const filledCount = Object.values(shifts[s.no]).filter(v => v).length;
    div.className = 'staff-item' + (currentStaffIdx === s.no ? ' active' : '') + (filledCount === 0 ? ' zero-filled' : '');
    const ptoCount = Object.keys(shifts.__pto[s.no] || {}).length;
    const badgeClass = filledCount === 0 ? 'filled-badge badge-zero' : filledCount >= nDays ? 'filled-badge badge-full' : 'filled-badge';
    let badge = `<span class="${badgeClass}">${filledCount}/${nDays}日</span>`;
    div.innerHTML = `<span>${s.name}<div class="cat">${s.cat}${s.depTime ? ' ・'+s.depTime+'時まで' : ''}${ptoCount ? ' ・希望'+ptoCount+'件' : ''}</div></span>` + badge;
    div.onclick = () => { currentStaffIdx = s.no; renderStaffList(); renderMain(); };
    list.appendChild(div);
  });
  if (!list.children.length) {
    list.innerHTML = '<div class="dashboard-empty" style="padding:20px 4px;">該当するスタッフがいません。</div>';
  }
}

function renderDashboard() {
  const main = document.getElementById('mainArea');
  const [year, month] = getYearMonth();
  const nDays = daysInMonth(year, month);

  const zeroStaff = [];
  const incompleteStaff = [];
  let fullCount = 0;
  const ptoOverStaff = [];
  STAFF.forEach(s => {
    const filledCount = Object.values(shifts[s.no]).filter(v => v).length;
    const ptoCount = Object.keys(shifts.__pto[s.no] || {}).length;
    if (filledCount === 0) zeroStaff.push(s);
    else if (filledCount < nDays) incompleteStaff.push(s);
    else fullCount++;
    if (ptoCount > 5) ptoOverStaff.push(s);
  });

  const chipList = (staffArr) => staffArr.length
    ? `<div class="dashboard-chip-list">${staffArr.map(s => `<button class="dashboard-chip chip-warn" data-jump="${s.no}">${s.name}</button>`).join('')}</div>`
    : '<div class="dashboard-empty">該当するスタッフはいません。</div>';

  let deadlineCard = '';
  if (PTO_DEADLINE) {
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const due = new Date(PTO_DEADLINE + 'T00:00:00');
    const daysLeft = Math.round((due - today) / 86400000);
    const label = daysLeft > 0 ? `あと${daysLeft}日` : daysLeft === 0 ? '本日締切' : `${-daysLeft}日超過`;
    deadlineCard = `<div class="dashboard-card${daysLeft <= 3 ? ' deadline-warn' : ''}">
      <div class="num" style="font-size:17px;">${label}</div>
      <div class="lbl">休み希望の締切<br>(${PTO_DEADLINE})</div>
    </div>`;
  }

  main.innerHTML = `
    ${viewToggleHtml()}
    <div class="person-header"><h2>${year}年${month}月 の入力状況</h2></div>
    <div class="person-meta">左の一覧からスタッフを選ぶと、日ごとのシフトを入力できます。</div>
    <div class="dashboard-cards">
      <div class="dashboard-card"><div class="num">${STAFF.length}</div><div class="lbl">スタッフ数</div></div>
      <div class="dashboard-card${zeroStaff.length ? ' warn' : ''}"><div class="num">${zeroStaff.length}</div><div class="lbl">未入力</div></div>
      <div class="dashboard-card"><div class="num">${incompleteStaff.length}</div><div class="lbl">入力途中</div></div>
      <div class="dashboard-card"><div class="num">${fullCount}</div><div class="lbl">全日入力済み</div></div>
      ${deadlineCard}
    </div>
    <div class="dashboard-section">
      <h3>まだ入力がないスタッフ</h3>
      <div class="hint">クリックするとそのスタッフのシフト入力画面に移動します。</div>
      ${chipList(zeroStaff)}
    </div>
    <div class="dashboard-section">
      <h3>⚠ 休み希望が月6回以上のスタッフ</h3>
      <div class="hint">エクセル出力の⑤夜勤バランスシートで「休み希望超過」として警告される対象です。</div>
      ${chipList(ptoOverStaff)}
    </div>
  `;
  main.querySelectorAll('[data-jump]').forEach(btn => {
    btn.onclick = () => jumpToStaff(parseInt(btn.dataset.jump, 10));
  });
  wireViewToggle();
}

// ================================================================
// 全員一覧グリッド表示: 全スタッフ×全日を1画面で見られる表。
// セルをクリックすると既存のopenPicker()がそのまま使え、各科・准夜・
// 深夜の必要人数に対する過不足を表の下に色分けして表示する
// （不足=赤／過剰=黄、Excelの【不足チェック】と同じ考え方）。
// ================================================================
function renderGridView() {
  const main = document.getElementById('mainArea');
  const [year, month] = getYearMonth();
  const nDays = daysInMonth(year, month);
  const colors = codeColors();
  const depts = deptCodes();

  function isOffDay(d) {
    const wd = new Date(year, month - 1, d).getDay();
    return wd === 0 || wd === 6 || isJapaneseHoliday(year, month, d);
  }

  let theadDays = '';
  for (let d = 1; d <= nDays; d++) {
    const wd = new Date(year, month - 1, d).getDay();
    theadDays += `<th class="${isOffDay(d) ? 'weekend-col' : ''}">${d}<br>${WEEKDAYS_JP[wd]}</th>`;
  }

  let eventRow = '';
  for (let d = 1; d <= nDays; d++) {
    const dayEvents = eventsForDay(d);
    const title = dayEvents.map(e => e.title).join('・');
    const style = dayEvents.length ? `border-left: 3px solid ${dayEvents[0].color};` : '';
    eventRow += `<td class="event-cell${isOffDay(d) ? ' weekend-col' : ''}" style="${style}"${title ? ` title="${esc(title)}"` : ''}>${esc(title)}</td>`;
  }
  eventRow = `<tr class="grid-event-row"><td class="name-col">📌 予定</td><td class="cat-col"></td>${eventRow}</tr>`;

  let bodyRows = '';
  STAFF.forEach(staff => {
    const capable = capableCodes(staff);
    let cells = '';
    for (let d = 1; d <= nDays; d++) {
      const val = effectiveShiftValue(shifts, staff.no, d);
      const base = val ? val[0] : '';
      const isOutOfScope = base && depts.includes(base) && !capable.includes(base);
      const bg = val ? (colors[base] || '#fff') : '#fff';
      const isSelected = swapMode && swapSelection && swapSelection.staffNo === staff.no && swapSelection.day === d;
      const lockedCell = isLocked(staff.no, d);
      cells += `<td class="shift-cell${isOffDay(d) ? ' weekend-col' : ''}${isOutOfScope ? ' warn-cell' : ''}${isSelected ? ' swap-selected' : ''}${lockedCell ? ' locked-cell' : ''}" data-staff="${staff.no}" data-day="${d}"${lockedCell ? ' title="固定（一括操作で上書きされません）"' : ''} style="${val ? `background:${bg}55;` : ''}">${esc(val)}${isOutOfScope ? '△' : ''}</td>`;
    }
    bodyRows += `<tr><td class="name-col">${esc(staff.name)}</td><td class="cat-col">${esc(staff.cat)}</td>${cells}</tr>`;
  });

  function shortageCell(actual, need, offDay) {
    if (offDay) return '<td class="weekend-col"></td>';
    const diff = actual - need;
    const cls = diff < 0 ? 'shortage-neg' : diff > 0 ? 'shortage-pos' : 'shortage-ok';
    return `<td class="${cls}">${diff > 0 ? '+' + diff : diff}</td>`;
  }

  let summaryRows = '';
  DEPARTMENTS.forEach(dept => {
    let cells = '';
    for (let d = 1; d <= nDays; d++) {
      const offDay = isOffDay(d);
      const actual = offDay ? 0 : STAFF.filter(s => (effectiveShiftValue(shifts, s.no, d)[0] || '') === dept.code).length;
      cells += shortageCell(actual, dept.required, offDay);
    }
    summaryRows += `<tr class="grid-summary-row"><td class="name-col">${esc(dept.name)}(${esc(dept.code)})</td><td class="cat-col" title="必要人数(平日)">必要${dept.required}名</td>${cells}</tr>`;
  });
  const wReq = weekendReq();
  [['救', '日勤(救急)', 0], ['准', '准夜', NIGHT_REQUIREMENTS.weekdayEvening], ['深', '深夜', NIGHT_REQUIREMENTS.weekdayLate]].forEach(([code, label, weekdayReq]) => {
    let cells = '';
    for (let d = 1; d <= nDays; d++) {
      const offDay = isOffDay(d);
      const need = offDay ? wReq[code] : weekdayReq;
      const actual = STAFF.filter(s => effectiveShiftValue(shifts, s.no, d) === code).length;
      cells += shortageCell(actual, need, false);
    }
    summaryRows += `<tr class="grid-summary-row"><td class="name-col">${label}</td><td class="cat-col" title="必要人数(平日/土日祝)">${weekdayReq}/${wReq[code]}名</td>${cells}</tr>`;
  });

  main.innerHTML = `
    ${viewToggleHtml()}
    <div class="print-only-title">${year}年${month}月 外来シフト表</div>
    <div class="person-meta">
      セルをクリックすると記号を編集できます。表の下の行は各科・准夜・深夜の必要人数に対する過不足です（マイナス=不足・赤／プラス=過剰・黄）。📌予定の行は、その日に登録されている院内研修・会議などの予定です。
    </div>
    ${swapMode ? `<div class="swap-hint">🔄 交換モード: 入れ替えたいセルを2つクリックしてください${swapSelection ? '（1つ目を選択済み。2つ目をクリックすると入れ替わります）' : ''}</div>` : ''}
    <div class="toolbar" style="margin-top:0; margin-bottom:14px;">
      <button class="btn primary" id="gridDownloadBtn">勤務表をExcelでダウンロード（全員・全シート）</button>
      <button class="btn" id="gridPrintBtn">🖨 この一覧表を印刷する</button>
      <button class="swap-toggle-btn${swapMode ? ' active' : ''}" id="swapToggleBtn">🔄 シフト交換モード${swapMode ? '：オン' : ''}</button>
    </div>
    <div class="grid-view-wrap">
      <table class="grid-table">
        <thead><tr><th class="name-col">氏名</th><th class="cat-col">区分</th>${theadDays}</tr></thead>
        <tbody>${eventRow}${bodyRows}${summaryRows}</tbody>
      </table>
    </div>
  `;
  wireViewToggle();
  main.querySelectorAll('td.shift-cell').forEach(td => {
    td.onclick = () => {
      const staffNo = parseInt(td.dataset.staff, 10);
      const day = parseInt(td.dataset.day, 10);
      if (swapMode) {
        handleSwapClick(staffNo, day);
        return;
      }
      const staff = STAFF.find(s => s.no === staffNo);
      openPicker(staff, day);
    };
  });
  document.getElementById('gridDownloadBtn').onclick = () => exportToExcel();
  document.getElementById('gridPrintBtn').onclick = () => window.print();
  document.getElementById('swapToggleBtn').onclick = () => {
    swapMode = !swapMode;
    swapSelection = null;
    renderMain();
  };
}

function handleSwapClick(staffNo, day) {
  if (isLocked(staffNo, day)) {
    showToast('このセルは🔒固定されているため交換できません（固定を解除してください）', 'error');
    return;
  }
  if (!swapSelection) {
    swapSelection = { staffNo, day };
    renderMain();
    return;
  }
  if (swapSelection.staffNo === staffNo && swapSelection.day === day) {
    swapSelection = null; // clicking the same cell again cancels the selection
    renderMain();
    return;
  }
  const a = swapSelection;
  const b = { staffNo, day };
  const staffA = STAFF.find(s => s.no === a.staffNo);
  const staffB = STAFF.find(s => s.no === b.staffNo);

  const valA = shifts[a.staffNo][a.day];
  const valB = shifts[b.staffNo][b.day];
  const ptoA = shifts.__pto[a.staffNo][a.day];
  const ptoB = shifts.__pto[b.staffNo][b.day];

  if (valB === undefined) delete shifts[a.staffNo][a.day]; else shifts[a.staffNo][a.day] = valB;
  if (valA === undefined) delete shifts[b.staffNo][b.day]; else shifts[b.staffNo][b.day] = valA;
  if (ptoB) shifts.__pto[a.staffNo][a.day] = true; else delete shifts.__pto[a.staffNo][a.day];
  if (ptoA) shifts.__pto[b.staffNo][b.day] = true; else delete shifts.__pto[b.staffNo][b.day];

  swapSelection = null;
  renderStaffList();
  renderMain();
  showToast(`${staffA.name}さんの${a.day}日と${staffB.name}さんの${b.day}日のシフトを交換しました`);
}

// ============================================================
// ZEST風「スマートシフト作成」: スタッフごとに「月は内視鏡、火は化学
// 療法室…」という週単位の基本パターンを登録しておき、それを対象月の
// 全日に一括展開する。月ごとに始まる曜日や日数が変わっても曜日基準で
// 割り当てるため自動的にズレが補正される。
// 展開時に守るもの（＝上書きしないもの）:
//   ・休み希望の日   ・固定（ロック）した日
// 「未入力の日だけ埋める」を選べば、既存の入力も一切壊さない。
// ============================================================
// 記号選択の候補を作る。パートは科の記号に退勤時刻が付く。土日祝は原則
// 休みだが、イレギュラーで出勤する人もいるため「日」「救」も手入力で
// 選べるようにしてある（自動生成では割り当てない）。
function partTimerCodes(staff) {
  if (staff.depTime) {
    return deptCodes().map(c => `${c}(${staff.depTime})`).concat(['日', '救', '公', '有']);
  }
  let codes = deptCodes().concat(NON_DEPT_CODES);
  if (MANAGER_CODES[staff.cat]) codes = codes.concat(MANAGER_CODES[staff.cat]);
  return codes;
}

function weekPatternOptions(staff, selected) {
  const codes = partTimerCodes(staff);
  const none = `<option value=""${!selected ? ' selected' : ''}>―</option>`;
  return none + codes.map(c => `<option value="${c}"${c === selected ? ' selected' : ''}>${c}</option>`).join('');
}

function weekPatternHtml(staff) {
  const pattern = staff.weekPattern || {};
  return `
    <div class="week-pattern-box">
      <h3>🗓 曜日パターン（スマートシフト作成）</h3>
      <div class="wp-hint">
        「毎週この曜日はこの科」という基本の勤務をここに登録し、下のボタンで対象月にまとめて反映できます。
        休み希望の日と🔒固定した日は上書きされません。
      </div>
      <div class="week-pattern-grid">
        ${WEEKDAYS_JP.map((w, i) => `
          <div>
            <label class="${i === 0 ? 'sun' : i === 6 ? 'sat' : ''}">${w}</label>
            <select data-wp="${i}">${weekPatternOptions(staff, pattern[i] || '')}</select>
          </div>
        `).join('')}
      </div>
      <div class="toolbar" style="margin-top:0;">
        <button class="btn" id="wpApplyEmptyBtn">未入力の日だけ反映</button>
        <button class="btn primary" id="wpApplyAllBtn">この月にまとめて反映</button>
        <button class="btn" id="wpClearBtn">パターンを消す</button>
      </div>
    </div>
  `;
}

function wireWeekPattern(staff) {
  const box = document.querySelector('.week-pattern-box');
  if (!box) return;

  function readPattern() {
    const pattern = {};
    box.querySelectorAll('select[data-wp]').forEach(sel => {
      if (sel.value) pattern[parseInt(sel.dataset.wp, 10)] = sel.value;
    });
    return pattern;
  }

  box.querySelectorAll('select[data-wp]').forEach(sel => {
    sel.onchange = () => { staff.weekPattern = readPattern(); scheduleSave(); };
  });

  function apply(onlyEmpty) {
    const pattern = readPattern();
    staff.weekPattern = pattern;
    if (!Object.keys(pattern).length) { showToast('曜日パターンが設定されていません', 'error'); return; }
    const [year, month] = getYearMonth();
    const nDays = daysInMonth(year, month);
    let applied = 0, skipped = 0;
    for (let d = 1; d <= nDays; d++) {
      const code = pattern[new Date(year, month - 1, d).getDay()];
      if (!code) continue;
      if (isLocked(staff.no, d) || (shifts.__pto[staff.no] && shifts.__pto[staff.no][d])) { skipped++; continue; }
      if (onlyEmpty && shifts[staff.no][d]) continue;
      shifts[staff.no][d] = code;
      applied++;
    }
    renderStaffList();
    renderMain();
    showToast(`${staff.name}さんに曜日パターンを${applied}日分反映しました${skipped ? `（休み希望・固定の${skipped}日は変更なし）` : ''}`);
  }

  document.getElementById('wpApplyAllBtn').onclick = () => apply(false);
  document.getElementById('wpApplyEmptyBtn').onclick = () => apply(true);
  document.getElementById('wpClearBtn').onclick = () => {
    staff.weekPattern = {};
    renderMain();
    showToast('曜日パターンを消しました（入力済みのシフトはそのままです）');
  };
}

function renderMain() {
  scheduleSave();
  const main = document.getElementById('mainArea');
  if (mainView === 'grid') {
    renderGridView();
    return;
  }
  if (currentStaffIdx === null) {
    renderDashboard();
    return;
  }
  const staff = STAFF.find(s => s.no === currentStaffIdx);
  const [year, month] = getYearMonth();
  const nDays = daysInMonth(year, month);
  const capable = capableCodes(staff);
  const dayShifts = shifts[staff.no];
  const dayPto = shifts.__pto[staff.no] || {};

  let counts = { 出勤: 0, 夜勤: 0, 公休: 0, 有給: 0 };
  for (let d = 1; d <= nDays; d++) {
    const v = dayShifts[d];
    if (!v) continue;
    if (v === '公') counts.公休++;
    else if (v === '有') counts.有給++;
    else if (v === '准' || v === '深') { counts.夜勤++; counts.出勤++; }
    else counts.出勤++;
  }
  const ptoCount = Object.keys(dayPto).length;

  let html = `
    ${viewToggleHtml()}
    <div class="person-header">
      <h2>${staff.name}</h2>
      <span class="tag">${staff.cat}</span>
      ${staff.depTime ? `<span class="tag">${staff.depTime}時まで</span>` : ''}
      ${committeesOf(staff).map(c => `<span class="committee-tag" style="background:${c.color}">${esc(c.name)}</span>`).join('')}
    </div>
    <div class="person-meta">
      ${(staff.main || staff.sub1 || staff.sub2)
        ? `主担当: <b>${staff.main || 'なし'}</b> ／ サブ担当: <b>${staff.sub1 || 'なし'}</b>・<b>${staff.sub2 || 'なし'}</b>`
        : '担当科: <b>なし</b>（師長・師長代行など）'}
    </div>
    <div class="summary-row">
      <div class="summary-card"><div class="num">${counts.出勤}</div><div class="lbl">出勤</div></div>
      <div class="summary-card"><div class="num">${counts.夜勤}</div><div class="lbl">夜勤(准/深)</div></div>
      <div class="summary-card"><div class="num">${counts.公休}</div><div class="lbl">公休</div></div>
      <div class="summary-card"><div class="num">${counts.有給}</div><div class="lbl">有給</div></div>
      <div class="summary-card" style="${ptoCount > 5 ? 'background:#FFC7CE;' : ''}"><div class="num">${ptoCount}</div><div class="lbl">休み希望(月5まで)</div></div>
    </div>
    ${weekPatternHtml(staff)}
    <div class="weekday-header">
      ${WEEKDAYS_JP.map((w, i) => `<div class="${i === 0 ? 'sun' : i === 6 ? 'sat' : ''}">${w}</div>`).join('')}
    </div>
    <div class="day-grid">
  `;

  // Sunday-first calendar: insert leading blank cells so day 1 lands in
  // the correct weekday column, then continue normally through the month.
  const firstWeekday = new Date(year, month - 1, 1).getDay(); // 0=Sun
  for (let i = 0; i < firstWeekday; i++) {
    html += `<div class="day-cell empty"></div>`;
  }

  for (let d = 1; d <= nDays; d++) {
    const dateObj = new Date(year, month - 1, d);
    const wd = dateObj.getDay();
    const isWeekend = wd === 0 || wd === 6;
    const hName = holidayName(year, month, d);
    const isHoliday = !!hName;
    const isWeekendOrHoliday = isWeekend || isHoliday;
    const val = dayShifts[d] || '';
    const baseCode = val ? val[0] : '';
    const isOutOfScope = baseCode && deptCodes().includes(baseCode) && !capable.includes(baseCode);
    const bg = val ? (codeColors()[baseCode] || '#fff') : '#fff';
    const isPto = !!(dayPto[d]);
    const dayEvents = eventsForDay(d);
    const eventStyle = dayEvents.length ? `border-top: 3px solid ${dayEvents[0].color};` : '';
    const eventTitleAttr = dayEvents.length ? ` title="${esc(dayEvents.map(e => e.title).join('・'))}"` : '';
    html += `
      <div class="day-cell${isWeekendOrHoliday ? ' weekend' : ''}${isOutOfScope ? ' has-warn' : ''}${isLocked(staff.no, d) ? ' locked' : ''}" data-day="${d}" style="${val ? `background:${bg}33;` : ''}${eventStyle}" ${isHoliday ? `title="${esc(hName)}"` : ''}>
        ${isOutOfScope ? '<span class="warn-icon">△</span>' : ''}
        ${isPto ? '<span class="pto-badge">希望休</span>' : ''}
        <span class="d-num">${d}</span>${isHoliday ? `<span class="holiday-dot" title="${esc(hName)}"></span>` : ''}
        <div class="d-val">${val}</div>
        ${isLocked(staff.no, d) ? '<span class="lock-badge" title="固定（一括操作で上書きされません）">🔒</span>' : ''}
        ${dayEvents.length ? `<div class="d-event"${eventTitleAttr}>📌 ${esc(dayEvents.map(e => e.title).join('・'))}</div>` : ''}
      </div>
    `;
  }
  html += `</div>
    <div class="toolbar">
      <button class="btn primary" id="downloadBtn"><i></i>勤務表をExcelでダウンロード（全員・全シート）</button>
      <button class="btn" id="clearPersonBtn">この人の入力をすべて消す</button>
    </div>
    <div class="legend">
      △ = 主担当・サブ担当に入っていない科（救急・准夜・深夜・公休・有給は対象外）<br>
      希望休バッジ = 休み希望（②シフト表では自動的に「公」として出力されます）<br>
      <b>使い方:</b> 日付のセルをクリックして記号を選びます。${staff.depTime ? `このスタッフは${staff.depTime}時までの勤務のため、科を選ぶと自動的に「科(${staff.depTime})」になります。` : ''}
    </div>
  `;
  main.innerHTML = html;
  wireViewToggle();
  wireWeekPattern(staff);

  main.querySelectorAll('.day-cell[data-day]').forEach(cell => {
    cell.onclick = () => openPicker(staff, parseInt(cell.dataset.day));
  });
  document.getElementById('downloadBtn').onclick = () => exportToExcel();
  document.getElementById('clearPersonBtn').onclick = () => {
    if (confirm(`${staff.name}さんの入力内容（シフトと休み希望）をすべて削除します。よろしいですか？`)) {
      shifts[staff.no] = {};
      shifts.__pto[staff.no] = {};
      shifts.__locked[staff.no] = {};
      renderStaffList();
      renderMain();
    }
  };
}

// 管理当直(当)を入れたら翌日は必ず当直明け(明)になる。逆に当直を取り
// 消したら、その当直のために置かれた翌日の「明」も一緒に片づける。
// 月末に当直を入れた場合、翌日は翌月なのでこのツールでは扱えない
// （その旨をトーストで知らせる）。
function applyOnCallPairing(staff, day, previous, next) {
  if (previous === next) return;
  const [year, month] = getYearMonth();
  const nDays = daysInMonth(year, month);
  const tomorrow = day + 1;

  if (previous === '当' && shifts[staff.no][tomorrow] === '明' && !isLocked(staff.no, tomorrow)) {
    delete shifts[staff.no][tomorrow];
  }
  if (next === '当') {
    if (tomorrow > nDays) {
      showToast(`${day}日は月末のため、翌日の「明」は翌月のシフトで入力してください`, 'error');
      return;
    }
    if (isLocked(staff.no, tomorrow)) {
      showToast(`翌${tomorrow}日は🔒固定されているため「明」を入れられませんでした`, 'error');
      return;
    }
    shifts[staff.no][tomorrow] = '明';
    showToast(`${day}日を管理当直にし、翌${tomorrow}日を「明」にしました`);
  }
}

function openPicker(staff, day) {
  const overlay = document.getElementById('pickerOverlay');
  const grid = document.getElementById('pickerGrid');
  const ptoPanel = document.getElementById('pickerPto');
  const clearBtn = document.getElementById('pickerClear');
  document.getElementById('pickerTitle').textContent = `${staff.name} さん - ${day}日`;
  const [year, month] = getYearMonth();
  const wd = WEEKDAYS_JP[new Date(year, month - 1, day).getDay()];
  document.getElementById('pickerSub').textContent = `${month}月${day}日（${wd}）`;

  const capable = capableCodes(staff);
  const isViceManager = staff.cat && staff.cat.includes('副師長');
  let codes = partTimerCodes(staff);

  function renderShiftGrid() {
    grid.innerHTML = '';
    codes.forEach(code => {
      const base = code[0];
      const outOfScope = deptCodes().includes(base) && !capable.includes(base);
      const opt = document.createElement('div');
      opt.className = 'picker-opt' + (outOfScope ? ' out-of-scope' : '');
      opt.style.background = (codeColors()[base] || '#fff') + '55';
      opt.textContent = code;
      opt.onclick = () => {
        const previous = shifts[staff.no][day];
        shifts[staff.no][day] = code;
        applyOnCallPairing(staff, day, previous, code);
        overlay.classList.remove('open');
        renderStaffList();
        renderMain();
      };
      grid.appendChild(opt);
    });
  }

  function setMode(mode) {
    document.querySelectorAll('.picker-tab').forEach(t => t.classList.toggle('active', t.dataset.mode === mode));
    if (mode === 'shift') {
      grid.style.display = '';
      ptoPanel.style.display = 'none';
      clearBtn.style.display = '';
      clearBtn.textContent = '空欄にする';
      clearBtn.onclick = () => {
        const previous = shifts[staff.no][day];
        delete shifts[staff.no][day];
        applyOnCallPairing(staff, day, previous, '');
        overlay.classList.remove('open');
        renderStaffList();
        renderMain();
      };
    } else {
      grid.style.display = 'none';
      ptoPanel.style.display = '';
      clearBtn.style.display = 'none';
    }
  }

  renderShiftGrid();
  document.querySelectorAll('.picker-tab').forEach(tab => {
    tab.onclick = () => setMode(tab.dataset.mode);
  });
  setMode('shift');

  document.getElementById('ptoSetBtn').onclick = () => {
    shifts.__pto[staff.no][day] = true;
    overlay.classList.remove('open');
    renderStaffList();
    renderMain();
  };
  document.getElementById('ptoClearBtn').onclick = () => {
    delete shifts.__pto[staff.no][day];
    overlay.classList.remove('open');
    renderStaffList();
    renderMain();
  };

  const lockBtn = document.getElementById('pickerLockBtn');
  const locked = isLocked(staff.no, day);
  lockBtn.textContent = locked ? '🔓 この日の固定を解除する' : '🔒 この日を固定する';
  lockBtn.onclick = () => {
    if (locked) delete shifts.__locked[staff.no][day];
    else shifts.__locked[staff.no][day] = true;
    overlay.classList.remove('open');
    renderStaffList();
    renderMain();
    showToast(locked ? `${staff.name}さんの${day}日の固定を解除しました` : `${staff.name}さんの${day}日を固定しました（一括操作で上書きされません）`);
  };

  const absenceBtn = document.getElementById('pickerAbsenceBtn');
  const currentVal = shifts[staff.no][day];
  absenceBtn.style.display = currentVal ? '' : 'none';
  absenceBtn.onclick = () => {
    overlay.classList.remove('open');
    openAbsenceReplacement(staff, day);
  };

  document.getElementById('pickerCancel').onclick = () => overlay.classList.remove('open');

  overlay.classList.add('open');
}

// ============================================================
// ZEST風「急な欠勤の振り替え」: ある人がその日に入れなくなったとき、
// 代われるスタッフを自動で探して候補として出す。候補を選ぶと、その人に
// シフトを移し、欠勤した人はその日を「公」にする。
// 候補の条件（満たさない人は候補に出さない）:
//   ・その科を担当できる（主担当◎ / サブ担当○）※夜勤・救急は担当不問
//   ・その日が空いている（未入力 or 公）かつ休み希望を出していない
//   ・その日が固定（ロック）されていない
//   ・前日が夜勤（准/深）でない（夜勤明けの勤務を作らない）
//   ・パートは夜勤・救急には入れない
// 表示順は「その月の出勤日数が少ない人」優先＝負担が軽い人から。
// ============================================================
let absenceContext = null; // { staffNo, day }

function openAbsenceReplacement(staff, day) {
  absenceContext = { staffNo: staff.no, day };
  const [year, month] = getYearMonth();
  const nDays = daysInMonth(year, month);
  const val = shifts[staff.no][day];
  const base = val ? val[0] : '';
  const isNightOrEmergency = ['准', '深', '救'].includes(val);

  document.getElementById('absenceTitle').textContent = `${staff.name} さんの代わりを探す`;
  document.getElementById('absenceSub').textContent = `${month}月${day}日（${WEEKDAYS_JP[new Date(year, month - 1, day).getDay()]}）の「${val}」を代われる人`;

  const candidates = STAFF.filter(s => {
    if (s.no === staff.no) return false;
    if (isLocked(s.no, day)) return false;
    if (shifts.__pto[s.no] && shifts.__pto[s.no][day]) return false;
    const theirVal = shifts[s.no][day];
    if (theirVal && theirVal !== '公') return false; // already working that day
    const prevVal = day > 1 ? shifts[s.no][day - 1] : '';
    if (prevVal === '准' || prevVal === '深') return false; // post-night rest
    if (isNightOrEmergency) {
      if (s.depTime) return false; // part-timers never take night/emergency
      if (s.nightType === 'none') return false;
      if (val === '准' && s.nightType === 'late_only') return false;
      if (val === '深' && s.nightType === 'evening_only') return false;
      return true;
    }
    return capableCodes(s).includes(base);
  }).map(s => {
    let workDays = 0;
    for (let d = 1; d <= nDays; d++) {
      const v = shifts[s.no][d];
      if (v && v !== '公' && v !== '有') workDays++;
    }
    const isMain = s.main.includes(`(${base})`);
    return { staff: s, workDays, isMain };
  }).sort((a, b) => {
    if (a.isMain !== b.isMain) return a.isMain ? -1 : 1; // 主担当を優先
    return a.workDays - b.workDays;                      // 次に出勤が少ない人
  });

  const list = document.getElementById('absenceList');
  list.innerHTML = '';
  if (!candidates.length) {
    list.innerHTML = '<div class="dashboard-empty">条件を満たす代わりの人が見つかりませんでした。担当設定や休み希望を見直してください。</div>';
  } else {
    candidates.forEach(({ staff: cand, workDays, isMain }) => {
      const btn = document.createElement('button');
      btn.className = 'absence-cand';
      btn.innerHTML = `
        <span>
          <div class="cand-name">${esc(cand.name)}</div>
          <div class="cand-sub">${esc(cand.cat)}${cand.depTime ? ' ・' + cand.depTime + '時まで' : ''} ・今月${workDays}日勤務</div>
        </span>
        <span class="cand-score${isMain ? '' : ' sub'}">${isNightOrEmergency ? '夜勤可' : isMain ? '◎主担当' : '○サブ担当'}</span>
      `;
      btn.onclick = () => {
        const moved = shifts[staff.no][day];
        shifts[cand.no][day] = cand.depTime && deptCodes().includes(base) ? `${base}(${cand.depTime})` : moved;
        shifts[staff.no][day] = '公';
        document.getElementById('absenceOverlay').classList.remove('open');
        renderStaffList();
        renderMain();
        showToast(`${day}日の「${moved}」を ${staff.name}さん → ${cand.name}さん に振り替えました`);
      };
      list.appendChild(btn);
    });
  }

  document.getElementById('absenceOverlay').classList.add('open');
}

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.remove('success', 'error');
  t.classList.add(type === 'error' ? 'error' : 'success');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2600);
}

function exportToExcel() {
  const [year, month] = getYearMonth();
  showLoading(true);
  // yield to the browser so the loading overlay actually paints before the
  // (synchronous, CPU-bound) workbook build blocks the main thread
  setTimeout(() => {
    try {
      const bytes = buildFullWorkbook(STAFF, shifts, year, month, codeColors(), DEPARTMENTS, COMMITTEES, EVENTS);
      const blob = new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      const url = URL.createObjectURL(blob);
      const fname = `外来看護師勤務表_${year}年${month}月.xlsx`;
      const a = document.createElement('a');
      a.href = url;
      a.download = fname;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast(`${fname} をダウンロードしました（全10シート）`);
    } catch (e) {
      showToast('ダウンロードに失敗しました: ' + e.message, 'error');
      console.error(e);
    } finally {
      showLoading(false);
    }
  }, 30);
}

function showLoading(show) {
  document.getElementById('loadingOverlay').classList.toggle('show', show);
}

async function loadExistingFile(file) {
  showLoading(true);
  try {
    const buf = await file.arrayBuffer();
    const sheetData = await readXlsxFile(buf);
    const shiftSheet = sheetData['②シフト表(oplus風)'];
    const ptoSheet = sheetData['⑥休み希望'];
    if (!shiftSheet) {
      throw new Error('②シフト表(oplus風)が見つかりませんでした。このツールで作成したファイル、または同じ形式のファイルを選んでください。');
    }

    // detect year/month from the title cell A1, e.g. "  2026年6月 外来シフト表"
    const titleCell = Object.entries(shiftSheet).find(([ref]) => ref === 'A1');
    let detectedYear = null, detectedMonth = null;
    if (titleCell) {
      const m = String(titleCell[1]).match(/(\d{4})年(\d{1,2})月/);
      if (m) { detectedYear = parseInt(m[1], 10); detectedMonth = parseInt(m[2], 10); }
    }
    if (detectedYear) document.getElementById('yearInput').value = detectedYear;
    if (detectedMonth) document.getElementById('monthInput').value = detectedMonth;
    const [year, month] = getYearMonth();
    const nDays = daysInMonth(year, month);

    // reset state
    STAFF.forEach(s => { shifts[s.no] = {}; shifts.__pto[s.no] = {}; shifts.__locked[s.no] = {}; });

    // ②シフト表 data rows start at row 5, columns C(3) onward = day 1..nDays
    STAFF.forEach((staff, i) => {
      const row = 5 + i;
      const nameCell = shiftSheet[`A${row}`];
      if (nameCell !== staff.name) return; // staff order mismatch safety check, skip if not aligned
      for (let d = 1; d <= nDays; d++) {
        const col = colLetter(2 + d);
        const val = shiftSheet[`${col}${row}`];
        if (val) shifts[staff.no][d] = val;
      }
    });

    // ⑥休み希望 data rows also start at row 5
    if (ptoSheet) {
      STAFF.forEach((staff, i) => {
        const row = 5 + i;
        const nameCell = ptoSheet[`A${row}`];
        if (nameCell !== staff.name) return;
        for (let d = 1; d <= nDays; d++) {
          const col = colLetter(2 + d);
          const val = ptoSheet[`${col}${row}`];
          if (val === '○') shifts.__pto[staff.no][d] = true;
        }
      });
    }

    renderStaffList();
    renderMain();
    showToast(`${file.name} を読み込みました（${year}年${month}月）`);
  } catch (e) {
    showToast('読み込みに失敗しました: ' + e.message, 'error');
    console.error(e);
  } finally {
    showLoading(false);
  }
}

function deptSelectOptions(selectedFullText) {
  // builds <option> markup for main/sub1/sub2 selects: value is the
  // "name (code)" string format used throughout STAFF, e.g. "内視鏡 (内)".
  // An empty "なし" option lets 師長/師長代行 staff have no department.
  const noneOpt = `<option value=""${!selectedFullText ? ' selected' : ''}>なし</option>`;
  const deptOpts = DEPARTMENTS.map(d => {
    const full = `${d.name} (${d.code})`;
    return `<option value="${full}"${full === selectedFullText ? ' selected' : ''}>${full}</option>`;
  }).join('');
  return noneOpt + deptOpts;
}

function saveStaffEdit() {
  const name = document.getElementById('editName').value.trim();
  if (!name) { showToast('氏名を入力してください', 'error'); return; }
  const cat = document.getElementById('editCat').value.trim() || '未設定';
  const main = document.getElementById('editMain').value;
  const sub1 = document.getElementById('editSub1').value;
  const sub2 = document.getElementById('editSub2').value;
  const depTimeRaw = document.getElementById('editDepTime').value;
  const depTime = depTimeRaw ? parseInt(depTimeRaw, 10) : null;
  const nightType = document.getElementById('editNightType').value;
  const committees = Array.from(document.querySelectorAll('#editCommittees input[type="checkbox"]:checked')).map(el => parseInt(el.value, 10));

  if (editingStaffNo !== null) {
    const staff = STAFF.find(s => s.no === editingStaffNo);
    Object.assign(staff, { name, cat, main, sub1, sub2, depTime, nightType, committees });
  } else {
    const newNo = STAFF.length ? Math.max(...STAFF.map(s => s.no)) + 1 : 1;
    STAFF.push({ no: newNo, name, cat, main, sub1, sub2, depTime, nightType, committees });
    shifts[newNo] = {};
    shifts.__pto[newNo] = {};
    shifts.__locked[newNo] = {};
  }
  closeStaffEdit();
  saveState();
  renderSidebarStaffManagement();
  showToast(`${name} さんを保存しました`);
}

function deleteStaff(staffNo) {
  const staff = STAFF.find(s => s.no === staffNo);
  if (!confirm(`${staff.name} さんを削除します。入力済みのシフト・休み希望も削除されます。よろしいですか？`)) return;
  STAFF = STAFF.filter(s => s.no !== staffNo);
  delete shifts[staffNo];
  delete shifts.__pto[staffNo];
  delete shifts.__locked[staffNo];
  if (currentStaffIdx === staffNo) currentStaffIdx = null;
  saveState();
  renderSidebarStaffManagement();
  showToast(`${staff.name} さんを削除しました`);
}

  document.getElementById('editDeptName').value = dept ? dept.name : '';
  document.getElementById('editDeptColor').value = dept ? dept.color : '#FFE4B5';
  document.getElementById('editDeptRequired').value = dept ? dept.required : 1;

  overlay.classList.add('open');
}

function closeDeptEdit() {
  document.getElementById('deptEditOverlay').classList.remove('open');
  editingDeptCode = null;
}

function saveDeptEdit() {
  const code = document.getElementById('editDeptCode').value.trim();
  const name = document.getElementById('editDeptName').value.trim();
  const color = document.getElementById('editDeptColor').value;
  const required = parseInt(document.getElementById('editDeptRequired').value, 10) || 0;

  if (!code || code.length !== 1) { showToast('記号は1文字で入力してください', 'error'); return; }
  if (!name) { showToast('科の名前を入力してください', 'error'); return; }
  if (NON_DEPT_CODES.concat(['代', '当', '明', '直']).includes(code)) {
    showToast(`「${code}」は救急・夜勤・公休などで使用済みのため使えません`, 'error');
    return;
  }
  const duplicate = DEPARTMENTS.find(d => d.code === code && d.code !== editingDeptCode);
  if (duplicate) { showToast(`記号「${code}」は既に「${duplicate.name}」で使われています`, 'error'); return; }

  if (editingDeptCode !== null) {
    const dept = DEPARTMENTS.find(d => d.code === editingDeptCode);
    const oldCode = dept.code;
    Object.assign(dept, { code, name, color, required });
    // if the code itself changed, the simplest consistent behavior is to
    // leave existing shift entries untouched (they keep referencing the
    // old character) -- warn the user instead of silently rewriting data.
    if (oldCode !== code) {
      showToast(`記号を「${oldCode}」→「${code}」に変更しました。既存の入力済みシフトは手動で見直してください。`);
    }
  } else {
    DEPARTMENTS.push({ code, name, color, required });
  }
  closeDeptEdit();
  saveState();
  renderSidebarDeptManagement();
  showToast(`${name} を保存しました`);
}

function deleteDept(code) {
  const dept = DEPARTMENTS.find(d => d.code === code);
  const usedBy = STAFF.filter(s => [s.main, s.sub1, s.sub2].some(v => v.includes(`(${code})`)));
  let msg = `${dept.name} を削除します。`;
  if (usedBy.length) msg += `\n注意: ${usedBy.length}名のスタッフがこの科を担当に設定しています（削除後は手動で設定を見直してください）。`;
  if (!confirm(msg + '\nよろしいですか？')) return;
  DEPARTMENTS = DEPARTMENTS.filter(d => d.code !== code);
  saveState();
  renderSidebarDeptManagement();
  showToast(`${dept.name} を削除しました`);
}

      登録した予定は「個人ごとに入力」画面のカレンダーと「全員一覧」画面の表に表示され、シフトを組む際の目安になります。
    </div>
  `;
}

function openEventEdit(id) {
  editingEventId = id;
  const overlay = document.getElementById('eventEditOverlay');
  const ev = id !== null ? EVENTS.find(e => e.id === id) : null;
  const [, , nDaysDefault] = [0, 0, daysInMonth(...getYearMonth())];

  document.getElementById('eventEditTitle').textContent = ev ? '予定を編集' : '新しい予定を追加';
  document.getElementById('editEventDay').value = ev ? ev.day : '';
  document.getElementById('editEventDay').max = String(nDaysDefault);
  document.getElementById('editEventTitle').value = ev ? ev.title : '';
  document.getElementById('editEventColor').value = ev ? ev.color : '#607D8B';

  const committeeSelect = document.getElementById('editEventCommittee');
  committeeSelect.innerHTML = '<option value="">（自由入力・委員会以外の予定）</option>' +
    COMMITTEES.map(c => `<option value="${c.id}">${esc(c.name)}の会議</option>`).join('');
  committeeSelect.value = '';
  committeeSelect.onchange = () => {
    const committee = COMMITTEES.find(c => c.id === parseInt(committeeSelect.value, 10));
    if (committee) {
      document.getElementById('editEventTitle').value = `${committee.name}の会議`;
      document.getElementById('editEventColor').value = committee.color;
    }
  };

  overlay.classList.add('open');
}

function closeEventEdit() {
  document.getElementById('eventEditOverlay').classList.remove('open');
  editingEventId = null;
}

function saveEventEdit() {
  const [year, month] = getYearMonth();
  const nDays = daysInMonth(year, month);
  const day = parseInt(document.getElementById('editEventDay').value, 10);
  const title = document.getElementById('editEventTitle').value.trim();
  const color = document.getElementById('editEventColor').value;

  if (!day || day < 1 || day > nDays) { showToast(`日付は1〜${nDays}の範囲で入力してください`, 'error'); return; }
  if (!title) { showToast('内容を入力してください', 'error'); return; }

  if (editingEventId !== null) {
    const ev = EVENTS.find(e => e.id === editingEventId);
    Object.assign(ev, { day, title, color });
  } else {
    EVENTS.push({ id: nextEventId++, day, title, color });
  }
  closeEventEdit();
  saveState();
  renderSidebarEventManagement();
  showToast(`${month}/${day} の予定を保存しました`);
}

function deleteEvent(id) {
  const ev = EVENTS.find(e => e.id === id);
  if (!confirm(`「${ev.title}」を削除します。よろしいですか？`)) return;
  EVENTS = EVENTS.filter(e => e.id !== id);
  saveState();
  renderSidebarEventManagement();
  showToast('予定を削除しました');
}

function shiftMonth(delta) {
  const yearInput = document.getElementById('yearInput');
  const monthInput = document.getElementById('monthInput');
  let year = parseInt(yearInput.value, 10);
  let month = parseInt(monthInput.value, 10) + delta;
  if (month < 1) { month = 12; year -= 1; }
  else if (month > 12) { month = 1; year += 1; }
  yearInput.value = year;
  monthInput.value = month;
  renderMain();
}

// ============================================================
// 自動生成: 既存の入力（シフト・休み希望）は残し、未入力の日だけを
// 埋める。優先順位は合意した通り:
//   1. 休み希望（最優先、絶対に守る）
//   2. 各科の必要人数を満たす
//   3. 担当可能な科のみ割り当てる
//   4. 連続出勤は最大4日
//   5. 夜勤（准/深）の翌日は休み
//   6. パートは夜勤・救急対象外
// 完璧に満たせない日は「公」で埋め、後で人が見直せるようにする
// （無理に基準を破ってまで埋めることはしない）。
// ============================================================
function runAutoGenerate() {
  const [year, month] = getYearMonth();
  const nDays = daysInMonth(year, month);

  if (!confirm('入力済みのシフト・休み希望はそのまま残し、未入力の日だけを自動で埋めます。よろしいですか？')) return;

  showLoading(true);
  setTimeout(() => {
    try {
      const result = autoFillSchedule(STAFF, shifts, DEPARTMENTS, year, month, nDays);
      renderStaffList();
      renderMain();
      showToast(`自動生成しました（${result.filledCount}件を入力、${result.shortageCount}件は人数不足のまま残っています）`);
    } catch (e) {
      showToast('自動生成に失敗しました: ' + e.message, 'error');
      console.error(e);
    } finally {
      showLoading(false);
    }
  }, 30);
}

function autoFillSchedule(STAFF, shifts, DEPARTMENTS, year, month, nDays) {
  // Track running state per staff as we sweep day 1 -> nDays.
  const state = {};
  STAFF.forEach(s => {
    state[s.no] = { workStreak: 0, nightStreak: 0, deptCounts: {}, nightCount: 0, totalWork: 0, actingCount: 0 };
    DEPARTMENTS.forEach(d => { state[s.no].deptCounts[d.code] = 0; });
  });

  function codeOf(val) { return val ? val[0] : ''; }
  function isWorkCode(val) { return val !== '' && val !== '公' && val !== '有'; }
  function isNightCode(val) { return val === '准' || val === '深'; }

  let filledCount = 0;
  let shortageCount = 0;

  for (let d = 1; d <= nDays; d++) {
    // First, lock in PTO -> 公 for anyone who hasn't already got a cell value today.
    STAFF.forEach(staff => {
      const pto = shifts.__pto[staff.no] && shifts.__pto[staff.no][d];
      const existing = shifts[staff.no][d];
      if (pto && !existing) {
        shifts[staff.no][d] = '公';
      }
    });

    const wd = new Date(year, month - 1, d).getDay();
    const isWeekend = wd === 0 || wd === 6;
    const isHolidayToday = isJapaneseHoliday(year, month, d);
    const isWeekendOrHoliday = isWeekend || isHolidayToday;
    function isOffDay(dd) {
      if (dd < 1 || dd > nDays) return false;
      const w = new Date(year, month - 1, dd).getDay();
      return w === 0 || w === 6 || isJapaneseHoliday(year, month, dd);
    }
    const tomorrowIsWeekendOrHoliday = isOffDay(d + 1);

    // Today's targets: 救急 only applies on weekends/holidays。准夜・深夜は
    // 毎日必要だが人数が違う。平日・土日祝のどちらも設定タブで月ごとに
    // 変更できる（月によって必要人数が変わるため固定値にはしない）。
    const todayReq = isWeekendOrHoliday
      ? { '救': NIGHT_REQUIREMENTS.weekendDay, '准': NIGHT_REQUIREMENTS.weekendEvening, '深': NIGHT_REQUIREMENTS.weekendLate }
      : { '救': 0, '准': NIGHT_REQUIREMENTS.weekdayEvening, '深': NIGHT_REQUIREMENTS.weekdayLate };

    // --- 師長の日勤(日)と、不在時の師長代行(代) ---
    //
    // 師長は原則、平日は日勤。担当科を持たずブースに入らないため各科の
    // 割り当てからは漏れてしまい、放っておくと平日まで「公」になる。
    // 土日祝は日勤を置かず「公」のままにする。
    //
    // 師長が平日に不在（休み希望・有給・手入力で休みにした日など）の
    // ときは、副師長のどちらかが師長代行として「代」に入る。副師長は
    // 2人いるので、その月の代行回数が少ない方を選び、同数なら出勤日数が
    // 少ない方を選ぶことで、2人の間で自然に交代していく。
    //
    // このパスを夜勤・各科の割り当てより前に置いているのは、代行に入る
    // べき副師長が先に夜勤やブースで埋まってしまうのを防ぐため。
    const kancho = STAFF.find(s => s.cat === '師長');
    if (kancho) {
      // 管理当直(当)の翌日は必ず明け(明)。土日祝であっても当直明けは
      // 当直明けなので、曜日に関係なく先に埋める。
      const kanchoPrev = d > 1 ? shifts[kancho.no][d - 1] : '';
      if (kanchoPrev === '当' && !shifts[kancho.no][d] && !isLocked(kancho.no, d)) {
        shifts[kancho.no][d] = '明';
        filledCount++;
      } else if (!isWeekendOrHoliday && !shifts[kancho.no][d] && !isLocked(kancho.no, d)) {
        shifts[kancho.no][d] = '日';
        filledCount++;
      }
    }
    if (!isWeekendOrHoliday) {
      // 代行が要るかどうかは「師長がその日の日勤(日)に入っているか」で
      // 判断する。管理当直(当)の日も当直明け(明)の日も師長は日勤に入ら
      // ないため、どちらも副師長が代行に入る。
      const kanchoOnDuty = kancho && shifts[kancho.no][d] === '日';
      const actingAlready = STAFF.some(s => shifts[s.no][d] === '代');
      if (kancho && !kanchoOnDuty && !actingAlready) {
        const deputies = STAFF.filter(s =>
          s.cat && s.cat.includes('副師長') &&
          !shifts[s.no][d] && !isLocked(s.no, d) &&
          state[s.no].nightStreak === 0 &&   // 夜勤明けは休ませる
          state[s.no].workStreak < 4         // 連続出勤の上限は代行にも適用
        );
        deputies.sort((a, b) => {
          const actDiff = state[a.no].actingCount - state[b.no].actingCount;
          if (actDiff !== 0) return actDiff;
          return state[a.no].totalWork - state[b.no].totalWork;
        });
        if (deputies.length) {
          shifts[deputies[0].no][d] = '代';
          state[deputies[0].no].actingCount++;
          filledCount++;
        } else {
          shortageCount++; // 代行に入れる副師長がいない日
        }
      }
    }

    // --- night shift (准/深) and 救急 assignment, every day, using
    //     today's targets computed above.
    //
    //     Per-staff nightType constraints:
    //       'none'         -> never assigned 准/深 (救急 still allowed)
    //       'evening_only' -> only ever assigned 准 (never 深)
    //       'late_only'    -> only ever assigned 深 (never 准)
    //       'set_required' -> if assigned a night at all, must get BOTH
    //                         准 today AND 深 tomorrow (only attempted when
    //                         tomorrow also has a 深 requirement); handled
    //                         in its own pass before the normal tiered fill
    //                         so it doesn't get partially assigned.
    //       'free'         -> no restriction (today's existing behavior)
    //
    //     Preference order otherwise unchanged: (1) someone NOT already on
    //     a night-shift streak, falling back to (2) a 2nd consecutive
    //     night only if short-staffed (3rd consecutive never allowed). ---
    {
      // Pass 0: try to satisfy 准 demand today using set_required staff,
      // which simultaneously commits their 深 tomorrow (only possible when
      // tomorrow also has a 深 requirement > 0 to draw down).
      const tomorrowReq = tomorrowIsWeekendOrHoliday
        ? NIGHT_REQUIREMENTS.weekendLate
        : (d + 1 <= nDays ? NIGHT_REQUIREMENTS.weekdayLate : 0);
      if (tomorrowReq > 0) {
        const alreadyEvening = STAFF.filter(s => shifts[s.no][d] === '准').length;
        let needEvening = todayReq['准'] - alreadyEvening;
        if (needEvening > 0) {
          let setCandidates = STAFF.filter(s =>
            !shifts[s.no][d] && !shifts[s.no][d + 1] && !s.depTime &&
            !isLocked(s.no, d) && !isLocked(s.no, d + 1) &&
            s.nightType === 'set_required' &&
            state[s.no].workStreak < 4 && state[s.no].nightStreak === 0
          );
          setCandidates.sort((a, b) => state[a.no].nightCount - state[b.no].nightCount);
          for (let i = 0; i < setCandidates.length && needEvening > 0; i++) {
            shifts[setCandidates[i].no][d] = '准';
            shifts[setCandidates[i].no][d + 1] = '深';
            filledCount += 2;
            needEvening--;
          }
        }
      }

      ['救', '准', '深'].forEach(code => {
        const already = STAFF.filter(s => shifts[s.no][d] === code).length;
        let need = todayReq[code] - already;
        if (need <= 0) return;
        const isNightShiftCode = code === '准' || code === '深';

        const nightTypeAllows = s => {
          if (!isNightShiftCode) return true; // 救急 unaffected by night-type
          if (s.nightType === 'none' || s.nightType === 'set_required') return false; // set_required handled in pass 0 only
          if (s.nightType === 'evening_only') return code === '准';
          if (s.nightType === 'late_only') return code === '深';
          return true; // 'free' or unset
        };
        // 師長は原則日勤のみでブースにも夜勤にも入らないため対象外。
        // パート(depTime)も土日祝は原則休みのため自動配置しない（イレギュラー
        // 出勤は手入力で「日」「救」を入れる運用）。
        // 副師長は土日祝は管理日直(直)に入るため、救急外来(救)には入れない
        // （准夜・深夜には従来どおり入る）。日直そのものは手入力で登録する
        // ため、ここでは「救急に入れない」ことだけを担保している。
        const isEmergency = code === '救';
        const baseEligible = s => !shifts[s.no][d] && !isLocked(s.no, d) && !s.depTime && s.cat !== '師長' &&
          !(isEmergency && isDeputy(s)) &&
          state[s.no].workStreak < 4 && nightTypeAllows(s);
        const nightSort = (a, b) => {
          const nightDiff = state[a.no].nightCount - state[b.no].nightCount;
          if (nightDiff !== 0) return nightDiff;
          return state[a.no].totalWork - state[b.no].totalWork;
        };

        // Tier 1: fresh (no night-shift streak running) -- always tried first.
        let tier1 = STAFF.filter(s => baseEligible(s) && (!isNightShiftCode || state[s.no].nightStreak === 0));
        tier1.sort(nightSort);
        for (let i = 0; i < tier1.length && need > 0; i++) {
          shifts[tier1[i].no][d] = code;
          filledCount++;
          need--;
        }

        // Tier 2 (night codes only): short-staffed, so allow extending
        // someone's streak to a 2nd consecutive night (still capped at 2).
        // set_required staff are excluded here too -- their 2nd night must
        // come from pass 0's deliberate pairing, not an ad-hoc extension.
        if (need > 0 && isNightShiftCode) {
          let tier2 = STAFF.filter(s => baseEligible(s) && state[s.no].nightStreak === 1);
          tier2.sort(nightSort);
          for (let i = 0; i < tier2.length && need > 0; i++) {
            shifts[tier2[i].no][d] = code;
            filledCount++;
            need--;
          }
        }
        if (need > 0) shortageCount++;
      });
    }

    // Figure out which staff are still unfilled for today AFTER the PTO + night/救急 pass.
    const unfilled = STAFF.filter(s => !shifts[s.no][d]);

    // Determine today's required headcount per department (weekday only,
    // matching the existing 必要人数(平日) convention used elsewhere;
    // weekends/holidays don't staff regular departments in this model).
    if (!isWeekendOrHoliday) {
      DEPARTMENTS.forEach(dept => {
        const alreadyAssigned = STAFF.filter(s => codeOf(shifts[s.no][d]) === dept.code).length;
        let need = dept.required - alreadyAssigned;
        if (need <= 0) return;

        // Build a candidate pool: unfilled staff who can cover this department,
        // aren't already night-resting, haven't hit the 4-day work streak cap.
        // Part-timers ARE eligible for regular departments (only night/救急 excluded).
        let candidates = unfilled.filter(s => {
          if (shifts[s.no][d]) return false; // got assigned earlier in this same day's loop
          if (isLocked(s.no, d)) return false; // 固定した枠は自動生成でも触らない
          if (state[s.no].nightStreak > 0) return false; // resting the day after any night shift
          if (state[s.no].workStreak >= 4) return false;
          const capable = capableCodes(s);
          return capable.includes(dept.code);
        });
        // Prefer whoever has worked the FEWEST total days this month so far
        // (overall fairness), then whoever has worked this specific
        // department the least (so no one gets stuck always covering the
        // same low-quota department while others rotate).
        candidates.sort((a, b) => {
          const totalDiff = state[a.no].totalWork - state[b.no].totalWork;
          if (totalDiff !== 0) return totalDiff;
          return state[a.no].deptCounts[dept.code] - state[b.no].deptCounts[dept.code];
        });

        for (let i = 0; i < candidates.length && need > 0; i++) {
          const s = candidates[i];
          const code = s.depTime ? `${dept.code}(${s.depTime})` : dept.code;
          shifts[s.no][d] = code;
          filledCount++;
          need--;
        }
        if (need > 0) shortageCount++; // couldn't fully staff this dept today
      });
    }

    // Anyone still unfilled today becomes 公 (safe default; never violates
    // the 4-day streak or night-rest rules since 公 is rest).
    STAFF.forEach(s => {
      if (!shifts[s.no][d] && !isLocked(s.no, d)) {
        shifts[s.no][d] = '公';
        filledCount++;
      }
    });

    // Update running state for tomorrow's pass based on today's final values.
    STAFF.forEach(s => {
      const val = shifts[s.no][d];
      const code = codeOf(val);
      if (isWorkCode(val)) {
        state[s.no].workStreak++;
        state[s.no].totalWork++;
        if (DEPARTMENTS.some(dp => dp.code === code)) state[s.no].deptCounts[code]++;
        if (isNightCode(val)) state[s.no].nightCount++;
      } else {
        state[s.no].workStreak = 0;
      }
      state[s.no].nightStreak = isNightCode(val) ? state[s.no].nightStreak + 1 : 0;
    });
  }

  return { filledCount, shortageCount };
}

const restored = loadState();
switchMode('shift');
if (restored) showToast('前回の入力内容を復元しました');
